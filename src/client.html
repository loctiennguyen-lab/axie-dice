<style>
/* ============================================================
   AXIE DICE TACTICS — visual system v0.8
   Rules this file follows, so it stays clean as it grows:
   1. The background is neutral. Colour is reserved for meaning.
   2. Six type sizes. Nothing else.
   3. One border weight, two radii, spacing on a 4px grid.
   4. Glow marks exactly four things: your selection, a legal
      target, Mythic rarity, and Echo Tier prestige frames (opt-in,
      end-game, invisible at tier 0). Nothing else glows.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ═══ TYPE — 6 bậc, sàn 11px (L1/L2) ═══ */
  --t1: 11px;   /* nhãn ALL-CAPS ≤12 ký tự: WAVE, MANA, BACK, HORN — tools/verify.mjs
                   A4 hardcodes this exact value, do not change it; protect its
                   legibility via fitUI()'s scale floor instead (see ui.js) */
  --t2: 13px;   /* chữ phụ, chip, số nhỏ, keyword xúc xắc */
  --t3: 15px;   /* BODY MẶC ĐỊNH — mô tả, tooltip, Codex, passive */
  --t4: 20px;   /* tiêu đề section, nhãn nút lớn, intent địch */
  --t5: 28px;   /* tiêu đề màn hình */
  --t6: 44px;   /* logo */
  --die-num: 34px;
  --die-kw:  13px;
  --intent-v:20px;
  --float-sz:28px;
  --icon-sm: 14px; --icon-md: 24px;
  /* 2026-09-10: product-owner UI handoff — swap the pixel/monospace identity
     for a plain humanist sans matching the new mockup's "Work Sans" look.
     Can't actually load Work Sans (hard constraint: no runtime network
     fetches, single static HTML file — see .claude/docs/technical-
     preferences.md and the 2026-09-01 spec's own rejected-base64-embed
     note below) — this system-font stack is the same shape family (geometric
     humanist sans) every OS already ships, so the swap needs no new asset. */
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* 2026-09-01: Lunacia Void redesign §2.2/§2.3 — second weight + display face
     for chrome text. Fallback system-sans stack (base64 font embed rejected
     for this pass — see docs/art/visual-redesign-2026-09-01.md §2.3). */
  --fw-action: 700;
  --fw-prose:  500;
  --font-brand: ui-sans-serif, "Segoe UI", system-ui, sans-serif;

  /* ═══ SPACING — lưới 4px ═══ */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* 2026-09-01: two-tier canonical card padding (§4.2) */
  --card-pad-sm: var(--s3);
  --card-pad:    var(--s4);
  /* 2026-09-01: named offset for the HP-number reserve above the bar (§3.7) */
  --hp-num-offset: 20px;

  /* ═══ CONTROL — 3 cỡ ═══ */
  --ctl-sm:32px; --ctl-md:40px; --ctl-lg:48px; --tap-min:44px;

  /* ═══ SURFACE — --line2 gánh việc phân định component (1.4.11) ═══ */
  /* 2026-09-10: product-owner UI handoff (Battle UI + Non-Battle UI mockups) —
     neutrals rotated a second time, off violet-black onto the mockup's own
     dark blue-gray ("Lunacia Void" §1.2 is superseded here; kept the token
     NAMES and the "one hue-identity for the neutral scale" structure it
     established, since that structure is still sound — only the hue itself
     changed on explicit request). Semantic/rarity/class colors below are
     mostly untouched — see the per-token notes for the few that moved and why. */
  --bg:    #0D0E12;
  --bg-top:#15171d;
  --pan:   #1C1F25;
  --pan2:  #13161B;
  --pan3:  #262A32;
  --pan-hi:#20232a;   /* "Table plane" (unit/die) — one step between pan2 and pan3 */
  --line:  #282C34;   /* kẻ TRANG TRÍ */
  /* mockup's own #3C424D measures 1.6-1.9:1 against our surfaces — fails
     WCAG 1.4.11 (≥3:1, tools/verify.mjs A6). Lightened within the same
     blue-gray hue until it clears --bg/--pan/--pan3 with margin. */
  --line2: #6f7a8e;   /* VIỀN CARD */
  /* 2026-09-01: depth token cho "Table plane" (unit/die) — KHÔNG dùng cho Deck plane
     (btn/icard/bottombar/track giữ nguyên phẳng, xem docs/review UI 2026-09-01) */
  --sh-card: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.5);
  --sh-hero: 0 1px 0 rgba(255,255,255,.06) inset, 0 4px 0 rgba(0,0,0,.45), 0 10px 22px rgba(0,0,0,.55);
  --radius:14px; --rad-sm:10px; --bd:1px;

  /* ═══ TEXT ═══ */
  --txt:#ffffff;
  /* Verified via tools/verify.mjs A2 (WCAG AA ≥4.5:1): #8E97A8 on --pan
     (#1C1F25) is 5.6:1, on --pan-hi guess 4.9:1, on --bg 6.6:1 — holds the
     bar across every surface --dim actually renders on. */
  --dim:#8E97A8;
  /* mockup's #5B6372 only measures 2.7:1 on --pan — disabled text still has
     an AA floor here (≥3:1, tools/verify.mjs A2), it isn't fully exempt.
     Lightened within the same hue to clear it. */
  --off:#6f7a8e;   /* CHỈ cho [disabled] */

  /* ═══ SEMANTIC ═══ */
  --acc: #FF9345;
  --heal:#3FCD3C;
  --shd: #31C6FF;
  /* mockup's own #894DFF only measures 3.9:1 against --pan2 (.mv mana value
     text) — fails AA (≥4.5:1). Lightened within the same purple hue. */
  --man: #bf6bff;
  --dmg: #F54540;
  /* --poi/--deb kept as-is: the mockup doesn't define these two, and both
     already sit far enough from the new --heal/--dmg hues to stay collision-
     free — no reason to touch a tested pair. --burn nudged redder (was
     #ff9a4d, nearly identical hue to the OLD gold --acc and therefore fine)
     because the NEW --acc is itself orange — #ff9a4d sat right on top of it. */
  --poi: #a8d84a; --burn:#FF5C33; --deb:#ff8fc7;
  --ally: #4fd1c5; /* "YOUR TEAM" zone label only — never reused for HP/status meaning */

  /* ═══ HP — mã hoá % HP, không mã hoá phe (L6) ═══ */
  --hp-full:#3FCD3C;
  --hp-low: #ffc857;   /* unchanged on purpose — no longer collides with --acc now that --acc is orange, not gold */
  --hp-crit:#F54540;
  --hp-h:8px;
  --hp-ink:#0b0e12;

  /* ═══ RARITY ═══ */
  --r0:#9aa4b2; --r1:#63b3ff; --r2:#b388ff; --r3:#ffc857; --r4:#ff5f8f;

  /* ═══ LAYOUT ═══ */
  --unit-w:172px; --die-w:176px; --die-h:164px;
  /* Battle UI redesign — party card width is computed in JS from the live
     party count (scCombat(): cardW = floor((board-w - gap*(n-1))/n)), not
     a fixed per-breakpoint token like --unit-w above. --board-w is that
     formula's "usable width" input, read via getComputedStyle at render
     time; it tracks #app's real content width (max-width:1240px, 12px
     side padding, see #app below) at each of the same breakpoints T10
     already defines for everything else, so it never needs its own. */
  --board-w:1204px;
  --spr-w:100px; --spr-big:164px; --spr-guide:64px;
  --zone-gap:12px;
  --ui-scale:1;
}
html,body{height:100%}
html,body{font-size:var(--t3);font-family:var(--font)}
/* Stop the body's gradient from tearing/shifting during pull-to-refresh /
   rubber-band overscroll on mobile — the page itself never needs that bounce. */
html,body{overscroll-behavior-y:none}
body{background-color:var(--bg);color:var(--txt);
  font-weight:var(--fw-prose);letter-spacing:normal;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* Game-wide background art (art6.js MENU_BG, --menu-bg custom prop set once
   at load — see ui.js header) lives on `#bgLayer`, a `position:fixed` div
   that is a SIBLING of `#app` in the DOM (build.py's template), never a
   descendant — deliberately, after a real rendering bug: `#app` carries a
   CSS `zoom:var(--ui-scale)` for the UI-scale feature, and a background
   painted on `body`/any #app ANCESTOR visibly desyncs from the true
   viewport wherever it shows through #app's transparent areas once zoom is
   anything but 1 — the zoomed subtree's own compositing pass rounds
   slightly differently, painting a faint rectangle at #app's exact bounds
   (the "white box" the login screen showed; switching
   background-attachment alone did not fix it, only moving the art fully
   outside the zoomed subtree did). `#bgLayer{z-index:-1}` sits behind #app
   and every other sibling but above body's own flat color, is
   `pointer-events:none` (purely decorative), and covers the FULL viewport
   via `inset:0` regardless of #app's own max-width:1240px column — the old
   per-screen approach before that left plain var(--bg)-colored bars down
   both sides on any window wider than that column, the original "ugly
   black letterbox" complaint. Applies to every screen, combat included
   (explicit product decision). var(--menu-bg,none) degrades to nothing on
   a build missing art6.js, which still leaves the plain scrim+var(--bg)
   look below, never a broken image. */
#bgLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(180deg, rgba(10,6,20,.55) 0%, rgba(10,6,20,.82) 480px, var(--bg) 900px),
  var(--menu-bg, none);
  background-color:var(--bg);
  background-size:auto,cover;
  background-position:0 0,center;
  background-repeat:no-repeat,no-repeat;
}
/* Title/gate screen only (render() toggles this class on #bgLayer — see
   ui.js): 2 extra drifting glow layers ON TOP of the same scrim+image,
   listed here as a full 4-layer override (not a second `background` rule —
   those don't stack). menuDrift only animates the first 2 positions; the
   scrim/image position is repeated per-frame so it never drifts with them. */
#bgLayer.bg-glow{background:
  radial-gradient(circle at 20% 15%, rgba(179,136,255,.12), transparent 55%),
  radial-gradient(circle at 80% 75%, rgba(255,200,87,.08), transparent 60%),
  linear-gradient(180deg, rgba(10,6,20,.55) 0%, rgba(10,6,20,.82) 480px, var(--bg) 900px),
  var(--menu-bg, none);
  background-color:var(--bg);
  background-size:140% 140%,140% 140%,auto,cover;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
  animation:menuDrift 40s ease-in-out infinite alternate;
}
/* Active-run lock (screen==='combat' covers map/event/shop/reward/combat/
   win-lose — see render() in ui.js): only suppress touch-driven page drag
   (which fights the dice drag-and-drop on mobile) via touch-action:none.
   Deliberately NOT overflow:hidden — the combat screen can be taller than
   the viewport (many units/wave nodes), and clipping it there made the
   bottom action bar unreachable on desktop, where scroll is mouse/wheel
   driven, not touch. Menu/list screens never get this class either way. */
body.locked-scroll{touch-action:none}
img.spr{image-rendering:pixelated;display:block;
  width:var(--spr-w);height:var(--spr-w);object-fit:contain;object-position:center bottom;margin:0 auto}
/* "ID card" framing for real Axie NFT art (art-director consult, 2026-09-03,
   see realArtWrap() in ui.js) — a deliberate gold frame + corner badge marks
   real painterly Axie art as a distinct kind of object from the house pixel-
   sprite style, rather than letting the two incompatible renderings sit in
   identical unframed slots (which read as broken/placeholder art). Wrapper
   carries no layout of its own — `.real img` still inherits every existing
   `.spr`/`.vchip-thumb`/etc size rule via the ordinary descendant selectors,
   this only adds the frame/glow on top. `.axie-id:not(.real)` (the sprite
   fallback path, incl. after an onerror) is intentionally unstyled. */
.axie-id{position:relative;display:inline-block;line-height:0}
/* object-position:center (NOT the inherited img.spr "center bottom") — real
   art PNGs don't share one fixed aspect ratio the way procedurally-generated
   pixel sprites do (each Hero/Vault portrait is whatever size the source
   asset happens to be), so bottom-anchoring inside the shared square
   .spr box left a different amount of empty headroom above each one,
   reading as "every Hero's frame sits at a slightly different height" —
   centering is the one anchor that stays correct regardless of the
   source image's own aspect ratio. */
.axie-id.real img{image-rendering:auto;border-radius:8px;object-position:center;
  box-shadow:0 0 0 2px var(--acc),0 0 10px #FF934566}
.axie-id-badge{position:absolute;bottom:-3px;right:-3px;width:15px;height:15px;
  background:var(--acc);color:#291808;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:8px;font-weight:900;box-shadow:0 0 0 2px var(--pan);
  pointer-events:none}
/* House art (real, official, non-NFT Axie art) — deliberately NO badge, see
   houseArtWrap(). Frame colour is per-unit (--hc, set inline from
   CLASS_COLOR), quieter than the NFT gold glow so the two never look
   interchangeable at a glance. */
.house-art{position:relative;display:inline-block;line-height:0}
/* object-position:center — same fix/reasoning as .axie-id.real img above:
   the 6 Hero portraits (and their tier1-vs-awaken variants) are 10
   differently-proportioned source PNGs, not one consistent canvas like the
   pixel sprites this box was originally sized for. */
.house-art.real img{image-rendering:auto;border-radius:8px;object-position:center;
  box-shadow:0 0 0 2px var(--hc,var(--line2))}
button{font-family:inherit;font-weight:700;cursor:pointer;color:var(--txt);letter-spacing:.5px}
#app{max-width:1240px;margin:0 auto;padding:8px 12px 16px;transition:filter .06s;zoom:var(--ui-scale)}
#app.hstop{filter:brightness(1.8) contrast(1.3)}
/* Accessibility: "REDUCE FLASH EFFECTS" setting / OS prefers-reduced-motion —
   a much smaller brightness/contrast punch instead of skipping feedback outright. */
#app.hstop-lite{filter:brightness(1.15) contrast(1.05)}
h1,h2,h3,h4{font-weight:700}
.scr{overflow-y:auto}

/* screen-wide feedback */
.shk1{animation:sk .22s} .shk2{animation:sk2 .3s} .shk3{animation:sk3 .4s}
@keyframes sk{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
@keyframes sk2{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}45%{transform:translate(6px,-3px)}70%{transform:translate(-4px,2px)}}
@keyframes sk3{0%,100%{transform:translate(0) rotate(0)}15%{transform:translate(-12px,6px) rotate(-.6deg)}
  40%{transform:translate(10px,-5px) rotate(.5deg)}65%{transform:translate(-7px,3px) rotate(-.3deg)}85%{transform:translate(4px,-2px)}}
.flashfx{position:fixed;inset:0;pointer-events:none;z-index:200;animation:fl .3s ease-out forwards}
.flashfx.gold{background:radial-gradient(circle,#ffc85744,transparent 70%)}
.flashfx.myth{background:radial-gradient(circle,#ff5f8f66,#b388ff22 40%,transparent 75%)}
.flashfx.dmg{background:radial-gradient(circle,#ff6b6b44,transparent 70%)}
/* Accessibility: "REDUCE FLASH EFFECTS" setting / OS prefers-reduced-motion —
   trade the full-viewport radial burst for a thin top-edge accent at a quarter
   of the opacity. Still reads as "something big just happened" without the
   whole screen lighting up. */
.flashfx.low{background:none!important;border-top:6px solid;animation-name:flLow}
.flashfx.low.gold{border-color:#ffc857}
.flashfx.low.myth{border-color:#ff5f8f}
.flashfx.low.dmg{border-color:#ff6b6b}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@keyframes flLow{0%{opacity:.35}100%{opacity:0}}
.bigfx{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:56px;color:var(--r4);z-index:201;
  pointer-events:none;text-shadow:0 0 26px #ff5f8f,0 5px 0 #000;animation:bgf 1.1s ease-out forwards;letter-spacing:8px}
.bigfx.win{color:var(--heal);text-shadow:0 0 26px var(--heal),0 5px 0 #000}
.bigfx.lose{color:var(--dmg);text-shadow:0 0 26px var(--dmg),0 5px 0 #000}
@keyframes bgf{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.12)}
  60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}

/* ---------- T07 · buttons: three sizes, nothing else ---------- */
.btn{
  box-sizing:border-box;
  --btn-h:var(--ctl-md);
  position:relative;                 /* BẮT BUỘC cho ::before — L5 */
  min-height:var(--btn-h);
  display:inline-flex; align-items:center; justify-content:center;
  padding:0 var(--s4);
  font-size:var(--t2); letter-spacing:.5px;
  border:var(--bd) solid var(--line2); border-radius:var(--radius);
  background:var(--pan2); color:var(--txt);
  cursor:pointer; transition:background .08s,border-color .08s;
}
.btn::before{
  content:""; position:absolute; inset:50% 50%;
  width:max(100%,var(--tap-min)); height:max(100%,var(--tap-min));
  transform:translate(-50%,-50%);
}
.btn:hover{background:var(--pan3)}
.btn:active{filter:brightness(.9)}
.btn--sm,.btn.sm,.btn.xs{--btn-h:var(--ctl-sm);padding:0 var(--s3)}
.btn--md{--btn-h:var(--ctl-md)}
.btn--lg,.btn.big{--btn-h:var(--ctl-lg);padding:0 28px;font-size:var(--t4)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#291808}
.btn.go:hover{background:#FFB444;border-color:#FFB444}
/* 2026-09-01: END TURN là hành động hệ trọng nhất mỗi lượt (Fitts's Law) —
   to hơn hẳn REROLL, dùng --ctl-lg đã có sẵn trong hệ thống thay vì kích thước --ctl-md mặc định */
.btn.end{background:var(--acc);border-color:var(--acc);color:#291808;--btn-h:var(--ctl-lg);padding:0 var(--s6);font-size:var(--t3)}
.bottombar .ctlgroup:last-child{margin-left:auto}
.btn.end:hover{background:#FFB444}
.btn.reroll{background:transparent;border-color:var(--shd);color:var(--shd)}
.btn.reroll:hover{background:rgba(99,179,255,.12)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--dim)}
.btn.ghost:hover{color:var(--txt);border-color:var(--dim);background:var(--pan2)}
.btn.on{border-color:var(--acc);color:var(--acc);background:#2a1c10}
.btn--danger{border-color:var(--dmg);color:var(--dmg);background:transparent}
.btn--danger:hover{background:rgba(255,107,107,.12)}
/* disabled: giảm tương phản CÓ KIỂM SOÁT, không dùng opacity mù (L3) */
.btn[disabled],.btn.dis,button[disabled]{
  background:transparent; border-color:var(--line);
  color:var(--off); opacity:1; cursor:not-allowed; pointer-events:none;
}
/* T08 · focus ring — không tồn tại rule nào trước bản này */
:where(button,[role=button],a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])):focus-visible{
  outline:3px solid var(--acc); outline-offset:2px; border-radius:var(--rad-sm);
}
.die:focus-visible,.unit:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
/* T08 · reduce motion — phủ toàn bộ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  /* !important required: this rule sits earlier in the stylesheet than the
     unconditional .screen.menu.title{animation:menuDrift...} rule below, and
     with equal specificity + no !important the LATER rule was winning even
     under reduced-motion (verify.mjs A10 caught this: animationName stayed
     'menuDrift', duration only got clamped to .001ms by the universal rule
     above, not truly disabled — a running-but-imperceptible animation still
     fails "reduce actually removes animation"). */
  .screen.menu.title{animation:none!important}
}

/* ================= MENU ================= */
.screen.menu,.screen.title{text-align:center;padding-top:8px;min-height:calc(100vh - 30px);
  display:flex;flex-direction:column;justify-content:center}
.logo{font-size:var(--t6);color:var(--acc);letter-spacing:6px;font-family:var(--font-brand);font-weight:900}
.logo.sm{font-size:var(--t5);letter-spacing:3px;font-family:var(--font-brand);font-weight:900}
.sub{color:var(--dim);font-size:var(--t2);letter-spacing:3px;margin:6px 0 24px}

/* ---- T18 · title screen: one CTA centred, four tiles under it ----
   The old vertical rails are deleted: rotated edge text reads about twice as
   slowly, the screen edge belongs to browser chrome, and :hover never fires
   on touch, so the whole pattern was unreachable on a phone. */
small{font-size:var(--t1)}
.screen.menu.title{display:grid;place-items:center;min-height:100dvh;position:relative}
/* The real background art + drifting glows live entirely on `#bgLayer`
   now (a fixed div OUTSIDE #app — see the big comment on #bgLayer above for
   why: a background painted on anything inside #app's zoomed subtree, even
   2 faint radial-gradients with no image, visibly seams at #app's own
   bounds once --ui-scale zoom isn't exactly 1). This rule intentionally
   carries NO background of its own anymore — #bgLayer shows through the
   transparent parts unchanged. (A duplicate background here, left over
   from an earlier pass before #bgLayer existed, was the actual cause of a
   reported "white box" artifact — don't reintroduce one.) */
@keyframes menuDrift{0%{background-position:0% 0%,100% 100%}100%{background-position:15% 10%,85% 85%}}
.menu-inner{width:min(640px,100% - 32px);display:flex;flex-direction:column;align-items:center}
.menu-inner .logo{font-size:var(--t6);letter-spacing:8px;color:var(--acc)}
.menu-inner .sub{font-size:var(--t2);letter-spacing:3px;color:var(--dim);margin:var(--s2) 0 0}
.btn.cta{width:320px;min-height:56px;margin-top:var(--s6);font-size:var(--t4)}
.btn.cta2{width:320px;margin-top:var(--s2)}
.menu-grid{display:grid;grid-template-columns:repeat(4,152px);gap:var(--s2);margin-top:var(--s5)}
.btn.menu-tile{min-height:72px;flex-direction:column;gap:var(--s1);padding:var(--s2)}
.btn.menu-tile.hasnew{border-color:var(--acc)}
.mt-n{font-size:var(--t2);letter-spacing:1px}
.mt-s{font-size:var(--t1);color:var(--acc);line-height:1.3}
/* T20 · own class, NOT .stats — .stats is also the combat status-chip row
   (statusChipsEl(), position:absolute) and the two bled together: this line's
   text rendered absolutely-positioned and overlapped the logo title instead
   of flowing after the button groups (bug report 2026-09-16). */
.menu-stats{margin-top:var(--s5);font-size:var(--t2);color:var(--dim);letter-spacing:1px}
/* T20 · utility/meta links tucked into the bottom-right corner, mirroring
   .menu-corner top-left. Still .btn.ghost.btn--sm — that's already the
   lightest-weight control in the system (transparent bg, dim border/text),
   and .btn::before already guarantees a >=44x44 invisible tap area (see the
   T07 button rules above) regardless of the button's visible size, so no
   separate small-tap-target treatment is needed here. */
.menu-mini{position:absolute;bottom:var(--s4);right:var(--s4);display:flex;gap:var(--s2);
  flex-wrap:nowrap;justify-content:flex-end;margin-top:0}
@media (max-width:599px){
  .menu-mini{flex-wrap:wrap;max-width:260px}
}
/* T20 · top-left identity corner — replaces the old .menu-acctbar line
   entirely. Avatar (48px, via buildAvatarWrap()/.profile-avatar-wrap reused
   from Profile) + two-line username/title text block, the whole thing
   clickable through to Profile. */
.menu-corner{position:absolute;top:var(--s4);left:var(--s4);display:flex;align-items:center;
  gap:var(--s3);cursor:pointer}
.menu-corner .profile-avatar-wrap{padding:4px}
.menu-corner .profile-avatar{width:48px;height:48px}
.menu-corner .decor-badge{width:22px;height:22px;right:-4px;bottom:-4px}
.menu-corner-txt{text-align:left}
.menu-corner-name{font-size:var(--t2);color:var(--txt);line-height:1.3;font-weight:700}
.menu-corner-title{font-size:var(--t1);color:var(--dim);letter-spacing:1px}
.menu-corner-title.has{color:var(--acc)}
/* Symmetric counterpart to .menu-corner (top-left identity) — Shard was
   previously only readable buried in the plain-text stat footer, not as a
   persistent currency HUD chip like the rest of this genre uses. */
.menu-corner-r{position:absolute;top:var(--s4);right:var(--s4);display:flex;align-items:center;
  gap:10px;background:var(--pan);border:1px solid var(--line2);border-radius:999px;padding:10px 22px;
  cursor:pointer}
.menu-corner-r .icow{width:32px;height:32px}
.menu-corner-r .mc-shard{font-size:var(--t4);color:var(--txt);font-weight:700}
/* T19 · grouped tiles replace the old flat 4-per-row grid: each .menu-group
   is a labeled cluster (PROGRESS / REFERENCE) so relationship reads at a
   glance instead of every tile carrying identical visual weight.
   T20 · each group is now a bordered panel-card (chunking, not new markup —
   .menu-group already IS the right wrapper element) and spacing is
   tightened: groups sit closer together, tiles sit closer within a group. */
.menu-groups{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5);align-items:center}
.menu-group{width:fit-content;background:var(--pan);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4)}
.menu-group-label{font-size:var(--t1);color:var(--dim);letter-spacing:2px;text-align:left;margin-bottom:var(--s1)}
.menu-group .menu-grid{margin-top:0}
.menu-grid--3{grid-template-columns:repeat(3,152px);gap:var(--s1)}
.menu-grid--4{grid-template-columns:repeat(4,112px);gap:var(--s1)}
/* PROGRESS grew from 4 to 5 tiles (added ECHO BOX) — fixed-column grids
   (unlike auto-fit ones elsewhere) don't reflow, so a 5th tile in a
   4-column grid just wraps to its own half-empty row. A dedicated 5-column
   variant keeps the row whole instead of forcing a callsite to guess. */
.menu-grid--5{grid-template-columns:repeat(5,112px);gap:var(--s1)}
@media (max-width:599px){
  .menu-grid{grid-template-columns:repeat(2,1fr);width:100%}
  .menu-group{width:100%}
  .menu-grid--3{grid-template-columns:repeat(2,1fr);width:100%}
  .menu-grid--4{grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
  .menu-grid--5{grid-template-columns:repeat(2,1fr);gap:6px;width:100%}
  .menu-group-label{text-align:center}
  .btn.cta,.btn.cta2{width:100%}
}

.colsec{max-width:1050px;margin:0 auto 18px;text-align:left}

.citem.r3{border-color:var(--r3);color:var(--r3)} .citem.r4{border-color:var(--r4);color:var(--r4)}
/* Uploaded avatar tile — deliberately NOT an r1-r4 rarity color (it isn't a

/* unowned pool entries: keep the rarity-tinted border (progress-by-rarity

   "owned" — locked always wins over the .rN text color since it's declared

.citem.locked{opacity:.55;border-style:dashed;color:var(--dim)}
.echosec{background:var(--pan);border:var(--bd) solid var(--line);border-radius:var(--radius);padding:var(--card-pad)}

/* Compact Vault chips (ux-designer spec, 2026-09-03) — replaces the old
   .pick-sized vault cards, which reused the full 6-face starter-hero layout
   and became unusably large/cluttered as the Vault grows toward its 20-slot
   cap. Flex-wrap (not a stretching grid) so 1 entry stays small and N=20
   wraps into a tidy multi-row flow, capped and scrollable rather than ever
   pushing MODE/ASCENSION/START RUN below the fold. */
.vaultgrid{display:flex;flex-wrap:wrap;gap:6px;max-width:1050px;margin:0 auto 16px;
  max-height:132px;overflow-y:auto;padding:2px}
.vchip{display:flex;align-items:center;gap:6px;background:var(--pan);border:var(--bd) solid var(--line);
  border-bottom:3px solid var(--cc);border-radius:var(--rad-sm);padding:4px 8px;cursor:pointer;
  position:relative;flex:0 0 auto}

.vchip.on{border-color:var(--acc)}
.vchip.full{opacity:.5;cursor:not-allowed}
/* E13 — bản ghi vault sinh ra trước khi luật part→face đổi. Không mờ đi (người chơi vẫn phải
   đọc được nó để biết quét lại con nào); đổi màu viền + badge chữ. Không dùng transform nên
   không gây layout shift (luật UI 5). */
.vchip.stale{border-color:var(--dmg);cursor:not-allowed}

/* §3.10 — dawn/dusk/mech map to a game class (beast/reptile/bug) for passive/color/HP,

.vchip-i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--pan2);

.vwaddr{font-size:var(--t2);color:var(--heal);letter-spacing:1px}
.vform{max-width:1050px;margin:0 auto 12px}
.vmsg{max-width:1050px;margin:0 auto 12px;font-size:var(--t3);padding:8px 0;text-align:left}
.vmsg-info{color:var(--dim)}
.vmsg-bad{color:var(--dmg)}
.vpreview{max-width:1050px;margin:0 auto 16px;background:var(--pan);border:var(--bd) solid var(--line);
  border-radius:var(--radius);padding:var(--card-pad);text-align:left}
.vpn{font-size:var(--t4);color:var(--txt);margin-bottom:8px}
.vpreview-art{display:block;width:96px;height:96px;object-fit:contain;margin-bottom:8px;
  background:var(--pan2);border-radius:var(--rad-sm)}
.vparts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.vpart{font-size:var(--t1);padding:4px 8px;background:var(--pan2);border:1px solid var(--line);
  border-radius:var(--rad-sm);color:var(--dim)}
.vaultscreen .colsec{max-width:1050px}

/* ================= WAVE TRACK / HUD ================= */
/* --line2 (not --line) against --pan/--bg: --line alone measures 2.38:1 here,
   under WCAG 1.4.11's 3:1 — caught once verify.mjs's screen coverage grew to
   include Shop/Event, the only two screens that render .track without also
   layering a --line2-bordered card over it. .rewardbox already used --line2
   on this same --pan background and passed. */
.track{display:flex;align-items:center;gap:8px;background:var(--pan);border:var(--bd) solid var(--line2);
  border-radius:var(--radius);padding:6px 10px;margin-bottom:8px;flex-wrap:nowrap;white-space:nowrap}
.tlabel{font-size:var(--t1);color:var(--dim);letter-spacing:2px}
.tstep{font-size:var(--t3);color:var(--txt);letter-spacing:1px}
.tstep .en{color:var(--acc)}
.tstep.elite .en{color:var(--burn)} .tstep.boss .en{color:var(--dmg)}
.tnode{position:relative;width:10px;height:10px;border-radius:50%;background:var(--line2);
  flex-shrink:0;font-size:0;color:transparent;border:none;padding:0;cursor:default}
/* L5 · hit area must be 44px even though the dot reads at 10px */
.tnode::before{content:"";position:absolute;left:-20px;right:-20px;top:-20px;bottom:-20px}
/* shape, not colour alone — deuteranopia still tells these apart */
.tnode.elite{border-radius:2px}
.tnode.boss{width:13px;height:13px;border-radius:2px;transform:rotate(45deg)}
.tnode.done{background:var(--dim)}
.tnode.cur{background:var(--acc);box-shadow:0 0 8px var(--acc);transform:scale(1.5)}
.tnode.elite{background:var(--burn);opacity:.55} .tnode.boss{background:var(--dmg);opacity:.55}
.tnode.elite.done,.tnode.boss.done{opacity:1}
.tnode.elite.cur{background:var(--burn);opacity:1;box-shadow:0 0 8px var(--burn)}
.tnode.boss.cur{background:var(--dmg);opacity:1;box-shadow:0 0 8px var(--dmg)}
.tnode .icow{display:none}
.trk-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.shards{font-size:var(--t2);color:var(--acc)}
.ascbadge{font-size:var(--t1);border:1px solid var(--deb);border-radius:var(--rad-sm);color:var(--deb);padding:2px 6px}
.turn{font-size:var(--t2);color:var(--dim)}
.rr{font-size:var(--t2);color:var(--shd);display:flex;align-items:center;gap:3px}
.spd{display:flex;gap:2px}

/* ================= MAP ================= */
.screen.map{min-height:calc(100vh - 30px);display:flex;flex-direction:column;justify-content:center}
.maph{text-align:center;font-size:var(--t2);color:var(--dim);letter-spacing:4px;margin:8px 0 16px;font-family:var(--font-brand);font-weight:900}
.noderow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.nodecard{width:300px;background:var(--pan);border:var(--bd) solid var(--line);border-top:3px solid var(--nc);
  border-radius:var(--radius);padding:var(--card-pad);text-align:center;cursor:pointer;transition:.12s}
/* A node choice is the single biggest decision on this screen — hover/focus
   needs a real lift (glow + scale), not just a background tint. */
.nodecard:hover,.nodecard:focus-visible{background:var(--pan2);border-color:var(--nc);
  box-shadow:0 0 0 2px var(--nc),0 0 26px color-mix(in srgb,var(--nc) 45%,transparent);
  transform:translateY(-2px) scale(1.02)}
.nodecard .nic{font-size:var(--t5);color:var(--nc);line-height:1}
.nodecard .nn{font-size:var(--t3);color:var(--nc);letter-spacing:3px;margin:8px 0 4px}
.nodecard .nd{font-size:var(--t3);color:var(--dim);line-height:24px}
.nodecard .nbn{font-size:var(--t3);color:var(--dmg);margin:6px 0}
.nodecard .spr{margin:8px auto 0}
.n_boss{border-top-color:var(--dmg)}

/* ---------- party strip ---------- */
.pstripwrap{margin-top:16px}
.pstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.psc{width:max(148px,calc(var(--spr-w) + 48px));background:var(--pan);border:var(--bd) solid var(--line);
  border-bottom:3px solid var(--cc);border-radius:var(--radius);padding:var(--card-pad-sm);position:relative}
.psc .spr{margin:0 auto}
.psc .nm{font-size:var(--t1);color:var(--dim)} .psc .hp{font-size:var(--t1);color:var(--heal);margin-bottom:4px}
.psc.dr3{border-color:var(--r3)} .psc.dr4{border-color:var(--r4)}
.drtag{font-size:var(--t1);margin-top:4px;letter-spacing:1px;color:var(--dim)}
.psc.dr3 .drtag{color:var(--r3)} .psc.dr4 .drtag{color:var(--r4)}
.asctag{font-size:var(--t1);margin-top:2px;letter-spacing:1px;color:var(--acc)}
.relicstrip{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.rchip{font-size:var(--t1);padding:3px 7px;background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-sm);color:var(--dim)}
.rchip.r1{border-color:var(--r1);color:var(--r1)} .rchip.r2{border-color:var(--r2);color:var(--r2)}
.rchip.r3{border-color:var(--r3);color:var(--r3)} .rchip.r4{border-color:var(--r4);color:var(--r4)}
.nothing{font-size:var(--t2);color:var(--dim)}
.archstrip{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.archstrip .al{font-size:var(--t1);color:var(--dim);letter-spacing:2px}
.achip{display:flex;gap:5px;align-items:center;font-size:var(--t1);padding:3px 8px;border-radius:var(--rad-sm);
  background:var(--pan);border:1px solid var(--ac);color:var(--ac);opacity:.5}
.achip.lead{opacity:1}
.achip .av{font-size:var(--t2)}

/* ---------- match history (reuses .colsec/.rchip/.recap/.achip/.clog-*
   verbatim — no new color tokens, per the ui-programmer spec for this
   feature) ---------- */
.histlist{max-width:1050px;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.histrow{display:grid;grid-template-columns:64px 90px 1fr auto auto;gap:var(--s3);align-items:center;
  background:var(--pan);border:1px solid var(--line);border-radius:var(--rad-sm);padding:var(--s2) var(--s3);
  min-height:44px;cursor:pointer;text-align:left}
.histrow:hover{background:var(--pan2)}
.histrow.won{border-left:3px solid var(--acc)}
.histrow.open{border-color:var(--acc)}
.histres{font-size:var(--t2);color:var(--dmg);letter-spacing:1px}
.histrow.won .histres{color:var(--acc)}
.histwave{font-size:var(--t2);color:var(--dim)}
.histdate{font-size:var(--t1);color:var(--dim)}
.histteam{display:flex;gap:2px}
.histspr{width:28px;height:28px;image-rendering:pixelated}
.histarch{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.histdetail{max-width:1050px;margin:0 auto 12px;background:var(--pan2);border:1px solid var(--line);
  border-radius:var(--radius);padding:var(--s3)}
.histlogbody{max-height:420px;overflow-y:auto;background:var(--pan);border:1px solid var(--line);
  border-radius:var(--rad-sm);padding:var(--s2) var(--s3)}
@media (max-width:899px){
  .histrow{grid-template-columns:56px 76px 1fr;row-gap:4px}
  .histdate{grid-column:1/-1}
  .histteam,.histarch{grid-column:1/-1}
  .histarch{justify-content:flex-start}
}

/* ================= COMBAT ================= */
/* Battle UI redesign (2026-09-16, Battle-UI-A-Grid-v2 handoff). Replaces the
   whole combat board. Rules this pass follows (product owner's brief):
   fixed card geometry everywhere — no card can be taller/shorter than its
   neighbours in ANY state; one shadow token; glow marks selection and legal
   target only (nothing else glows); spacing on 8/16px for layout, 12px card
   padding; radii on 12px (cards/bars) and 6px (chips/inner buttons) only. */
.combat{min-height:calc(100vh - 30px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.combat.frozen{filter:saturate(.4) brightness(.5)}
.msg{text-align:center;font-size:var(--t2);color:var(--acc);min-height:15px}

/* ---------- 1. top bar (was track()) ---------- */
.topbar{height:48px;display:flex;align-items:stretch;background:var(--pan);
  border:var(--bd) solid var(--line2);border-radius:12px;overflow:hidden}
.topbar>*{display:flex;align-items:center;flex:none;border-right:1px solid var(--line)}
.tb-wave{gap:8px;padding:0 16px}
.tb-wave .tb-wavelabel{font-size:var(--t1);font-weight:700;letter-spacing:.14em;color:var(--dim)}
.tb-wave b{font-size:var(--t3);font-weight:800;font-variant-numeric:tabular-nums}
.tb-map{gap:2px;padding:0 14px;cursor:help}
.tb-cell{width:14px;border-radius:1px;flex:none}
.tb-stats{gap:16px;padding:0 16px;font-size:var(--t2);font-variant-numeric:tabular-nums}
.tb-stat{display:flex;align-items:center;gap:6px;color:var(--dim);cursor:help}
.tb-stat b{font-weight:800}
.tb-util{margin-left:auto;border-right:none;gap:4px;padding:0 12px}
.tb-btn{height:32px;padding:0 12px;font-size:var(--t1);font-weight:700;letter-spacing:.08em;
  border:0;border-radius:6px;background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;position:relative}
.tb-btn:hover{color:var(--txt)}
.tb-btn.dis{color:var(--off);cursor:not-allowed}
.tb-spd{display:flex;background:#0a0c0f;border-radius:6px;padding:2px}
.tb-spd button{height:28px;width:34px;font-size:var(--t1);border:0;border-radius:4px;background:transparent;
  color:var(--dim);font-weight:700;cursor:pointer;font-family:inherit;position:relative}
.tb-spd button.on{background:var(--acc);color:#291808;font-weight:800}
/* height:32/28 is the handoff's literal spec, under this project's 44px
   tap-target floor (tools/verify.mjs B1, --tap-min) — same fix as .btn's
   own ::before below: expand the HIT area, not the visible chrome. */
.tb-btn::before,.tb-spd button::before{content:"";position:absolute;inset:50% 50%;
  width:max(100%,var(--tap-min));height:max(100%,var(--tap-min));transform:translate(-50%,-50%)}

/* ---------- 2. zone headers ---------- */
.zone{display:flex;flex-direction:column;gap:8px;position:relative}
.zonehead{display:flex;align-items:center;gap:8px;height:16px}
.zonedot{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor}
.zonetag{font-size:var(--t1);font-weight:800;letter-spacing:.16em}
.zone.enemies .zonehead{color:var(--dmg)}
.zone.party .zonehead{color:var(--ally)}
.zonecount{margin-left:auto;font-size:var(--t1);font-weight:700;font-variant-numeric:tabular-nums}
.zonehint{margin-left:auto;font-size:var(--t1);font-weight:500;color:var(--dim)}
.zonediv{height:1px;background:var(--line);flex:none}
/* Enemy waves can carry up to 6 mobs (elite/boss adds) — shrink+wrap rather
   than overflow the board. Swarm builds (Axie Eggs) never wrap: partyCard()
   computes cardW from the live party count instead, see scCombat(). */
.zone.enemies.compact .unit.e{width:180px;height:190px}
.zone.enemies.compact .unit.e .sprwrap img{width:76px!important;height:76px!important}
.zonecards{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:16px;flex-wrap:wrap}
.zone.party .zonecards{flex-wrap:nowrap}

/* ---------- 3/4. card shell — shared by enemy card and party card ---------- */
.unit{position:relative;border-radius:12px;background:var(--pan-hi);border:1px solid var(--line2);
  box-shadow:0 8px 20px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;flex:none}
.unit.tgt{cursor:pointer;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px rgba(255,147,69,.3)}
.unit.hovtgt{box-shadow:0 0 0 2px var(--acc),0 0 26px rgba(255,147,69,.4)}
/* Picked-die glow lives on the OUTER card now — a die is no longer a
   separate floating object, it is the lower half of its Axie's card. */
.unit.sel{border-color:var(--shd);box-shadow:0 0 0 2px var(--shd),0 0 26px rgba(49,198,255,.4)}
.unit.threat{border-color:#9a6060}
.unit.dead{opacity:.2;filter:grayscale(1)}
.unit.acting{border-color:var(--dmg);box-shadow:0 0 0 2px var(--dmg),0 0 24px rgba(255,95,95,.45);z-index:7}
.unit.elite{border-color:var(--burn)}
/* Axie Egg (summon token): cardW already sizes it the same as every other
   party card (the swarm mockup state treats all 9 uniformly) — only the
   dashed/dim treatment carries over from the old .unit.p.token rule. */
.unit.p.token{opacity:.85;border-style:dashed}
/* Height is the one dimension every party card ALWAYS shares — this is
   the actual fix for the original bug report ("các ô nhấp nhô không đều").
   Width is set inline per-card by partyCard() (the computed cardW). */
.unit.p{height:360px}

.unit.e{width:228px;height:224px}
.unit.e.big{width:340px;height:300px}

/* boss banner — now in normal flow (was position:absolute;top:-13px), so it
   cannot overlap anything and never needs the card taller to fit it. */
.ubanner{height:28px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(90deg,var(--dmg),var(--acc));color:#2a0d0d;font-size:var(--t1);font-weight:800;
  letter-spacing:.16em}
.bosstag{display:inline-block;margin-left:5px;background:var(--acc);color:#2a1600;font-size:.7em;font-weight:700;
  padding:1px 5px;border-radius:3px;vertical-align:middle}

/* intent band — fixed height:36px, no longer able to change the card's
   height when it wraps to 2 lines (one of the two causes of the old
   uneven row; the other was the status-chip count, fixed below). */
.intent{height:36px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  overflow:hidden;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,currentColor 16%,var(--pan-hi))}
.intent .ii{font-size:16px;flex:none}
.intent .iv{font-size:var(--intent-v);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;flex:none}
/* --dim measured 3.7-3.87:1 here (tools/verify.mjs A2) — the intent band's
   background is tinted by the intent's OWN colour (color-mix 16%), and on
   the poison/shield tints that leaves --dim just under AA. --txt has
   margin to spare on every tint this band can have. */
.intent .ia{font-size:var(--t2);color:var(--txt);flex:none}
.intent .itg{font-size:var(--t2);font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent .ik{font-size:var(--t1);color:var(--dim);flex:none}
.intent.t_dmg{color:var(--dmg)} .intent.t_shield{color:var(--shd)}
.intent.t_heal{color:var(--heal)} .intent.t_poison{color:var(--poi)}
.intent.t_debuff,.intent.t_buff{color:var(--deb)} .intent.t_summon{color:var(--man)}
.intent.danger{box-shadow:inset 0 0 0 1px var(--dmg)}

/* portrait band */
/* Party card only: the clickable "portrait block" (click = inspect) is a
   152px-tall band of its own, holding the class bar (top edge) and the
   .sprwrap sprite area (the rest) — enemy cards have no such wrapper, the
   class bar and the inspect-click region, since only Axies have either. */
.pportrait{height:152px;flex:none;position:relative;display:flex;flex-direction:column;cursor:pointer}
.sprwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.sprwrap::after{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:60%;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 72%);
  pointer-events:none;z-index:-1}
.unit .spr{display:block;object-fit:contain}
.unit .spr.mut{transform:scaleX(-1);object-position:center;filter:grayscale(1) sepia(1) hue-rotate(-38deg) saturate(3.6) contrast(1.1) brightness(.86)}
.unit.big .spr.mut{filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(4.4) contrast(1.16) brightness(.78);
  animation:breathe 2.6s ease-in-out infinite}
.unit .spr.mut.real{filter:none}
.unit.p .spr{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scaleX(var(--fx,1))}50%{transform:translateY(-3px) scaleX(var(--fx,1))}}
.unit.e .spr.mut{--fx:-1}

/* class bar — the ONLY carrier of class identity now (the old full-card
   gradient wash is gone: it's decoration competing with the card border's
   own state colours, and the redesign's rule is "the background is
   neutral"). Echo Tier prestige (opt-in, end-game) also lives here instead
   of a 5th ring around the whole card. */
.classbar{position:absolute;top:0;left:0;right:0;height:3px;z-index:2;background:var(--cc)}
.unit.echo1 .classbar{height:4px}
.unit.echo2 .classbar{height:5px;box-shadow:0 0 6px rgba(99,179,255,.6)}
.unit.echo3 .classbar{height:6px;box-shadow:0 0 8px rgba(179,136,255,.65)}
.unit.echo4 .classbar{height:7px;box-shadow:0 0 10px rgba(255,200,87,.7)}
.unit.echo5 .classbar{height:8px;box-shadow:0 0 12px rgba(255,200,87,.8);animation:hp-pulse 1.6s ease-in-out infinite}

/* passive badge (was .pasdot, a 24px circle) */
.pasdot{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:6px;z-index:2;
  background:#0a0c0f;color:var(--txt);border:1px solid var(--cc);font-size:var(--t1);font-weight:800;
  display:flex;align-items:center;justify-content:center;cursor:help}

/* incoming-damage badge (was .targetedchip, a text row that cost height).
   Absolutely positioned like every other card badge now, so 0 or 1 of it
   never changes the card's height. The number is the summed incoming `dmg`
   across every enemy targeting this Axie — the decision-relevant figure. */
.dmgbadge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:6px;background:var(--dmg);color:#2a0d0d;font-size:var(--t1);font-weight:800;
  font-variant-numeric:tabular-nums}
.dmgbadge .icow.ii{width:11px;height:11px}
.dmgbadge .icow.ii svg{width:11px;height:11px}

/* action preview chip — "-6" / "+7 SH" while a die/relic is selected and
   this card is a legal target. Was position:absolute;top:-14px (floating
   above the card edge); the redesign keeps it, just inside the card. */
.preview{pointer-events:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;
  display:inline-flex;align-items:center;gap:5px;font-size:var(--t2);font-weight:800;
  background:#0a0c0f;border:1px solid var(--acc);border-radius:6px;padding:4px 10px;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--acc)}
.preview.dmg{color:var(--dmg);border-color:var(--dmg)} .preview.shd{color:var(--shd);border-color:var(--shd)}
.preview.heal{color:var(--heal);border-color:var(--heal)} .preview.poi{color:var(--poi);border-color:var(--poi)}
.preview.deb{color:var(--deb);border-color:var(--deb);font-size:var(--t1)}

/* status chips (poison/burn/stun/...) — absolutely positioned (was an
   in-flow row that added 0-18px depending on chip count: the other of the
   two original causes of uneven card heights, together with the intent
   band above). */
.stats{position:absolute;z-index:2;display:flex;gap:4px;pointer-events:none}
.unit.e .stats{bottom:4px;left:8px}
.unit.p .stats{bottom:0;left:10px}
.stats span{pointer-events:auto;font-size:var(--t1);font-weight:700;padding:2px 6px;border-radius:6px;
  background:#0a0c0f;color:var(--dim);display:inline-flex;align-items:center;gap:3px;
  font-variant-numeric:tabular-nums;cursor:help}
.stats span.more{color:var(--dim)}
.stats .icow.ii{width:13px;height:13px}
.stats .icow.ii svg{width:13px;height:13px}
.stats .poison{color:var(--poi)} .stats .burn{color:var(--burn)} .stats .regen{color:var(--heal)}
.stats .thorns{color:var(--acc)} .stats .blind{color:#b0a8d0} .stats .weaken{color:var(--shd)}
.stats .vulnerable{color:var(--deb)} .stats .stun{color:var(--txt)} .stats .undying{color:var(--r3)}
.stats .frz{color:#9fe8ff} .stats .sh{color:var(--shd)}

/* boss rule line */
.bossdesc{flex:none;padding:0 14px 8px;font-size:var(--t2);line-height:1.4;color:var(--dim);text-align:center}

/* identity + hp band */
.idband{flex:none;padding:0 12px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.unit.p .idband{padding:0 12px 10px}
.idrow{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.unit .nm{font-size:var(--t2);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dupe-tag{color:var(--dim)}
.hpval{font-size:var(--t3);font-weight:800;font-variant-numeric:tabular-nums;flex:none;display:inline-flex;
  align-items:baseline;gap:6px;white-space:nowrap}
.hpval .hpmax{color:var(--dim);font-weight:500}
.hpval .shieldchip{display:inline-flex;align-items:center;gap:2px;font-size:var(--t1);font-weight:700;color:var(--shd)}
.hpval .shieldchip .icow.ii{width:12px;height:12px}
.hpbar{position:relative;height:6px;border-radius:3px;background:#0a0c0f;overflow:hidden}
.hpfill{height:100%;background:var(--hp-full);transition:width .22s ease-out}
.hpbar.low  .hpfill{background:var(--hp-low)}
.hpbar.crit .hpfill{background:var(--hp-crit);animation:hp-pulse 1.2s infinite}
@keyframes hp-pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.hpbar.crit .hpfill{animation:none}}
.hpghost{pointer-events:none;position:absolute;top:0;bottom:0;right:0;background:rgba(255,255,255,.3)}
.unit.p .hpghost{background:rgba(245,69,64,.75)}

.floats{position:absolute;left:0;right:0;top:4px;height:0;pointer-events:none;z-index:9}
.ftx{pointer-events:none;position:absolute;transform:translateX(-50%);font-size:var(--float-sz);
  animation:fly 1.2s ease-out forwards;text-shadow:0 2px 0 #000,0 0 10px #000}
.ftx.b1{font-size:28px} .ftx.b2{font-size:36px;color:var(--acc)!important}
.ftx.dmg{color:var(--dmg)} .ftx.shd{color:var(--shd)} .ftx.heal{color:var(--heal)}
.ftx.man{color:var(--man)} .ftx.buf{color:var(--acc)} .ftx.poi{color:var(--poi);font-size:15px}
.ftx.deb{color:var(--deb);font-size:14px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}

/* ---------- relic badge (relic-system.md §3.9 + §10 E1) ----------
   fx.js relicBadge() dựng phần tử này khi engine phát {t:'relic'}. Badge tái
   dùng đúng khung ngôn ngữ có sẵn: neo trong .floats (cùng host với .ftx),
   nền tối đặc + viền màu archetype giống .preview, cỡ chữ lấy từ thang
   --t1/--t2. --rbi là bậc thang xếp chồng khi nhiều relic KHÁC nhau nổ
   cùng lúc. Neo trong .sprwrap: top tính theo % chiều cao khối tranh nên
   badge luôn nằm giữa vùng art ở mọi breakpoint. */
.rbadge{pointer-events:none;position:absolute;left:50%;top:calc(24% + var(--rbi,0) * 24px);
  transform:translateX(-50%);display:flex;align-items:center;gap:5px;z-index:11;
  background:var(--bg);border:1px solid var(--rbc,var(--acc));border-radius:var(--rad-sm);
  padding:2px 7px;max-width:min(150px,calc(var(--unit-w) + 28px));white-space:nowrap;
  box-shadow:0 0 10px #000c,0 0 6px var(--rbc,var(--acc));
  animation:rb-in .18s ease-out both}
.rbadge .rbi{font-size:var(--t2);line-height:1;color:var(--rbc-tx);flex:none}
.rbadge .rbn{font-size:var(--t1);line-height:1.2;letter-spacing:1px;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis}
.rbadge .rbx{font-size:var(--t1);line-height:1.2;color:var(--rbc-tx);flex:none;font-weight:700}
.rbadge.rb-pop{animation:rb-pop .18s ease-out}
.rbadge.rb-out{animation:rb-out .2s ease-in forwards}
@keyframes rb-in{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.86)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes rb-pop{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.12)}
  100%{transform:translateX(-50%) scale(1)}}
@keyframes rb-out{0%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
@media (prefers-reduced-motion:reduce){
  .rbadge,.rbadge.rb-pop{animation:none}
  .rbadge.rb-out{animation:rb-fade .2s linear forwards}
  @keyframes rb-fade{to{opacity:0}}
}

/* Formation Resonance band (Battle-UI-A-Grid-v2 handoff §4b, 2026-09-16) —
   replaces the old .reslink floating circle + reslink-pulse glow. That
   badge was a DOM child of .zonecards positioned by measuring live rects
   after render (placeResLinks(), now deleted) — exactly the pattern this
   handoff calls out twice as wrong: (1) a connector outside a card's own
   box competes with the party row's cardW formula the moment it's a real
   flex child, and needs a render-after-layout pass the moment it isn't;
   (2) one badge per PAIR can't express a card that is in TWO pairs (the
   middle of a 3-in-a-row chain), because it has nowhere on that card to
   anchor a second badge. The band fixes both: it lives INSIDE the die
   block (reserved 26px on every card, pairs or not, so geometry never
   moves) and tracks linkL/linkR as two independent lookups per card.
   One thing the handoff's literal spec assumes that this codebase's
   .unit{overflow:hidden} does not allow: a 2px "bridge" element bleeding
   past the card's own edge into the gap. Rather than punch a hole in the
   clip that every other absolutely-positioned card badge (.pasdot,
   .dmgbadge, .classbar) relies on for its rounded corners, the two edge
   rails below stop flush at the card border — right next to each other
   across an 8-16px gap, which reads as connected without needing a literal
   bridge pixel. */
.resband{height:26px;flex:none;margin:-12px -12px 6px;padding:0 12px;
  display:flex;align-items:center;gap:6px;overflow:hidden;background:transparent}
.resband.ll{justify-content:flex-start;background:linear-gradient(270deg,transparent 20%,rgba(255,147,69,.16))}
.resband.lr{justify-content:flex-end;background:linear-gradient(90deg,transparent 20%,rgba(255,147,69,.16))}
.resband.ll.lr{justify-content:space-between;
  background:linear-gradient(90deg,rgba(255,147,69,.16),transparent 45%,rgba(255,147,69,.16))}
.resband .icow{flex:none;width:14px;height:14px}
.resband .icow svg{width:14px;height:14px}
.reslbl{font-size:var(--t1);font-weight:800;letter-spacing:.08em;color:var(--acc);white-space:nowrap}
/* Edge rails — always in the DOM (both sides, every card), lit only on the
   linked side. Flush with the die block's own edges (not the handoff's
   literal "bleed past the card"), so .unit's overflow:hidden never clips
   them; two lit rails from adjacent cards sit right next to each other
   across the gap and read as one connection. */
.resrail{position:absolute;top:0;bottom:0;width:2px;z-index:2;background:transparent}
.resrail.l{left:0} .resrail.r{right:0}
.resrail.on.l{background:linear-gradient(180deg,var(--acc),transparent 70%)}
.resrail.on.r{background:linear-gradient(180deg,var(--acc),transparent 70%)}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);background:var(--pan2);border:1px solid var(--line2);border-radius:var(--rad-sm);
  padding:6px 10px;font-size:var(--t1);font-weight:var(--fw-prose);line-height:1.4;color:var(--txt);
  white-space:normal;width:max-content;max-width:220px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .1s;z-index:50}
[data-tip]:hover::after,[data-tip]:focus::after{opacity:1}

/* ---------- party card lower half: the die block ---------- */
/* .diebox is a structural wrapper only (data-uid anchor for bindDrag()/
   dieBoxEl()/runRollAnim() — none of them care how it looks). It carries
   no border/background of its own: the merged card's OWN border above is
   the only visible box now — "a die is no longer a separate floating
   object, it is the lower half of its Axie's card." */
.diebox{flex:1;min-height:0;display:flex;flex-direction:column;width:auto}
.uniddiv{height:1px;flex:none;background:var(--line)}
.die{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;cursor:pointer;position:relative}
.die.used{opacity:.45;pointer-events:none}
.die.out{flex:1;display:flex;align-items:center;justify-content:center;opacity:.15;font-size:var(--t4)}
.die.tumble .di{animation:tum .12s linear infinite}
@keyframes tum{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(4deg)}100%{transform:translateY(0) rotate(-3deg)}}
.die.landed .di{animation:land .3s cubic-bezier(.3,1.7,.5,1)}
@keyframes land{0%{transform:translateY(-13px) scaleY(1.18) scaleX(.86)}45%{transform:translateY(3px) scaleY(.8) scaleX(1.16)}
  70%{transform:translateY(-2px) scaleY(1.06)}100%{transform:translateY(0) scale(1)}}

.diehd{height:20px;flex:none;display:flex;align-items:center;justify-content:space-between}
.diehd .dp{font-size:var(--t1);font-weight:800;letter-spacing:.16em;color:var(--dim);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flex:none — .diehd is a space-between row and, without it, a long part
   label (.dp, allowed to shrink/ellipsis) could squeeze this control down
   from 24px, taking its ::before hit-area under the 44px floor with it
   (tools/verify.mjs B1 caught exactly that: 42×42, not 44×44). */
.rsel{position:relative;flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);
  background:transparent;cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center}
.rsel::before{content:"";position:absolute;left:-12px;right:-12px;top:-12px;bottom:-12px}
.rsel:hover{border-color:var(--shd);color:var(--shd)}
.rsel.on{background:var(--shd);color:#0a141d;border-color:var(--shd)}
.rsel.frz{background:transparent;color:#9fe8ff;border-color:#9fe8ff;pointer-events:none}
.rsel .icow.t{width:12px;height:12px}
.rsel .icow.t svg{width:12px;height:12px}

.diefx{flex:1;min-height:0;display:flex;align-items:center;gap:10px}
.diefx .icow.di{flex:none}
.diefx .icow.di svg{width:30px;height:30px}
.diefx-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.diefx-vl{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dv{font-size:var(--die-num);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
/* --dmg (#F54540) measured 4.35:1 on --pan-hi (tools/verify.mjs A2) — just
   under the 4.5 AA floor. A small dark scrim under the label (not a new
   colour, and a normal "type label chip" look) closes the gap regardless
   of which effect colour lands here, instead of hand-tuning --dmg alone
   and risking every OTHER place that token is already passing. */
.dvl{font-size:var(--t1);font-weight:800;letter-spacing:.1em;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.32)}
.die.t_dmg .dv,.die.t_dmg .dvl{color:var(--dmg)}
.die.t_shield .dv,.die.t_shield .dvl{color:var(--shd)}
.die.t_heal .dv,.die.t_heal .dvl{color:var(--heal)}
.die.t_mana .dv,.die.t_mana .dvl{color:var(--man)}
.die.t_poison .dv,.die.t_poison .dvl{color:var(--poi)}
.die.t_debuff .dv,.die.t_debuff .dvl{color:var(--deb)}
.die.t_buff .dv,.die.t_buff .dvl{color:var(--acc)}
.die.t_summon .dv,.die.t_summon .dvl{color:var(--man)}
.die.t_blank .dv,.die.t_blank .dvl{color:var(--dim)}
/* keyword tag band (§4 band 3) — replaces the retired .dcap prose caption.
   Reserves its 20px height with zero chips so a face with no keywords
   cannot shift the row below it. Border/text colour follows the FACE's own
   effect colour, same palette as .dv/.dvl above. */
.kwtags{height:20px;flex:none;display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden}
.kwtag{padding:2px 6px;border-radius:4px;background:#0a0c0f;border:1px solid var(--line);
  font-size:var(--t1);font-weight:800;letter-spacing:.06em;white-space:nowrap;color:var(--dim)}
.die.t_dmg .kwtag{color:var(--dmg);border-color:color-mix(in srgb,var(--dmg) 45%,var(--line))}
.die.t_shield .kwtag{color:var(--shd);border-color:color-mix(in srgb,var(--shd) 45%,var(--line))}
.die.t_heal .kwtag{color:var(--heal);border-color:color-mix(in srgb,var(--heal) 45%,var(--line))}
.die.t_mana .kwtag{color:var(--man);border-color:color-mix(in srgb,var(--man) 45%,var(--line))}
.die.t_poison .kwtag{color:var(--poi);border-color:color-mix(in srgb,var(--poi) 45%,var(--line))}
.die.t_debuff .kwtag{color:var(--deb);border-color:color-mix(in srgb,var(--deb) 45%,var(--line))}
.die.t_buff .kwtag{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.die.t_summon .kwtag{color:var(--man);border-color:color-mix(in srgb,var(--man) 45%,var(--line))}
.critbadge{pointer-events:none;position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:var(--t1);
  background:var(--acc);color:#291808;padding:1px 7px;border-radius:6px;letter-spacing:1px;white-space:nowrap;z-index:3}

/* six-face strip — restores, as data, the one piece of information the old
   pip row used to imply: all six faces at a glance, the rolled one lit. */
.faces{height:14px;flex:none;display:flex;align-items:center;gap:2px;margin-bottom:6px;cursor:help}
.facecell{flex:1;height:14px;border-radius:2px;background:var(--line);display:flex;align-items:center;justify-content:center}
.facecell .icow{width:11px;height:11px}
.facecell .icow svg{width:11px;height:11px}

/* state band — replaces .diestate's old sentence copy with the 3-state
   model the redesign uses everywhere else on the card (dot + label). */
.diestate{height:16px;flex:none;display:flex;align-items:center;gap:6px}
.diestate .dsdot{flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.diestate .dslabel{font-size:var(--t1);font-weight:700;letter-spacing:.08em}
.die.ready .diestate{color:var(--heal)}
.die.sel .diestate{color:var(--shd)}
.die.used .diestate{color:var(--dim)}
/* the flying die clone (fx.js) is a fading snapshot of a card that no
   longer exists in the current state — its footer text would otherwise
   cross below AA contrast partway through the opacity fade. .resband joins
   .diestate here for the same reason (tools/verify.mjs A2.transient caught
   "RESONANCE +15%" at 1.54:1 mid-fade, 2026-09-16). */
.die.flyer .diestate,.die.flyer .resband{visibility:hidden}
.die.flyer{position:fixed;z-index:90;pointer-events:none;transition:transform .23s ease-in,opacity .23s ease-in}
.die.spent{opacity:.25}

/* ---------- 5. bottom bar ---------- */
.bottombar{height:64px;flex:none;display:flex;align-items:center;gap:16px;background:var(--pan);
  border:var(--bd) solid var(--line2);border-radius:12px;padding:0 16px;position:relative}
.bb-label{font-size:var(--t1);font-weight:800;letter-spacing:.14em;color:var(--dim);flex:none}
.items{display:flex;gap:8px;flex:1;align-items:center;overflow:hidden}
.icard{position:relative;flex:none;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--pan2);
  cursor:pointer;font-size:var(--t2);transition:.1s;color:var(--txt);display:flex;align-items:center;gap:8px;font-family:inherit}
.icard:hover{background:var(--pan3)}
/* height:40 (handoff spec) is under the 44px tap floor — expand the HIT
   area via ::before, same pattern as .btn's own (shared style, top of
   this file) and .tb-btn/.rsel above; visible chrome stays 40px. */
.icard::before,.relicbtn::before,.btn.reroll::before{content:"";position:absolute;inset:50% 50%;
  width:max(100%,var(--tap-min));height:max(100%,var(--tap-min));transform:translate(-50%,-50%)}
.icard.sel{border-color:var(--acc)}
.icard.dis{opacity:.28;pointer-events:none}
.icard.r1{border-color:var(--r1)} .icard.r2{border-color:var(--r2)} .icard.r3{border-color:var(--r3)}
.icard .ic-n{color:var(--txt);font-weight:700}
.icard .ic-c{font-size:var(--t1);font-weight:800;color:var(--man);display:inline-flex;align-items:center;gap:3px}
.icard .ic-c .icow.t{width:12px;height:12px}
.icard .ic-c .icow.t svg{width:12px;height:12px}
.items .nothing{font-size:var(--t2);color:var(--dim)}
.relicwrap{position:relative;flex:none}
.relicbtn{position:relative;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;font-size:var(--t2);font-weight:700;display:flex;align-items:center;gap:8px;font-family:inherit}
.relicwrap.open .relicbtn,.relicwrap:hover .relicbtn{border-color:var(--line2)}
.relicbtn-chev{font-size:var(--t1);transition:transform .12s}
.relicwrap.open .relicbtn-chev,.relicwrap:hover .relicbtn-chev{transform:rotate(180deg)}
/* Battle UI handoff §6 — always in the DOM; visibility is pure CSS so a
   mouse hover never has to go through render() (see the JS-side comment at
   the relicWrap construction for why that would break hover-during-
   rebuild). relicsOpen only ever adds/removes the .open class, for the
   click/tap path. The left-list/right-detail split inside is the same
   trick one level deeper: both panes for every relic are in the DOM at
   once, and :hover/:focus-within pick which detail pane shows. */
.relicpop{position:absolute;bottom:calc(100% + 8px);right:0;width:520px;display:none;
  background:var(--pan2);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 16px 40px rgba(0,0,0,.6);overflow:hidden;z-index:30}
.relicwrap.open .relicpop,.relicwrap:hover .relicpop{display:flex}
.relicpop-list{width:230px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;
  max-height:260px;overflow-y:auto}
.relicpop-h{height:30px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);
  font-size:var(--t1);font-weight:800;letter-spacing:.14em;color:var(--dim)}
.relicpop-row{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--line);font-size:var(--t2);color:var(--txt);cursor:default}
.relicpop-row:last-child{border-bottom:none}
.relicpop-row:hover,.relicpop-row:focus-within{background:var(--pan-hi)}
.relicpop-sw{width:4px;height:18px;border-radius:2px;flex:none}
.relicpop-row .rpn{flex:1;font-weight:700}
.relicpop-row .rpk{font-size:var(--t1);color:var(--dim)}
/* Row-to-detail hover, CSS-only (no render() involved, per the handoff's
   implementation note — render() tears down #app on every state change,
   which would destroy the hovered node out from under the pointer). Every
   relic's detail pane is stacked in the DOM (position:absolute;inset:0)
   and hidden by default; :has() + paired :nth-child lets hovering row N
   reveal detail N without any JS state. .primary (the first relic) is the
   fallback shown while nothing is hovered. 20 pairs covers every relic
   list — .relicpop-list itself scrolls past that, same as before. */
.relicpop-detailwrap{flex:1;position:relative}
/* overflow-y:auto — a long relic description had nowhere to go: this box is
   position:absolute;inset:0 inside .relicpop-detailwrap, and .relicpop itself
   clips (overflow:hidden), so text past the bottom edge was silently cut off
   instead of wrapping into view (bug report 2026-09-16). Same visible box
   size, just scrollable now. */
.relicpop-detail{position:absolute;inset:0;padding:12px;display:none;flex-direction:column;gap:8px;overflow-y:auto}
.relicpop:not(:has(.relicpop-row:hover)) .relicpop-detail.primary{display:flex}
.relicpop-dh{display:flex;align-items:center;gap:8px}
.relicpop-dn{font-size:var(--t2);font-weight:800}
.relicpop-dr{font-size:var(--t1);font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:#0a0c0f}
.relicpop-dd{font-size:var(--t2);line-height:1.5;color:var(--txt)}
.relicpop-dnote{margin-top:auto;font-size:var(--t1);color:var(--dim)}
.ctlgroup{flex:none;display:flex;align-items:center;gap:8px}
.btn.reroll{height:40px;padding:0 20px;border-radius:8px;border:1px solid var(--shd);background:transparent;
  color:var(--shd);font-size:var(--t2);font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.btn.reroll .icow.t{width:14px;height:14px}
.btn.reroll .icow.t svg{width:14px;height:14px}
.btn.end{height:48px;padding:0 32px;border-radius:8px;border:0;background:var(--acc);color:#291808;
  font-size:var(--t3);font-weight:800;letter-spacing:.06em}
.relicpop:has(.relicpop-row:nth-child(1):hover) .relicpop-detail:nth-child(1){display:flex}
.relicpop:has(.relicpop-row:nth-child(2):hover) .relicpop-detail:nth-child(2){display:flex}
.relicpop:has(.relicpop-row:nth-child(3):hover) .relicpop-detail:nth-child(3){display:flex}
.relicpop:has(.relicpop-row:nth-child(4):hover) .relicpop-detail:nth-child(4){display:flex}
.relicpop:has(.relicpop-row:nth-child(5):hover) .relicpop-detail:nth-child(5){display:flex}
.relicpop:has(.relicpop-row:nth-child(6):hover) .relicpop-detail:nth-child(6){display:flex}
.relicpop:has(.relicpop-row:nth-child(7):hover) .relicpop-detail:nth-child(7){display:flex}
.relicpop:has(.relicpop-row:nth-child(8):hover) .relicpop-detail:nth-child(8){display:flex}
.relicpop:has(.relicpop-row:nth-child(9):hover) .relicpop-detail:nth-child(9){display:flex}
.relicpop:has(.relicpop-row:nth-child(10):hover) .relicpop-detail:nth-child(10){display:flex}
.relicpop:has(.relicpop-row:nth-child(11):hover) .relicpop-detail:nth-child(11){display:flex}
.relicpop:has(.relicpop-row:nth-child(12):hover) .relicpop-detail:nth-child(12){display:flex}
.relicpop:has(.relicpop-row:nth-child(13):hover) .relicpop-detail:nth-child(13){display:flex}
.relicpop:has(.relicpop-row:nth-child(14):hover) .relicpop-detail:nth-child(14){display:flex}

/* ---------- pixel icons ---------- */
.icow{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px}
.icow svg{display:block}
/* Sizes bumped across the board (2026-09-08 — product owner: icons read too
   small since real art/illustration replaced flat pixel glyphs; a detailed
   image reads meaningfully smaller than a bold flat-color shape at the same
   px box). .t stays closest to its old size since it is always a SECONDARY
   corner badge (.partbadge on dice, reroll marker) next to a bigger primary
   icon — bumping it much would fight for attention with what it's a footnote to. */
.icow.t svg{width:13px;height:13px} .icow.tn svg{width:14px;height:14px}
.icow.ii svg{width:19px;height:19px} .icow.di svg{width:28px;height:28px}
.icow.ricon svg{width:44px;height:44px} .icow.evic svg{width:46px;height:46px}
.icow.nic svg{width:36px;height:36px} .icow.ific svg{width:17px;height:17px}
.icow.chip svg{width:24px;height:24px}
/* iconChip()/partIconChip() glossary rows (CODEX) — was a bare 11px icon
   crammed against text with no gap; real art needs room to read. */
.cchip.ic{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 6px}

/* ---------- Axie inspect modal (Battle UI redesign §7, 2026-09-16) ----------
   Bespoke panel on the shared .overlay backdrop (NOT modalShell()/.modalbox,
   which always renders its own generic title bar above whatever bodyFn
   returns — this design's header IS the top section: sprite, name, pill,
   HP and the close button all on one row). scUnitInfo() also serves the
   enemy-inspect path (unitCard()'s "not a legal target" click), which §7's
   own text doesn't cover — isE swaps the class pill for a BOSS/ELITE tag
   and PASSIVE for the enemy's own description; the six-face list is shared. */
.uip-panel{width:560px;max-width:100%;background:var(--pan2);border:1px solid var(--line2);

/* ================= COMBAT ANIMATION ================= */
body.playing #app{pointer-events:none}
body.playing::after{content:'HOLD MOUSE OR SPACE TO FAST FORWARD';position:fixed;bottom:8px;left:0;right:0;
  text-align:center;font-size:var(--t1);color:var(--dim);letter-spacing:2px;z-index:80;pointer-events:none}
body.dragging{cursor:grabbing} body.dragging .die{cursor:grabbing}

@keyframes lng{0%{transform:translate(0)}40%{transform:translate(var(--lx,0),var(--ly,-18px))}100%{transform:translate(0)}}

@keyframes knk{0%,100%{transform:translate(0)}30%{transform:translate(var(--kx,5px))}65%{transform:translate(calc(var(--kx,5px)*-.6))}}
.spr.hitflash{filter:brightness(3) saturate(0)} .spr.healflash{filter:brightness(1.7) hue-rotate(70deg)}
.spr.shdflash{filter:brightness(1.7) hue-rotate(180deg)}

   to 0 over .23s, and --dim gray footer text crosses below AA contrast

.die.flyer .diestate{visibility:hidden}

/* ================= LUNACIA PASS ================= */
.screen.menu.bpscreen,.screen.menu.codex,.screen.menu.guide,.screen.menu.collection,.screen.menu.unlocks,.screen.menu.vaultscreen,.screen.menu.leaderboard{justify-content:flex-start;padding-top:16px}

.bptrack{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px;max-width:1160px;

/* ================= GUIDE ================= */
/* Deterministic 2-column grid instead of auto-fit: the nested 5-avatar
   .gteam row has enough intrinsic content width that auto-fit's own track
   sizing could ask for more columns than actually fit, letting cards
   overflow the container and clip their body text (no wrap) instead of
   wrapping into a narrower card. minmax(0,1fr) plus min-width:0 on every
   flex/grid item in the chain lets long sentences wrap normally instead. */
.guidegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1120px;margin:0 auto;text-align:left}
.gcard{background:var(--pan);border:var(--bd) solid var(--line);border-top:3px solid var(--gc,var(--acc));
  border-radius:var(--radius);padding:var(--card-pad);min-width:0;display:flex;flex-direction:column;
  transition:border-color .12s,box-shadow .12s;}
.gcard:hover{border-color:var(--gc,var(--acc));box-shadow:0 0 0 1px var(--gc,var(--acc)) inset}
.gname{font-size:var(--t4);font-weight:700;color:var(--gc,var(--acc));letter-spacing:2px}
.gdiff{font-size:var(--t1);color:var(--dim);letter-spacing:2px;margin-top:4px}
.gteam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:14px 0}
.gu{background:var(--pan2);border:1px solid var(--line);border-bottom:2px solid var(--cc);
  border-radius:var(--rad-sm);padding:6px 2px;text-align:center;min-width:0}
.gu .spr{width:100%;max-width:var(--spr-guide);height:auto;aspect-ratio:1/1}
.gn{font-size:var(--t1);color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gwhy{font-size:var(--t3);font-weight:var(--fw-prose);color:var(--dim);line-height:1.9;margin-top:10px;overflow-wrap:break-word;word-break:break-word}
.ghow{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.gh{display:flex;gap:9px;align-items:flex-start;font-size:var(--t2);color:var(--dim);line-height:1.7;min-width:0}
.gh>span:last-child{min-width:0;overflow-wrap:break-word;word-break:break-word}
/* bullet drawn in CSS — the pixel font has no glyph for a triangle */
.gb{flex:0 0 5px;width:5px;height:5px;margin-top:7px;background:var(--gc,var(--acc));border-radius:1px}
.gwhy b,.ghow b{color:var(--acc)}

/* ================= CODEX ================= */
.cxshell{display:flex;gap:14px;max-width:1180px;margin:0 auto;width:100%;align-items:flex-start}
.cxnav{flex:0 0 176px;display:flex;flex-direction:column;gap:3px;position:sticky;top:12px}
.cxtab{background:transparent;border:none;border-left:2px solid transparent;border-radius:0;text-align:left;
  padding:9px 12px;font-size:var(--t2);color:var(--dim);letter-spacing:1px;cursor:pointer;transition:.08s}
.cxtab:hover{color:var(--txt);background:var(--pan)}
.cxtab.on{color:var(--acc);border-left-color:var(--acc);background:var(--pan)}
.cxpane{flex:1;background:var(--pan);border:var(--bd) solid var(--line);border-radius:var(--radius);
  padding:var(--card-pad);text-align:left;min-height:440px}
.cxh{font-size:var(--t4);color:var(--txt);letter-spacing:2px;margin-bottom:4px;font-family:var(--font-brand);font-weight:900}
.cxsum{font-size:var(--t3);font-weight:var(--fw-prose);color:var(--dim);line-height:1.8;margin-bottom:16px}
.cxsumbox{background:var(--pan2);border-left:2px solid var(--acc);border-radius:0 var(--rad-sm) var(--rad-sm) 0;
  padding:12px 14px;margin-bottom:16px;font-size:var(--t3);font-weight:var(--fw-prose);line-height:1.8;color:var(--dim)}
.cxhead{font-size:var(--t2);color:var(--dim);letter-spacing:3px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
/* the same class name is used for a table's header row — reset it there */
.cxtable .cxhead{margin:0;padding-bottom:0;border-bottom:none;letter-spacing:0;font-size:inherit}
.cxp{font-size:var(--t3);color:var(--dim);line-height:24px;margin-bottom:var(--s2)}
.cxp b{color:var(--txt)}
/* T21 (2026-09-03) · one real grid for the whole table, not one independent
   grid per row (see cxTable() in ui.js for why that made `max-content`
   column sizing impossible before — misaligned column edges row to row).
   grid-template-columns is now set inline per-table (content-dependent, via
   cxTable()); .cxtr is display:contents so its .cxtd cells become direct
   items of THIS grid, letting the browser size column 1 once using every
   row's real content. */
.cxtable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad-sm);overflow:hidden}
.cxtr{display:contents}
.cxtd{background:var(--pan2);padding:10px 12px;font-size:var(--t2);color:var(--dim);line-height:1.6;min-height:32px;
  display:flex;align-items:center}
.cxtr:first-child .cxtd{background:var(--pan3);color:var(--dim);font-size:var(--t1);letter-spacing:2px}
.cxtd:first-child{color:var(--txt)}
.cxtable.iconrow .cxtd:first-child{justify-content:center;padding:10px 6px}
.cxfilter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cxfb{background:var(--pan2);border:1px solid var(--line2);border-radius:var(--rad-sm);color:var(--dim);
  padding:4px 10px;font-size:var(--t1);letter-spacing:1px;cursor:pointer}
.cxfb.on{border-color:var(--acc);color:var(--acc)}
.cxtop{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px}
.cchip{font-size:var(--t1);padding:3px 8px;border-radius:var(--rad-sm);border:1px solid currentColor;
  white-space:nowrap;display:inline-block}

/* onboarding tutorial (design/gdd/onboarding-tutorial.md §3.5) — the coach
   box is appended to document.body (a sibling of #app), so it never itself
   gets caught by the #app.tut-locking rule just below. */
#app.tut-locking *{pointer-events:none}
#app.tut-locking .tut-allow,#app.tut-locking .tut-allow *{pointer-events:auto}
/* 2026-09-09: .tut-allow only restored pointer-events — nothing told the
   player WHICH element that was (the "click this die" step's literal
   complaint). Outline+box-shadow ring (not border) so it never shifts
   sibling layout and works regardless of the target's own shape/background
   (buttons, .unit cards, .die faces, .rcard reward cards all qualify for
   .tut-allow at different steps — see tutCoachOverlay()'s `allow` arrays).
   Reuses the same pacing/colour (var(--acc)) as the board's other glow cues
   for a consistent "this is interactive" language. */
#app.tut-locking .tut-allow{outline:3px solid var(--acc);
  outline-offset:3px;border-radius:var(--radius);box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc);
  animation:tut-allow-pulse 1.2s ease-in-out infinite}
@keyframes tut-allow-pulse{0%,100%{box-shadow:0 0 0 3px var(--acc),0 0 10px var(--acc)}
  50%{box-shadow:0 0 0 3px var(--acc),0 0 26px var(--acc)}}
@media (prefers-reduced-motion:reduce){
  #app.tut-locking .tut-allow{animation:none;box-shadow:0 0 0 3px var(--acc),0 0 14px var(--acc)}
}
.tutcoach-ov{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:130;
  max-width:520px;width:calc(100% - 36px);pointer-events:none}

/* Full-screen welcome/done beat (tutBigOverlay()) — opaque backdrop, unlike
   the transparent bottom bar above, since it's meant to fully replace the
   view rather than sit as a hint over it. */
.tutcoach-big{position:fixed;inset:0;z-index:131;background:#080a0cf2;

.tc-undo{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:130;

  animation:tcUndoFade 4s ease forwards}
@keyframes tcUndoFade{0%{opacity:1}75%{opacity:1}100%{opacity:0}}
