      flash('Rerolled. Undo history cleared.'); triggerRollAnim(use); collectFloats(); render(); } };
  if(!(S.rerolls>0&&anyRerollable(S))) rb.classList.add('dis');
  bb.appendChild(rb);
  bb.appendChild(btn('end','END TURN',()=>doEndTurn()));
  w.appendChild(bb);
  return w;
}

function needsTarget(u){
  const f=u.die[u.rolled];
  if(f.t==='blank'||f.t==='mana'||f.t==='summon') return false;
  if(hasKw(f,'aoe')) return false;
  if(f.t==='dmg'&&kwVal(f,'chain')) return false;
  return true;
}
function validTargets(u){
  if(!needsTarget(u)) return [];
  const f=u.die[u.rolled];
  const foe=['dmg','poison','debuff'].includes(f.t);
  return (foe?aliveE(S):aliveP(S)).map(x=>x.uid);
}

/* Disambiguate same-name units (dup Axie picks, dup enemy mobs). Returns the
   unit's 1-based position — stable-sorted by uid, not board order — among
   currently-ALIVE same-named units on its side, or null when there's no
   collision (the common case, which must render with zero extra markup). */
function dupeIndex(u){
  const pool=(u.side==='e'?S.enemies:S.party).filter(x=>x.hp>0&&x.n===u.n);
  if(pool.length<2) return null;
  pool.sort((a,b)=>a.uid-b.uid);
  return pool.findIndex(x=>x.uid===u.uid)+1;
}
/* §3.2 — cap visible status chips: priority-sort (stun/undying > poison/burn >
   everything else), render top 3 + a "+N" overflow chip whose title= lists
   the rest. Shared by unitCard() (enemy) and partyCard() (party) — both
   just position the returned row differently in CSS (.unit.e .stats vs
   .unit.p .stats). */
function statusChipsEl(u){
  const row=el('div','stats');
  const stChips=[];
  for(const k in ST_IC){ const v=u.st[k]; if(v>0) stChips.push({k,v}); }
  if(u.frozen) stChips.push({k:'frz',v:0,frozen:true});
  const stPriority=k=>(k==='stun'||k==='undying')?0:(k==='poison'||k==='burn')?1:2;
  stChips.sort((a,b)=>stPriority(a.k)-stPriority(b.k));
  const shown=stChips.slice(0,3), overflow=stChips.slice(3);
  shown.forEach(({k,v,frozen})=>{
    if(frozen){ const sp=el('span','st frz'); sp.appendChild(ico('freeze','t')); sp.title='Frozen: cannot be rerolled'; row.appendChild(sp); return; }
    const sp=el('span','st '+k); sp.appendChild(ico(ST_IC[k],'t'));
    if(k!=='stun'&&k!=='undying') sp.appendChild(el('span',null,String(v)));
    sp.title=ST_NAME[k]+' '+v; row.appendChild(sp);
  });
  if(overflow.length){
    const more=el('span','st more','+'+overflow.length);
    more.title=overflow.map(({k,v,frozen})=>frozen?'Frozen: cannot be rerolled':(ST_NAME[k]+' '+v)).join(', ');
    row.appendChild(more);
  }
  return row;
}
/* Battle UI redesign (2026-09-16) — enemy card only now; the party card is
   built by partyCard() below (merged with the old dieBox()). Fixed bands
   top to bottom: boss banner (boss only) / intent / portrait (flex:1,
   status chips + preview chip absolutely positioned inside it so their
   count can never change the card's height) / boss rule line (boss only) /
   identity+hp. Fixed 228×224 (340×300 boss) — see .unit.e in the style
   block. */
function unitCard(u){
  const c=el('div','unit e'+(u.hp<=0?' dead':'')+(u.big?' big':'')+(u.elite?' elite':''));
  c.dataset.uid=u.uid;
  let tgtable=false;
  if(sel!=null){ const su=byUid(S,sel); if(su) tgtable=validTargets(su).includes(u.uid); }
  if(selRelic){ const a=RELIC_BY_ID[selRelic].act; tgtable=(a.tgt==='enemy')&&u.hp>0; }
  if(tgtable) c.classList.add('tgt');

  if(u.boss){ const bn=el('div','ubanner'); bn.appendChild(ico('boss','ii','#2a0d0d'));
    bn.appendChild(el('span',null,'BOSS · '+u.n.toUpperCase())); c.appendChild(bn); }
  if(u.hp>0&&u.intent){
    const f=u.intent.face, v=faceValue(S,u,u.rolled);
    const danger = f.t==='dmg' && v>=(u.big?14:10);
    const it=el('div','intent t_'+f.t+(danger?' danger':''));
    it.appendChild(ico(FT_IC[f.t],'ii'));
    it.appendChild(el('span','iv', (f.t==='debuff'||f.t==='buff')? f.k.filter(x=>x!=='aoe').map(kwText).join(' ') : String(v)));
    const tg=u.intent.tgt!=null?byUid(S,u.intent.tgt):null;
    const tgDupe=tg?dupeIndex(tg):null;
    let tl=hasKw(f,'aoe')?'ALL':(tg?(tg.side==='p'?tg.n:(tg.uid===u.uid?'itself':tg.n)):'');
    if(tl&&tgDupe&&tl!=='ALL'&&tl!=='itself') tl+=' ('+tgDupe+')';
    if(tl){ it.appendChild(el('span','ia','→')); it.appendChild(el('span','itg',tl)); }
    ['cleave','pierce','exec'].forEach(k=>{ if(hasKw(f,k)) it.appendChild(el('span','ik',kwText(k).toUpperCase())); });
    c.appendChild(it);
  }
  const spw=el('div','sprwrap');
  const im=el('img','spr mut'+(sprMonIsReal(u.key)?' real':'')); im.src=sprMon(u.key);
  const sprW=(u.big?150:104); im.style.width=sprW+'px'; im.style.height=sprW+'px';
  spw.appendChild(im);
  spw.appendChild(statusChipsEl(u));
  const pv=previewOn(u);
  if(pv) spw.appendChild(el('div','preview '+pv.cls,pv.txt));
  c.appendChild(spw);
  if(u.boss) c.appendChild(el('div','bossdesc',u.desc+(u.phase===2?' · PHASE 2':'')));

  const idb=el('div','idband');
  const idr=el('div','idrow');
  const dupeI=dupeIndex(u);
  const nm=el('span','nm',u.n);
  if(dupeI) nm.appendChild(el('span','dupe-tag',' ('+dupeI+')'));
  idr.appendChild(nm);
  const hv=el('span','hpval');
  hv.appendChild(el('b',null,String(u.hp))); hv.appendChild(el('span','hpmax','/'+u.maxHp));
  idr.appendChild(hv);
  idb.appendChild(idr);
  const pct = u.maxHp ? u.hp/u.maxHp : 0;
  const hpState = pct<=0.25 ? ' crit' : pct<=0.50 ? ' low' : '';
  const bar=el('div','hpbar'+hpState);
  bar.setAttribute('role','progressbar'); bar.setAttribute('aria-valuenow',String(Math.max(0,u.hp)));
  bar.setAttribute('aria-valuemin','0'); bar.setAttribute('aria-valuemax',String(u.maxHp)); bar.setAttribute('aria-label','Health');
  const fill=el('div','hpfill'); fill.style.width=Math.max(0,100*pct)+'%'; bar.appendChild(fill);
  if(pv&&pv.hpAfter!=null){ const gh=el('div','hpghost'); gh.style.left=(100*pv.hpAfter/u.maxHp)+'%'; bar.appendChild(gh); }
  idb.appendChild(bar);
  c.appendChild(idb);

  if(tgtable){ c.onclick=()=>doTarget(u.uid); kbAct(c); }
  else if(u.hp>0){
    /* Not a legal target right now, so a click is a question rather than an
       action: show every face on that Axie's die, ally or enemy. */
    c.classList.add('inspect');
    c.onclick=()=>{ if(Date.now()-lastDragEnd<200) return; SFX.ui(); modal='unit'; modalUid=u.uid; render(); };
    kbAct(c);
  }
  const fl=el('div','floats'); fl.dataset.uid=u.uid; c.appendChild(fl);
  return c;
}
function previewOn(t){
  if(selRelic){ const a=RELIC_BY_ID[selRelic].act;
    if((a.tgt==='enemy')!==(t.side==='e')||t.hp<=0) return null;
    if(a.kind==='heal') return {txt:'+'+a.v,cls:'heal'};
    if(a.kind==='dmg'||a.kind==='ult') return {txt:'-'+a.v,cls:'dmg',hpAfter:Math.max(0,t.hp-a.v)};
    if(a.kind==='stun') return {txt:'STUN',cls:'deb'}; return null; }
  if(sel==null) return null;
  const u=byUid(S,sel); if(!u||!validTargets(u).includes(t.uid)) return null;
  const f=u.die[u.rolled];
  /* Formation Resonance: engine.js only sets u.resonantNow INSIDE execFace,
     so a naive faceValue() here returns the un-boosted number — the preview
     above the target read "-3" while the hit that followed dealt 4. Ask the
     engine the same question execFace asks (findResonanceIdx), then run
     faceValue through the identical code path by flipping the flag for the
     duration of the call and restoring it. Deliberately NOT re-deriving
     `Math.ceil(v*RESONANCE.mult)` here: a second copy of the formula is
     exactly how preview and execution drift apart again. */
  const wouldResonate = findResonanceIdx(S,u,f)>=0;
  let v;
  if(wouldResonate){ const saved=u.resonantNow; u.resonantNow=true;
    v=faceValue(S,u,u.rolled); u.resonantNow=saved; }
  else v=faceValue(S,u,u.rolled);
  const linkTag = wouldResonate ? 'LINK ' : '';
  if(f.t==='dmg'){
    if(u.critNow) v*=rcritMult();
    const low=t.hp<t.maxHp*0.5; if(low&&(u.cls==='beast'||hasKw(f,'exec'))) v=Math.ceil(v*1.6);
    const pierce=hasKw(f,'pierce'); if(pierce&&u.cls==='bird') v+=3;
    if(t.st.vulnerable>0) v=Math.ceil(v*1.5);
    const m=kwVal(f,'multi')||1, tot=v*m;
    const eff=pierce?tot:Math.max(0,tot-t.shield);
    return {txt:linkTag+(u.critNow?'CRIT ':'')+'-'+tot+(t.hp<=eff?' KILL':''),cls:'dmg',hpAfter:Math.max(0,t.hp-eff)};
  }
  if(f.t==='shield') return {txt:linkTag+'SH +'+(v+(t.cls==='plant'?2:0)),cls:'shd'};
  if(f.t==='heal') return {txt:linkTag+'+'+Math.min(v,t.maxHp-t.hp),cls:'heal',hpAfter:null};
  if(f.t==='poison'){ let n=v; if(u.cls==='bug'&&t.st.poison>0) n+=2; return {txt:linkTag+'PSN +'+n,cls:'poi'}; }
  if(f.t==='debuff'||f.t==='buff') return {txt:f.k.filter(x=>x!=='aoe'&&x!=='cantrip').map(kwText).join(' '),cls:'deb'};
  return null;
}

/* Battle UI redesign (2026-09-16) — party card. Merges the old unitCard()
   party path with dieBox(): "portrait and die are now ONE card. No .pcol
   wrapper, no second box" — this is what makes the row structurally
   incapable of being uneven again. Fixed height 360px (--? no, literal
   360, see .unit.p below); cardW is computed by scCombat() from the live
   party count (cardW = floor((boardW - gap*(n-1))/n)) and passed in.
   threatMap[uid] is the summed incoming `dmg` from every enemy targeting
   this Axie this turn (poison/debuff excluded — see scCombat()). linkL/
   linkR (§4b, each either null or {type,partner}) are this card's two
   INDEPENDENT Formation Resonance lookups, computed by scCombat() from
   resonancePairs(S) — a card can hold both at once (middle of a 3-chain). */
function partyCard(u,cardW,threatMap,linkL,linkR){
  const c=el('div','unit p'+(u.hp<=0?' dead':'')+(u.token?' token':'')+(echoTier()>0?' echo'+echoTier():''));
  c.dataset.uid=u.uid;
  c.style.width=cardW+'px';
  c.style.setProperty('--cc',CLASS_COLOR[u.cls]||'#888');
  let tgtable=false;
  if(sel!=null){ const su=byUid(S,sel); if(su) tgtable=validTargets(su).includes(u.uid); }
  if(selRelic){ const a=RELIC_BY_ID[selRelic].act; tgtable=(a.tgt!=='enemy')&&u.hp>0; }
  const dieSel=sel===u.uid;
  const inc=threatMap[u.uid]||0;
  // Border/glow state is mutually exclusive by construction (see .unit.sel/
  // .tgt/.threat in the style block — equal specificity, so whichever class
  // ends up on the element wins outright, no cascade-order guessing needed).
  if(dieSel) c.classList.add('sel');
  else if(tgtable) c.classList.add('tgt');
  else if(inc>0) c.classList.add('threat');

  const pp=el('div','pportrait');
  pp.appendChild(el('div','classbar'));
  const spw=el('div','sprwrap');
  const artEl=unitArtImg(u); const img=artEl.querySelector('img');
  const sprW=cardW>180?96:cardW>140?80:64;
  if(img){ img.style.width=sprW+'px'; img.style.height=sprW+'px'; }
  if(u.pas){ const p=el('div','pasdot',u.pas.n[0]); p.title=u.pas.n+' — '+u.pas.d; spw.appendChild(p); }
  // Replaces .targetedchip ("Targeted by Chomper"): the number is the
  // decision-relevant figure (how much HP you stand to lose this turn),
  // absolutely positioned so 0 or 1 of it never changes the card height.
  if(inc>0){ const db=el('div','dmgbadge'); db.appendChild(ico('dmg','t')); db.appendChild(el('span',null,'−'+inc)); spw.appendChild(db); }
  spw.appendChild(artEl);
  spw.appendChild(statusChipsEl(u));
  const pv=previewOn(u);
  if(pv) spw.appendChild(el('div','preview '+pv.cls,pv.txt));
  pp.appendChild(spw);
  // Bug report 2026-09-16: this used to fire unconditionally, so clicking a
  // legal shield/heal/buff target (self OR an ally) opened the inspect modal
  // instead of confirming the target — the card had no click-to-target
  // handler at all (contrast unitCard() below, which does exactly this via
  // c.onclick). Inspect now only wins when the card ISN'T a valid target;
  // the tgtable branch (near the end of this function, once `c` is fully
  // built) makes the whole card call doTarget() instead.
  if(!tgtable){ pp.onclick=()=>{ if(Date.now()-lastDragEnd<200) return; SFX.ui(); modal='unit'; modalUid=u.uid; render(); }; kbAct(pp); }
  c.appendChild(pp);

  const idb=el('div','idband');
  const idr=el('div','idrow');
  const dupeI=dupeIndex(u);
  const nm=el('span','nm',u.n+' T'+u.tier+(u.token?' *':''));
  if(dupeI) nm.appendChild(el('span','dupe-tag',' ('+dupeI+')'));
  idr.appendChild(nm);
  const hv=el('span','hpval');
  hv.appendChild(el('b',null,String(u.hp))); hv.appendChild(el('span','hpmax','/'+u.maxHp));
  if(u.shield>0){ const sc=el('span','shieldchip'); sc.appendChild(ico('shield','t')); sc.appendChild(el('span',null,String(u.shield))); hv.appendChild(sc); }
  idr.appendChild(hv);
  idb.appendChild(idr);
  const pct=u.maxHp?u.hp/u.maxHp:0;
  const hpState=pct<=0.25?' crit':pct<=0.50?' low':'';
  const bar=el('div','hpbar'+hpState);
  bar.setAttribute('role','progressbar'); bar.setAttribute('aria-valuenow',String(Math.max(0,u.hp)));
  bar.setAttribute('aria-valuemin','0'); bar.setAttribute('aria-valuemax',String(u.maxHp)); bar.setAttribute('aria-label','Health');
  const fill=el('div','hpfill'); fill.style.width=Math.max(0,100*pct)+'%'; bar.appendChild(fill);
  if(inc>0){ const gh=el('div','hpghost'); gh.style.left=(100*Math.max(0,u.hp-inc)/u.maxHp)+'%'; bar.appendChild(gh); }
  idb.appendChild(bar);
  c.appendChild(idb);

  c.appendChild(el('div','uniddiv'));

  const b=el('div','diebox'); b.dataset.uid=u.uid;
  if(u.hp<=0||u.rolled<0){ b.appendChild(el('div','die out','X')); c.appendChild(b);
    const fl=el('div','floats'); fl.dataset.uid=u.uid; c.appendChild(fl); return c; }
  const f=u.die[u.rolled];
  const d=el('div','die'+(dieSel?' sel':u.used?' used':' ready'));
  d.dataset.showlabel=cardW>160?'1':'0';
  d.dataset.smallval=cardW<=180?'1':'0';
  /* Formation Resonance band (§4b) — first child of the die block, present
     on EVERY card (reserved 26px whether linked or not) so a pair forming
     or breaking never changes the row's geometry. linkL/linkR are checked
     independently — never folded into one "side" flag — because the middle
     card of a 3-in-a-row chain has both at once. The edge rails repeat the
     same two directions so the linked side stays legible even when the
     label itself shrinks to "+15%" on narrow (swarm) cards. */
  const resb=el('div','resband'+(linkL?' ll':'')+(linkR?' lr':''));
  if(linkL) resb.appendChild(ico(FT_IC[linkL.type],'ii'));
  const resPct=Math.round((RESONANCE.mult-1)*100);
  // Bug report 2026-09-16: the label used to render unconditionally, so a
  // card with no adjacent matching die still announced "RESONANCE +15%".
  // The band itself stays in the DOM either way (reserved 26px, see above) —
  // only the text is conditional on an actual link.
  if(linkL||linkR) resb.appendChild(el('span','reslbl',cardW<=170?'+'+resPct+'%':'RESONANCE +'+resPct+'%'));
  if(linkR) resb.appendChild(ico(FT_IC[linkR.type],'ii'));
  if(linkL||linkR){
    const names=[];
    if(linkL&&linkL.partner) names.push('← '+linkL.partner.n+' ('+linkL.type+')');
    if(linkR&&linkR.partner) names.push(linkR.partner.n+' ('+linkR.type+') →');
    resb.dataset.tip='Formation Resonance — linked with '+names.join(' and ')+
      '. Whichever of a linked pair you execute SECOND gets +'+resPct+'%.';
    kbAct(resb);
  }
  d.appendChild(resb);
  d.appendChild(el('div','resrail l'+(linkL?' on':'')));
  d.appendChild(el('div','resrail r'+(linkR?' on':'')));
  const hd=el('div','diehd'); hd.appendChild(el('span','dp'));
  if(!u.used&&!u.heavy&&!u.frozen){
    const rs=el('div','rsel'+(u.rsel?' on':'')); rs.appendChild(ico('reroll','t'));
    rs.title='Mark this die for reroll';
    /* bindDrag()'s pointerdown on the whole .die (needed so a drag toward a
       target starts immediately, not just on click) bubbles up from any
       descendant, this marker included. When the rolled face needs a target
       that handler does `sel=uid; render()` on pointerdown itself — see its
       own comment on why — which rebuilds this exact node before the mouse
       ever reaches pointerup/click, so the reroll click never lands (bug:
       "nút reroll không bấm được", 2026-09-16). Stop it here at the source,
       same pattern .onclick below already uses for the click event. */
    rs.onpointerdown=e=>e.stopPropagation();
    rs.onclick=e=>{ e.stopPropagation(); SFX.ui(); u.rsel=!u.rsel; render(); }; kbAct(rs); hd.appendChild(rs);
  } else if(u.frozen){ const fz=el('div','rsel frz'); fz.appendChild(ico('freeze','t')); hd.appendChild(fz); }
  d.appendChild(hd);
  d.appendChild(el('div','diefx'));
  d.appendChild(el('div','kwtags'));
  const faces=el('div','faces'); faces.title='All six faces of this die — the lit one is what you rolled';
  for(let i=0;i<6;i++) faces.appendChild(el('div','facecell'));
  d.appendChild(faces);
  const st=el('div','diestate'); st.appendChild(el('span','dsdot'));
  st.appendChild(el('span','dslabel',dieSel?'PICKED':u.used?'SPENT':'READY'));
  d.appendChild(st);
  /* Formation Resonance is deliberately NOT annotated on the die FACE. The
     die shows its own base number; the +N% is reported at the moment it is
     actually earned, by the "LINK -N" damage float on the target (engine.js
     dealDamage) plus the "LINK x1.15" float on the executor. The band above
     (this card's own reserved space, not a floating connector between
     cards) still announces the pair up front. */
  paintDieFace(d,u,u.rolled,false);
  if(hasKw(f,'heavy')) d.classList.add('heavy');
  d.onclick=()=>clickDie(u);
  d.onmouseenter=()=>SFX.hover();
  kbAct(d);
  b.appendChild(d);
  c.appendChild(b);

  const fl=el('div','floats'); fl.dataset.uid=u.uid; c.appendChild(fl);
  // Bug report 2026-09-16 (cont'd from pp.onclick above) — mirrors unitCard()'s
  // own `if(tgtable){ c.onclick=()=>doTarget(u.uid); ... }`: the whole card
  // (portrait included) confirms the target when this Axie is a legal one,
  // covering self-targeted shield/heal/buff too. Safe alongside the die's own
  // onclick (clickDie) and the reroll marker's (both already run first and
  // either stopPropagation or null out `sel`, which doTarget checks).
  if(tgtable){ c.onclick=()=>doTarget(u.uid); kbAct(c); }
  return c;
}

/* ---------- actions ---------- */
function clickDie(u){
  if(rollAnim||playing||u.used||u.hp<=0) return;
  const f=u.die[u.rolled];
  if(f.t==='blank'){ flash('This face is blank. Try rerolling it.'); render(); return; }
  selRelic=null; SFX.ui();
  if(!needsTarget(u)){ if(playerUseDie(S,u.uid,null)){ logAction('playerUseDie',[u.uid,null]); afterAct(); } return; }
  sel = sel===u.uid? null : u.uid; render();
}
function doTarget(uid){
  if(playing) return;
  if(selRelic){ const r=selRelic; selRelic=null; if(playerUseRelic(S,r,uid)){ logAction('playerUseRelic',[r,uid]); afterAct(); } else render(); return; }
  if(sel==null) return;
  const su=sel; sel=null;
  if(playerUseDie(S,su,uid)){ logAction('playerUseDie',[su,uid]); afterAct(); } else render();
}
async function afterAct(){
  flash(''); sel=null; selRelic=null;
  render();                         /* vẽ lại tray (die đã dùng) trước khi phát */
  await playEvents();
  S.floatText=[];
  if(S.phase==='won'||S.phase==='reward'){ SFX.win(); onCombatEnd(); }
  render(); saveRun();
}
async function doEndTurn(){
  if(rollAnim||playing) return;
  sel=null; selRelic=null;
  const before=S.turn;
  logAction('endTurn',[]);
  endTurn(S); flash('');
  await playEvents();
  S.floatText=[];
  if(S.phase==='reward'||S.phase==='won'){ SFX.win(); onCombatEnd(); render(); saveRun(); return; }
  if(S.phase==='lost'){ SFX.lose(); onRunEnd(); render(); return; }
  if(S.turn>before) triggerRollAnim();
  if(S.enemies.some(e=>e.hp>0&&e.intent&&e.intent.face.t==='dmg'&&faceValue(S,e,e.rolled)>=(e.big?14:12))) SFX.warn();
  render(); saveRun();
}
function onCombatEnd(){
  if(S.bossSteps.includes(S.step)){ const bk=S.bossPlan[S.bossSteps.indexOf(S.step)]; if(bk&&!META.bosses.includes(bk)){ META.bosses.push(bk); saveMeta(); } }
  if(S.phase==='won') onRunEnd();
}
/* Daily Mission (economy-progression.md §10.3, data.js DAILY_MISSION_SHARD) —
   same 'YYYY-MM-DD' UTC string already used by the DAILY SEED button, so a
   player's day boundary is identical across both features. Idempotent: safe
   to call every run-end, only ever grants once per calendar day. */
const todayUTC=()=>new Date().toISOString().slice(0,10);
function claimDailyMission(){
  const today=todayUTC();
  if(META.dailyDate===today) return false;
  META.dailyDate=today; META.shards+=DAILY_MISSION_SHARD;
  return true;
}
function onRunEnd(){
  META.shards+=S.shards;
  if(S.step>META.best) META.best=S.step;
  S.seen.faces.forEach(f=>{ if(!META.faces.includes(f)) META.faces.push(f); });
  S.seen.relics.forEach(r=>{ if(!META.relics.includes(r)) META.relics.push(r); });
  if(S.phase==='won'){ META.wins++; if(S.asc>=META.ascMax&&META.ascMax<10) META.ascMax=Math.min(10,S.asc+1);
    // World Tour questStep() gate (world-tour.md §Detailed Rules/Tầng 2) — exact
    // mirror of the ascMax update above, scoped to S.mode==='full' only: a Short
    // Run win at any Ascension must never advance this (AC 3b negative test).
    if(S.mode==='full'){ if(S.asc>=META.fullAscMax&&META.fullAscMax<10) META.fullAscMax=Math.min(10,S.asc+1); } }
  S.xpGain=runXp(S,S.phase==='won'); META.xp+=S.xpGain;
  S.dailyMissionGranted=claimDailyMission();
  saveMeta();
  const outcome=S.phase==='won'?'win':(S.abandoned?'quit':'loss');
  sendTelemetry('run.ended',{mode:S.mode,ascension:S.asc,ranked:!!S.ranked,outcome,wave:S.step,
    durationMs:S.startedAt?(Date.now()-S.startedAt):0});
  saveRunHistory(); // reads S — must run before clearRun() discards it
  clearRun();
}
/* ================= WORLD TOUR ("Lunacia Atlas") — design/gdd/world-tour.md =================
   progress()/questStep()/gateCleared()/badgeTier() are pure functions of
   META, recomputed on every render — none of their outputs are stored
   (§Formulas #3/#6 explicitly reject caching these as fields, same
   philosophy as echoTier()/badgeTier() elsewhere in this file). Only
   tourClaimed/tourMap2Base/fullAscMax are real, persisted state. */
// progress(map) §Formulas #2 — Map 1's baseline is fixed at 0; Map 2's is the
// one-time META.tourMap2Base snapshot (null until the gate first clears).
function tourProgress(mapIdx){
  if(mapIdx===1) return Math.max(0, META.runs||0);
  tourMaybeSnapshotMap2Base();
  if(META.tourMap2Base==null) return 0;
  return Math.max(0, (META.runs||0) - META.tourMap2Base);
}
// questStep() §Formulas #3 (world-tour.md v6) — participation (Map 1 fully
// progressed) always gates first, then 3 DIFFERENT axes in order: wins
// (volume, TOUR_QUEST_WINS) -> ascMax (skill ceiling, any mode) -> fullAscMax
// (skill + endurance in Full mode specifically). v4/v5 stacked all 3 rungs on
// fullAscMax alone, which let one high-Ascension Full Run win skip the whole
// chain in a single event — this can't collapse the same way because wins is
// an independent counter that doesn't scale with skill (see world-tour.md
// §Detailed Rules/Tầng 2 for the full diagnosis).
function tourQuestStep(){
  if(tourProgress(1) < TOUR_T[9]) return 0;
  if((META.wins||0) < TOUR_QUEST_WINS) return 1;
  if((META.ascMax||0) < 2) return 2;
  if((META.fullAscMax||0) < 3) return 3;
  return 4;
}
function tourGateCleared(){ return tourQuestStep()>=4; }
// Snapshot base(map2) the instant the gate is first observed clear — safe to
// call from any read path: META.runs only changes at run start and
// fullAscMax only at run end, so no run can complete between the gate
// flipping true and the next time anything reads tourProgress(2), meaning
// whichever call happens to notice first still captures the correct value
// (world-tour.md §Formulas #2 "lưu 1 lần").
function tourMaybeSnapshotMap2Base(){
  if(META.tourMap2Base==null && tourQuestStep()>=4){ META.tourMap2Base=META.runs||0; saveMeta(); }
}
// badgeTier(map) §Formulas #6 — product owner resolved world-tour.md's open
// Question #3 (2026-09-08) by choosing option (a): badge now reads
// fullAscMax, same field the Map2 gate (questStep()) already gates on, so
// Gold Map1 and "eligible for Map2" are guaranteed to mean the same thing
// again. See the TOUR_GOLD_THRESHOLD comment in data.js for the prior
// (now-resolved) mismatch this replaces.
function tourBadgeTier(mapIdx){
  if(tourProgress(mapIdx) < TOUR_T[9]) return 'none';
  return (META.fullAscMax||0) >= TOUR_GOLD_THRESHOLD[mapIdx] ? 'gold' : 'silver';
}
function tourLandmarkOk(cond){
  if(!cond) return true;
  if(cond.type==='boss') return (META.bosses||[]).includes(cond.boss);
  if(cond.type==='ascMax') return (META.ascMax||0)>=cond.min;
  return true;
}
function tourMapDef(mapIdx){ return TOUR_MAPS.find(m=>m.map===mapIdx); }
function tourTileEligible(mapIdx,tile){
  return tourProgress(mapIdx)>=TOUR_T[tile.i-1] && tourLandmarkOk(tile.landmark);
}
function tourClaimKey(mapIdx,tileIdx){ return mapIdx+':'+tileIdx; }
// Resolves a tile's reward definition across the real pools AND the 2
// non-title Tour-exclusive registries (never merged into COSMETIC_POOLS —
// see the cosmetics.js comment on TOUR_EXCLUSIVE_DECOR/_BACKGROUNDS).
function tourItemDef(cat,key){
  if(cat==='title') return {n:key};
  const pool=(COSMETIC_POOLS[cat]||{})[key]; if(pool) return pool;
  if(cat==='decor'&&TOUR_EXCLUSIVE_DECOR[key]) return TOUR_EXCLUSIVE_DECOR[key];
  if(cat==='background'&&TOUR_EXCLUSIVE_BACKGROUNDS[key]) return TOUR_EXCLUSIVE_BACKGROUNDS[key];
  return {n:key};
}
// Grants a tile's reward directly into the owned collection — same
// deterministic, no-RNG path Battle Pass uses, never through
// echoBoxOpen()'s roll. No-op (returns false) if already claimed or not yet
// eligible; never grants twice (§Edge Cases "Claim hai lần cùng một ô").
function tourClaim(mapIdx,tileIdx){
  const mapDef=tourMapDef(mapIdx); if(!mapDef) return false;
  const tile=mapDef.tiles.find(t=>t.i===tileIdx); if(!tile) return false;
  const ck=tourClaimKey(mapIdx,tileIdx);
  if((META.tourClaimed||[]).includes(ck)) return false;
  if(!tourTileEligible(mapIdx,tile)) return false;
  const r=tile.reward;
  if(r.cat==='title'){ if(!META.ownedTitles.includes(r.key)) META.ownedTitles.push(r.key); }
  else { const arr=ownedArrFor(r.cat); if(!arr.includes(r.key)) arr.push(r.key); }
  META.tourClaimed.push(ck);
  saveMeta();
  return true;
}
function tourClaimAll(mapIdx){
  const mapDef=tourMapDef(mapIdx); if(!mapDef) return 0;
  let n=0; mapDef.tiles.forEach(t=>{ if(tourClaim(mapIdx,t.i)) n++; });
  return n;
}
/* ---------- MATCH HISTORY entry (see HK comment above for local-only scope
   decision). Runs once per finished (won OR lost, including an ABANDON RUN
   — see scSettings' ABANDON RUN button, which just sets S.phase='lost' and
   calls onRunEnd()) run, before S is discarded. */
function saveRunHistory(){
  // Same selection logic as archStrip() (top archScore(S) entries by score,
  // ties broken by score order) — do not recompute this differently.
  const sc=archScore(S);
  const archetypes=Object.keys(sc).filter(k=>sc[k]>0).sort((a,b)=>sc[b]-sc[a]).slice(0,4).map(k=>({key:k,score:sc[k]}));
  const entry={
    ts:Date.now(), won:S.phase==='won', mode:S.mode, asc:S.asc, ranked:!!S.ranked,
    wave:S.step, len:S.len,
    stats:{dmg:S.stat.dmg,taken:S.stat.taken,maxHit:S.stat.maxHit,kills:S.stat.kills,turns:S.stat.turns},
    shards:S.shards, xp:S.xpGain,
    team:S.roster.map(e=>{ const u=buildUnit(e,S); return {n:u.n,cls:u.cls,tier:u.tier,artIdx:u.artIdx,die:u.die.map(faceText)}; }),
    relics:S.relics.map(id=>RELIC_BY_ID[id]).filter(Boolean).map(r=>({n:r.n,rar:r.rar,d:r.d})),
    archetypes,
    // Explicit strip of DOM/bookkeeping fields (`node`,`id`,`uid`,`provisional`,
    // `orphan`) before persisting — see src/log.js runLogEntries comment:
    // entries share object references with the live clogEntries panel while
    // a run is in progress, so this mapping is the actual "plain-data copy"
    // boundary, done once here rather than trusted to JSON.stringify.
    log:(typeof runLogEntries!=='undefined'?runLogEntries:[]).map(e=>({
      kind:e.kind, text:e.text, fallback:e.fallback, actor:e.actor, part:e.part, tgt:e.tgt,
      segs:e.segs?e.segs.map(g=>({txt:g.txt,cls:g.cls,ic:g.ic})):e.segs,
      deathTag:e.deathTag}))
  };
  const list=loadHistory();
  list.unshift(entry);
  if(list.length>HISTORY_MAX_RUNS) list.length=HISTORY_MAX_RUNS;
  saveHistory(list);
}

const TIERN=['REWARD','BIG REWARD','ELITE REWARD','BOSS REWARD'];
function scReward(){
  const ov=el('div','overlay');
  const bx=el('div','rewardbox tier'+S.rewardTier);
  bx.appendChild(el('h2',null,TIERN[S.rewardTier]||TIERN[0]));
  bx.appendChild(el('div','sub','Your party heals to full and any fallen Axie is revived · +'+(S.kind==='boss'?90:S.kind==='elite'?45:25)+' Shard'));
  const row=el('div','rrow');
  S.rewards.forEach((r,i)=>{
    const c=el('div','rcard r'+(r.rar||0)+' t_'+r.t);
    c.style.animationDelay=(i*140/SPD)+'ms';
    c.appendChild(el('div','rbadge',RARITY[r.rar||0]));
    c.appendChild(el('div','rt',r.title));
    if(r.cls){ const ent=r.uid!=null?S.roster.find(x=>x.uid===r.uid):null;
      // r.key (only set by the 'level' reward, engine.js mkReward) is the
      // TIER-UP TARGET's key — this card previews what the Axie becomes,
      // not what it currently is, so it must win over ent.key (the roster
      // entry's current, pre-upgrade key) whenever it's present. Every
      // other reward type ('ascend'/'face'/'gene') has no r.key and falls
      // back to ent.key exactly as before.
      const heroKey=r.key||(ent&&ent.key), vh=heroKey&&HEROES[heroKey];
      const fallback=sprOf(r.cls,(r.tier===4?6:(r.tier-1)*3)+((ent&&ent.vr||0)%3));
      // Was realArtWrap(vh&&vh.image,...) only — missed the vh.art2 (real,
      // non-NFT Hero art) branch entirely, so every reward preview without
      // a Vault NFT silently fell back to the old pixel sprite forever,
      // even after Hero art was adopted everywhere else (unitArtImg()).
      if(vh&&vh.image) c.appendChild(realArtWrap(vh.image,fallback,'spr'));
      else if(vh&&vh.art2) c.appendChild(houseArtWrap(HOUSE_ART[vh.art2],fallback,'spr',CLASS_COLOR[r.cls]));
      else c.appendChild(realArtWrap(null,fallback,'spr')); }
    else c.appendChild(ico(r.t==='relic'||r.t==='chaos'?'chest':r.t==='curse'?'poison':r.t==='reroll'?'reroll':'shard','ricon'));
    c.appendChild(el('div','rd',r.desc));
    if(r.sub) c.appendChild(el('div','rsub',r.sub));
    if(r.arch&&ARCH[r.arch]){ const a=el('div','rarch',ARCH[r.arch].n); a.style.color=ARCH[r.arch].c; c.appendChild(a); }
    if(r.t==='face'){ const ent=S.roster.find(x=>x.uid===r.uid);
      if(ent){ const u=buildUnit(ent,S); const old=u.die[r.idx];
        c.appendChild(el('div','rrepl','Overwrites: '+faceText(old))); } }
    c.appendChild(el('div','rcta','TAKE'));
    c.onclick=()=>{ if(r.t==='level') SFX.levelup(); else SFX.legend(); if(r.rar>=4) flashScreen('myth'); logAction('takeReward',[i]); takeReward(S,i); sel=null;
      if(typeof clogIngest==='function') clogIngest(S.ev);
      S.ev=[]; S.floatText=[];
      if(S.phase==='combat') triggerRollAnim(); render(); saveRun(); };
    c.onmouseenter=()=>SFX.hover();
    kbAct(c);
    row.appendChild(c);
  });
  bx.appendChild(row);
  if(S.rerollReward>0){
    const rr=btn('sm','REROLL REWARDS ('+S.rerollReward+')',()=>{ if(rerollRewards(S)){ SFX.reroll(); render(); } });
    const wrap=el('div','trow'); wrap.appendChild(rr);
    wrap.appendChild(el('span','hintxt','Once per wave. Draws three new options.'));
    bx.appendChild(wrap);
  }
  bx.appendChild(partyStrip());
  bx.appendChild(archStrip());
  ov.appendChild(bx);
  setTimeout(()=>SFX.open(),80);
  return ov;
}

let lbMode='short', lbAsc=0, lbState='idle', lbRows=[], lbConfigured=true;
/* Set of expanded row `rank`s (see scLeaderboard's build-reference accordion,
   same inline-expand pattern as historyExpanded above) — reset on every
   reload since `rank` is only unique within the CURRENT mode/ascension view. */
let lbExpanded=new Set();
async function loadLeaderboard(){
  lbState='busy'; lbExpanded.clear(); render();
  try{
    const r=await fetch('/api/leaderboard?mode='+lbMode+'&ascension='+lbAsc);
    const data=await r.json();
    lbRows=data.rows||[]; lbConfigured=data.configured!==false; lbState='done';
  }catch(e){ lbState='error'; lbRows=[]; }
  render();
}
function scLeaderboardBody(){
  const w=el('div');
  const cfg=el('div','cfg');
  const modeBox=el('div','cfgrow'); modeBox.appendChild(el('span','cl','MODE'));
  ['short','full'].forEach(m=>{ const b=el('button','btn sm'+(lbMode===m?' on':''),m==='short'?'SHORT RUN':'FULL RUN');
    b.onclick=()=>{ SFX.ui(); lbMode=m; loadLeaderboard(); }; modeBox.appendChild(b); });
  cfg.appendChild(modeBox);
  const ascBox=el('div','cfgrow'); ascBox.appendChild(el('span','cl','ASCENSION'));
  for(let a=0;a<=10;a++){ const b=el('button','btn sm'+(lbAsc===a?' on':''),'A'+a);
    b.onclick=()=>{ SFX.ui(); lbAsc=a; loadLeaderboard(); }; ascBox.appendChild(b); }
  cfg.appendChild(ascBox);
  w.appendChild(cfg);
  if(lbState==='busy') w.appendChild(el('div','iempty','Loading…'));
  else if(lbState==='error') w.appendChild(el('div','iempty','Could not reach the server. Try again later.'));
  else if(!lbConfigured) w.appendChild(el('div','iempty','Leaderboard storage is not set up on this server yet — scores are computed but not saved. See README for setup.'));
  else if(!lbRows.length) w.appendChild(el('div','iempty','No Ranked Run scores yet for this Mode/Ascension — be the first.'));
  else{
    const tbl=el('div','lbtable');
    lbRows.forEach(row=>{
      const hasBuild=!!(row.team&&row.team.length);
      const open=lbExpanded.has(row.rank);
      const r=el('div','lbrow'+(row.won?' won':'')+(hasBuild?' expandable':'')+(open?' open':''));
      r.appendChild(el('div','lbrank','#'+row.rank));
      r.appendChild(el('div','lbname',row.name+(row.wallet?' 🔗':'')));
      r.appendChild(el('div','lbscore',String(row.score)));
      r.appendChild(el('div','lbstep',(row.won?'WON':'wave '+row.step)));
      if(hasBuild){
        r.onclick=()=>{ SFX.ui(); if(open) lbExpanded.delete(row.rank); else lbExpanded.add(row.rank); render(); };
        kbAct(r);
      }
      tbl.appendChild(r);
      if(open&&hasBuild){
        const d=el('div','lbdetail');
        teamRelicsSec(row).forEach(sec=>d.appendChild(sec));
        tbl.appendChild(d);
      }
    });
    w.appendChild(tbl);
  }
  return w;
}

  return w;

/* Dedicated small renderers from the saved plain data, rather than forcing
   partyStrip()/archStrip() (which read the live `S`/`buildUnit()` engine
   state) onto a lightweight fake context — the saved shape (already
   display-ready: `u.n/u.cls/u.tier/u.artIdx/u.die` as strings, `r.n/r.rar/r.d`)
   doesn't line up with what those functions expect closely enough to reuse
   cleanly. archScore() IS reused (in saveRunHistory()) for the archetype
   *selection*; only the presentational chip here is a small local copy of
   archStrip()'s chip markup. */
/* Shared by HISTORY's detail accordion and the Leaderboard's (see scLeaderboard
   below) — both work from the same plain, display-ready shape ({n,cls,tier,
   artIdx,die}[] / {n,rar,d}[]), just from different sources: HISTORY reads the
   client's own saveRunHistory() snapshot, Leaderboard reads api/submit-run.js's
   server-side replay output (see that file's team/relics comment) — the shape
   matching is what lets this one renderer serve both. */
function teamRelicsSec(r){
  const tsec=el('div','colsec'); tsec.appendChild(el('h3',null,'TEAM'));
  const tgrid=el('div','pstrip');
  (r.team||[]).forEach(u=>{
    const c=el('div','psc'); c.style.setProperty('--cc',CLASS_COLOR[u.cls]||'#888');
    c.appendChild(heroArtWrap(u.cls,u.tier,u.artIdx,'spr'));
    c.appendChild(el('div','nm',u.n+' T'+u.tier));
    const dv=el('div','minidie');
    (u.die||[]).forEach(fx=>dv.appendChild(el('span','mf',fx)));
    c.appendChild(dv);
    tgrid.appendChild(c);
  });
  tsec.appendChild(tgrid);

  const rsec=el('div','colsec'); rsec.appendChild(el('h3',null,'RELICS'));
  const rl=el('div','relicstrip');
  if(!r.relics||!r.relics.length) rl.appendChild(el('div','nothing','no relics'));
  (r.relics||[]).forEach(rr=>{ const c=el('div','rchip r'+rr.rar,rr.n); c.title=rr.d; rl.appendChild(c); });
  rsec.appendChild(rl);

  return [tsec,rsec];
}
function histDetail(r){
  const d=el('div','histdetail');
  teamRelicsSec(r).forEach(sec=>d.appendChild(sec));

  const ssec=el('div','colsec'); ssec.appendChild(el('h3',null,'STATS'));
  const rc=el('div','recap');
  const mk=(k,v)=>{ const c=el('div','rcstat'); c.appendChild(el('div','rv',String(v))); c.appendChild(el('div','rk',k)); return c; };
  const st=r.stats||{};
  rc.appendChild(mk('Damage dealt',st.dmg||0));
  rc.appendChild(mk('Damage taken',st.taken||0));
  rc.appendChild(mk('Biggest hit',st.maxHit||0));
  rc.appendChild(mk('Enemies killed',st.kills||0));
  rc.appendChild(mk('Turns played',st.turns||0));
  rc.appendChild(mk('Shard earned',r.shards||0));
  ssec.appendChild(rc);
  d.appendChild(ssec);

  const lsec=el('div','colsec'); lsec.appendChild(el('h3',null,'BATTLE LOG'));
  const log=r.log||[];
  if(!log.length){ lsec.appendChild(el('div','iempty','No log recorded for this run.')); }
  else {
    // Oldest-first, top-to-bottom — runLogEntries (src/log.js) accumulates in
    // that chronological order (push, not unshift), the opposite of the live
    // panel's newest-first convention, because a finished run's log reads
    // like a story here, not like an in-progress feed. clogBuildNode() is the
    // exact same renderer the live panel uses, reused verbatim.
    const body=el('div','histlogbody');
    log.forEach(e=>body.appendChild(clogBuildNode(e)));
    lsec.appendChild(body);
  }
  d.appendChild(lsec);
  return d;
}

/* ================= ACCOUNT (register/login/sync) ================= */
/* design/gdd/player-accounts.md, docs/architecture/adr-0002-player-accounts.md.
   Entirely additive — guests never see server calls from this screen unless
   they submit the form. Follows scImportBody()'s form pattern (cfgrow+vform
   input row, vmsg status line). */
/* Shared login/register form body — used by both the mandatory gate (scGate,
   reached pre-auth) and the post-auth conflict/account screen (scAccount).
   opts.showBack controls whether a BACK-to-menu button is appended: the gate
   has no menu to go back to (there is no screen before it), scAccount's
   pre-auth branch does. */
function buildAuthForm(w, opts){
  opts=opts||{};
  const tabRow=el('div','cfgrow');
  [['login','LOG IN'],['register','REGISTER']].forEach(([m,label])=>{
    const b=el('button','btn sm'+(acctMode===m?' on':''),label);
    b.onclick=()=>{ SFX.ui(); acctMode=m; acctState='idle'; acctMsg=''; render(); };
    tabRow.appendChild(b);
  });
  w.appendChild(tabRow);

  const form=el('div','cfgrow vform');
  const uIn=el('input','seedinp'); uIn.placeholder='Username (3-20, a-z0-9_)'; uIn.value=acctUsername;
  uIn.oninput=e=>acctUsername=e.target.value;
  uIn.onkeydown=e=>{ if(e.key==='Enter') doAuth(acctMode); };
  form.appendChild(uIn);
  const pIn=el('input','seedinp'); pIn.type='password'; pIn.placeholder='Password (min 8 chars)'; pIn.value=acctPassword;
  pIn.oninput=e=>acctPassword=e.target.value;
  pIn.onkeydown=e=>{ if(e.key==='Enter') doAuth(acctMode); };
  form.appendChild(pIn);
  const goB=btn('sm go', acctMode==='login'?'LOG IN':'CREATE ACCOUNT', ()=>doAuth(acctMode));
  if(acctState==='busy') goB.classList.add('dis');
  form.appendChild(goB);
  w.appendChild(form);

  if(acctState==='busy') w.appendChild(el('div','vmsg vmsg-info','Working…'));
  if(acctState==='error') w.appendChild(el('div','vmsg vmsg-bad',acctMsg));
  if(acctMode==='register') w.appendChild(el('div','vmsg vmsg-info','Registering uploads this device\'s current progress as your first cloud save.'));

  if(opts.showBack) w.appendChild(btn('','BACK',()=>{ screen='menu'; render(); }));
}
/* Mandatory login gate (design/gdd/player-accounts.md §3 "App gate"). Reached
   only from boot with no cached token, or a 401 on the first authenticated
   call after boot (stale/expired token). No BACK button — deliberately: there
   is no prior screen to return to, PLAY and every other screen are unreachable
   until doAuth()/pullSyncAfterLogin() succeed and set screen='menu' themselves. */
function scGate(){
  const w=el('div','screen menu title gate');
  const inner=el('div','menu-inner');
  inner.appendChild(el('h1','logo','AXIE DICE TACTICS'));
  inner.appendChild(el('div','sub','Log in or create an account to play.'));
  if(gateMsg) inner.appendChild(el('div','vmsg vmsg-bad',gateMsg));
  buildAuthForm(inner,{showBack:false});
  w.appendChild(inner);
  return w;
}
/* Reachable only post-auth: the sync-conflict prompt (GDD §3 Login) after a
   pullSyncAfterLogin() finds divergent progress, or (pre-auth branch below,
   currently unreachable via any in-app navigation since the ACCOUNT menu tile
   was removed — kept for a possible future "switch account" entry point). */
function scAccount(){
  const w=el('div','screen menu vaultscreen');
  w.appendChild(el('h1','logo sm','ACCOUNT'));

  if(acctConflict){
    w.appendChild(el('div','sub','This device has progress newer than your cloud save. Choose which to keep — nothing is discarded silently.'));
    const row=el('div','cfgrow vform');
    row.appendChild(btn('cta','KEEP THIS DEVICE',()=>resolveConflictKeepLocal()));
    row.appendChild(btn('ghost','USE CLOUD SAVE',()=>resolveConflictUseCloud()));
    w.appendChild(row);
    return w;
  }

  if(authToken){
    w.appendChild(el('div','sub','Signed in as '+(authUsername||'?')+' · progress syncs automatically across devices'));
    w.appendChild(btn('ghost sm','LOG OUT',()=>doLogout()));
    w.appendChild(btn('','BACK',()=>{ screen='menu'; render(); }));
    return w;
  }

  w.appendChild(el('div','sub','Sync your Vault, Unlocks, Collection and Battle Pass across devices.'));
  buildAuthForm(w,{showBack:true});
  return w;
}

/* ================= LEADERBOARD SUBMISSION (Ranked Run only) ================= */
let submitState='idle', submitMsg='';
async function submitRun(){
  submitState='busy'; submitMsg=''; render();
  try{
    // Logged-in players submit under their account username automatically — closes
    // the free-text name-spoofing gap (ADR-0002 GDD Requirements Addressed).
    const nameToUse=(authToken&&authUsername)?authUsername:META.displayName;
    const body={ seed:S.runSeed, teamKeys:S.runTeamKeys, mode:S.mode, ascension:S.asc,
      actions:S.actionLog, displayName:nameToUse, walletAddr:roninAddr, engineVersion:ENGINE_VERSION };
    const r=await fetch('/api/submit-run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok||!data.accepted){ submitState='error'; submitMsg=data.reason||'Submission rejected.'; render(); return; }
    submitState='done';
    submitMsg = data.stored? ('Submitted — Score '+data.score+'.') : ('Score computed ('+data.score+') but the leaderboard isn\'t configured on this server yet.');
    render();
  }catch(e){ submitState='error'; submitMsg='Network error — could not reach the server. Try again.'; render(); }
}
function scSubmitBox(){
  const b=el('div','submitbox');
  b.appendChild(el('div','ud','RANKED RUN — this score is eligible for the Leaderboard.'));
  if(authToken&&authUsername){
    b.appendChild(el('div','vwaddr','SIGNED IN AS '+authUsername.toUpperCase()));
  } else {
    const nameRow=el('div','vform');
    const inp=el('input','seedinp'); inp.placeholder='Display name'; inp.value=META.displayName||'';
    inp.oninput=e=>{ META.displayName=e.target.value.slice(0,24); saveMeta(); };
    nameRow.appendChild(inp);
    b.appendChild(nameRow);
  }
  if(roninAddr) b.appendChild(el('div','vwaddr','WALLET · '+shortAddr(roninAddr)));
  else if(typeof window.ronin!=='undefined') b.appendChild(btn('ghost sm','CONNECT RONIN WALLET (optional)',async()=>{ const a=await connectRonin(); if(a){ roninAddr=a; render(); } }));
  if(submitState==='idle'||submitState==='error'){
    b.appendChild(btn('cta','SUBMIT TO LEADERBOARD',()=>{
      if(!(authToken&&authUsername)&&!(META.displayName||'').trim()){ submitState='error'; submitMsg='Enter a display name first.'; render(); return; }
      submitRun();
    }));
  } else if(submitState==='busy'){ b.appendChild(el('div','vmsg vmsg-info','Submitting…')); }
  if(submitMsg) b.appendChild(el('div','vmsg '+(submitState==='error'?'vmsg-bad':'vmsg-info'),submitMsg));
  return b;
}

function scEnd(){
  const won=S.phase==='won';

/* ================= ONBOARDING TUTORIAL COACH OVERLAY =================
   design/gdd/onboarding-tutorial.md §3.4/§3.5. Renders on top of the exact
   same production scCombat()/scReward() DOM (no separate UI to maintain) —
   this file only decides which single element(s) stay clickable and shows
   a small hint box, appended to document.body (a sibling of #app, so it is
   never itself affected by the #app.tut-locking pointer-events lock below). */
const TUT_PHASE_WELCOME='welcome', TUT_PHASE_ROLL='roll', TUT_PHASE_INTENT='intent', TUT_PHASE_REROLL='reroll',
      TUT_PHASE_DIE='die', TUT_PHASE_TARGET='target', TUT_PHASE_ENDTURN='endturn',
      TUT_PHASE_FREE='free', TUT_PHASE_REWARD='reward', TUT_PHASE_DONE='done';
/* Steps 3-6 are deliberately NOT separate manual-advance flags — they are
   derived fresh from live S/sel state on every render, so there is nothing
   to get out of sync with the actual game. Only steps 0->1 (welcome ->
   "START"), 1->2 (§3.4 "GOT IT"), 2->3 (open-then-close the intent modal,
   handled in tutCoachOverlay()), and reward-taken->8 ("done") need an
   explicit tutStep write; see the `let tutStep` comment above. Steps 0 and
   8 are a deliberately soft entry/exit (product feedback: the tutorial felt
   too abrupt dropping straight into a rolled board, and too abrupt ending
   the instant a reward was taken — casual-game onboarding almost always
   frames the lesson with a short welcome and a short "you're ready" beat). */
function tutPhase(){
  if(!S||tutStep===0) return TUT_PHASE_WELCOME;
  if(tutStep>=8) return TUT_PHASE_DONE;
  if(tutStep<2) return TUT_PHASE_ROLL;
  if(tutStep<3) return TUT_PHASE_INTENT;
  if(S.phase!=='combat') return TUT_PHASE_REWARD;
  if(S.turn>1) return TUT_PHASE_FREE; // coached actions are turn-1 only; free play until reward
  if(S.rerolls===S.maxRerolls) return TUT_PHASE_REROLL;
  // Nobody is `.used` this early in turn 1 except via the one coached
  // execute action — simpler and just as correct as tracking a specific
  // unit, and it stays correct even though WHICH unit gets taught (tutActor())
  // is itself recomputed fresh every render (see its own comment above).
  if(S.party.some(u=>u.used)) return TUT_PHASE_ENDTURN;
  const actor=tutActor();
  if(!actor) return TUT_PHASE_FREE;
  return sel===actor.uid ? TUT_PHASE_TARGET : TUT_PHASE_DIE;
}
function tutLock(allowedEls){
  const root=$('#app'); if(!root) return;
  root.classList.add('tut-locking');
  allowedEls.filter(Boolean).forEach(e=>e.classList.add('tut-allow'));
}
/* Full-screen welcome/done beat — distinct from the small bottom coaching
   bar tutCoachOverlay() uses for the 6 in-battle steps. Opaque backdrop
   (unlike the transparent-background bottom bar) since there is nothing
   underneath worth showing yet (welcome) or worth lingering on (done). */
function tutBigOverlay(title,body,btnLabel,onClick){
  const ov=el('div','tutcoach-big');
  const bx=el('div','tutcoach-big-bx');
  bx.appendChild(el('div','tc-k','TUTORIAL'));
  bx.appendChild(el('h2',null,title));
  bx.appendChild(el('div','tc-d',body));
  bx.appendChild(btn('big go',btnLabel,onClick));
  ov.appendChild(bx);
  return ov;
}
function tutCoachOverlay(){
  if(!S) return null;
  // Intent-seen tracking must run BEFORE the "modal open -> don't lock"
  // early-return below, and must run every render while at step 2, since
  // it is what actually advances past step 2 once the player closes the
  // modal — not the click that opened it (closing it is the real "I read
  // this" signal, and it must never leave the modal's own close affordance
  // fighting a lock — see the modal-open early-return just below).
  if(tutStep===2){
    if(modal==='unit'){ const mu=byUid(S,modalUid); if(mu&&mu.side==='e') tutIntentSeen=true; }
    if(!modal&&tutIntentSeen) tutStep=3;
  }
  if(modal) return null; // never lock while any modal (incl. the one above) is open
  const phase=tutPhase();
  if(phase===TUT_PHASE_FREE) return null; // fully unlocked free play until the fight ends
  // Soft entry/exit (see the phase-constants comment above): a full-screen
  // beat, not the small bottom coaching bar, and the board underneath stays
  // fully locked (empty allow-list) since there's nothing to interact with yet.
  if(phase===TUT_PHASE_WELCOME){
    tutLock([]);
    return tutBigOverlay('Welcome to Axie Dice Tactics!',
      'Every Axie is a die, and every face is a real body part. Let\'s play one battle together before you\'re on your own.',
      'START', ()=>{ tutStep=1; render(); });
  }
  if(phase===TUT_PHASE_DONE){
    tutLock([]);
    return tutBigOverlay('Nice work — you\'re ready.',
      'That\'s the whole loop: roll, read the enemy, reroll if you need to, act, then pick a reward. Everything else you\'ll pick up as you play.',
      'START PLAYING', ()=>{ META.tut=1; saveMeta(); screen='menu'; render(); });
  }
  let title='', body='', allow=[], showUndoHint=false;
  if(phase===TUT_PHASE_ROLL){
    title='Your 5 Axies just rolled';
    body='Every face is a real body part on that Axie.';
  } else if(phase===TUT_PHASE_INTENT){
    title='The enemy shows its hand';
    body='Click an enemy card — you\'ll see exactly who it\'s about to hit, and for how much.';
    allow=$$('.unit.e');
  } else if(phase===TUT_PHASE_REROLL){
    title='Not happy with that roll?';
    body='Press REROLL — marking nothing means all 5 get rerolled.';
    allow=[$('.btn.reroll')];
  } else if(phase===TUT_PHASE_DIE||phase===TUT_PHASE_TARGET){
    // Both the taught die and its target stay unlocked through this whole
    // stage (not narrowed die-then-target) so a single drag-and-drop
    // gesture — starting on the die, dropping on the target — keeps
    // working even before a plain click has set `sel` (see design doc §3.5
    // on accepting both input paths).
    const actor=tutActor();
    if(!actor) return null; // defensive — tutPhase() already checked this, but never lock on a null actor
    const tgts=validTargets(actor), isAttack=actor.die[actor.rolled].t==='dmg';
    const dieEl=$('.diebox[data-uid="'+actor.uid+'"] .die'), tgtEl=tgts[0]!=null?$('.unit[data-uid="'+tgts[0]+'"]'):null;
    allow=[dieEl,tgtEl];
    const tgtWord=isAttack?'the enemy':'your ally';
    if(phase===TUT_PHASE_DIE){ title='Click this die'; body='Click to select it (or drag it straight onto '+tgtWord+').'; }
    else { title='Now pick a target'; body='Click (or drag) onto '+tgtWord+' to use it.'; showUndoHint=true; }
  } else if(phase===TUT_PHASE_ENDTURN){
    title='The enemy acts out exactly what it showed';
    body='Press END TURN.';
    allow=[$('.btn.end')];
  } else if(phase===TUT_PHASE_REWARD){
    title='Pick 1 of 3';
    body='All three are good picks — this is where you start shaping your build.';
    const cards=$$('.rcard'); allow=cards;
    // Wrap rather than replace: the card's own onclick (takeReward + render)
    // must still run first; only after it returns do we finish onboarding
    // and leave the fixture behind for good.
    cards.forEach(c=>{ const orig=c.onclick; c.onclick=ev=>{ if(orig) orig(ev); tutStep=8; render(); }; });
  }
  tutLock(allow);
  const ov=el('div','tutcoach-ov');
  const bx=el('div','tutcoach-bx');
  bx.appendChild(el('div','tc-k','TUTORIAL'));
  bx.appendChild(el('div','tc-t',title));
  bx.appendChild(el('div','tc-d',body));
  if(phase===TUT_PHASE_ROLL) bx.appendChild(btn('big go','GOT IT →',()=>{ tutStep=2; render(); }));
  ov.appendChild(bx);
  // §3.4 step "4c" — a passing, non-blocking Undo reminder; auto-fades via
  // CSS alone (no JS timer to babysit across re-renders).
  if(showUndoHint) ov.appendChild(el('div','tc-undo','Made a mistake? Ctrl+Z undoes it — free until you Reroll or End Turn.'));
  return ov;
}

/* ================= KEYS / BOOT ================= */
/* Leaf/single-purpose screens (each already has its own BACK/MENU button) —
   Esc backs out to the main menu from these, same as clicking that button.
   Deliberately excludes 'combat' (Esc there only deselects, never leaves a
   run) and 'menu'/'team' (no single obvious "back" destination). */
const ESC_TO_MENU_SCREENS=['codex','collection','unlocks','vault','guide','bp','leaderboard','account','history','profile'];
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(modal){ modal=null; render(); return; }
    sel=null; selRelic=null;
    if(ESC_TO_MENU_SCREENS.includes(screen)){ msg=''; screen='menu'; }
    render(); return;
  }
  if((e.key==='i'||e.key==='I')&&S&&screen==='combat'){ modal=(modal==='info'?null:'info'); render(); return; }
  if((e.key==='l'||e.key==='L')&&S&&screen==='combat'&&typeof clogSetOpen==='function'){ clogSetOpen(!clogOpen); render(); return; }
  if(modal) return;
  if(!S||S.phase!=='combat'||playing) return;
  // Onboarding tutorial (design/gdd/onboarding-tutorial.md §3.5): these
  // global shortcuts call .click() directly on the DOM button, which
  // bypasses the CSS pointer-events lock entirely (pointer-events only
  // affects mouse/touch hit-testing, not a scripted click()) — so each one
  // needs its own explicit phase check here, not just the CSS lock above.
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(undo(S)){ logAction('undo',[]); sel=null; render(); } }
  else if(e.key==='r'||e.key==='R'){
    if(screen==='tutorial'&&tutPhase()!==TUT_PHASE_REROLL) return;
    const b=$('.btn.reroll'); if(b&&!b.classList.contains('dis')) b.click(); }
  else if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(screen==='tutorial'&&tutPhase()!==TUT_PHASE_ENDTURN) return;
    const b=$('.btn.end'); if(b) b.click(); }
  else if(e.key>='1'&&e.key<='5'){
    const idx=+e.key-1;
    if(screen==='tutorial'){
      const phase=tutPhase(); const actor=tutActor();
      const taughtIdx=actor?S.party.findIndex(u=>u.uid===actor.uid):-1;
      if(!(phase===TUT_PHASE_DIE||phase===TUT_PHASE_TARGET)||idx!==taughtIdx) return;
    }
    const u=S.party.filter(x=>x.side==='p')[idx]; if(u) clickDie(u); }
});
document.addEventListener('mousedown',e=>{ if(e.button===0&&rollAnim){ rollAnim.t0-=400; } });
window.addEventListener('load',()=>{ loadMeta();
  if(META.vol!=null) AU.vol=META.vol;
  if(META.mvol!=null) AU.mvol=META.mvol;
  if(META.mute) AU.on=false;
  if(META.spd) SPD=META.spd;
  // Mandatory login gate: no cached token -> show ONLY the gate, never the menu
  // (design/gdd/player-accounts.md §3). A cached token renders normally,
  // optimistically (from the LOCALLY cached META — including the tutorial
  // gate decision, computed the same optimistic way as everything else here;
  // see design/gdd/onboarding-tutorial.md §5 for why this is an accepted,
  // not overlooked, edge case), while pullSyncAfterLogin verifies it

// scTourMap() — node-on-path board (design/ux/world-tour-map.md, full spec).
// Board art is a real full-bleed <img> (not a CSS background — needed so
// percent node coordinates can anchor to the image's own rendered box, see
// spec §2), horizontally scrollable, nodes threaded along the real path via
// TOUR_MAPS[].tiles[].node {x,y} (data.js).
// Catmull-Rom -> cubic Bezier through the same tile node points already used
// to place the nodes themselves (never a second, driftable coordinate set).
// Straight "L" segments between waypoints read as an angular zigzag; this
// keeps identical routing but renders it as a continuous curve, closer to
// the painted road underneath without hand-authoring new control points.
// Product owner, 2026-09-10: the plain Catmull-Rom curve still read as
// "stiff" — real reference maps swing in an alternating S-wave between
// stops, not a gentle single bend. Alternating a Y-bulge on each segment's
// control points (sign flips per segment index) adds that swing while the
// curve still passes through the exact same node anchors — no risk of the
// line drifting off the nodes it connects. (Not a true geometric normal —
// the viewBox is `preserveAspectRatio="none"`, so x/y don't share one scale
// and a real perpendicular would need the board's live rendered aspect
// ratio; a vertical-only bulge sidesteps that and reads fine on a
// wide/short board like this one.)
const TOURPATH_WAVE_AMP=7;
function tourPathD(points){
  let d='M'+points[0][0]+' '+points[0][1];
  for(let i=0;i<points.length-1;i++){
    const p0=points[i-1]||points[i], p1=points[i], p2=points[i+1], p3=points[i+2]||p2;
    let c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    let c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    const wave=(i%2===0?1:-1)*TOURPATH_WAVE_AMP;
    c1y+=wave; c2y+=wave;
    d+=' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2[0]+' '+p2[1];
  }
  return d;
}
function scTourMap(mapIdx){
  const mapDef=tourMapDef(mapIdx);
  const w=el('div','screen menu tourmap');

  const header=el('div','tourmap-header');
  const nav=el('div','tourmap-nav');
  nav.appendChild(btn('sm ghost','‹ WORLD MAP',()=>{ tourView='select'; render(); }));
  nav.appendChild(el('h1','logo sm',mapDef.name));
  header.appendChild(nav);
  const actions=el('div','tourmap-actions');
  const p=tourProgress(mapIdx);
  const bar=el('div','bpbar big'); const f=el('div','bpfill'); f.style.width=Math.min(100,p/TOUR_T[9]*100)+'%'; bar.appendChild(f);
  bar.appendChild(el('div','bptxt',Math.min(p,TOUR_T[9])+' / '+TOUR_T[9]+' runs'));
  actions.appendChild(bar);
  const readyTiles=mapDef.tiles.filter(t=>tourTileEligible(mapIdx,t)&&!(META.tourClaimed||[]).includes(tourClaimKey(mapIdx,t.i)));
  if(readyTiles.length){
    actions.appendChild(btn('big go','CLAIM ALL ('+readyTiles.length+')',()=>{ tourClaimAll(mapIdx); SFX.passClaim(); flashScreen('gold'); render(); }));
  }
  header.appendChild(actions);
  w.appendChild(header);

  const board=el('div','tourboard'); board.tabIndex=0;
  const inner=el('div','tourboard-inner');
  const artUrl=(typeof TOUR_MAP_ART!=='undefined'&&TOUR_MAP_ART[mapDef.art])||'';
  if(artUrl){ const img=el('img'); img.src=artUrl; img.alt=mapDef.name; inner.appendChild(img); }

  // Dashed connector line — same {x,y} points the nodes themselves use, so
  // the line can never drift apart from them (spec §5). preserveAspectRatio
  //="none" maps x/y through different scale factors since the art isn't
  // square, hence vector-effect="non-scaling-stroke" (CSS, above) so the
  // dash doesn't render thicker on one axis than the other.
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('class','tourpath'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
  const linePath=document.createElementNS(svgNS,'path');
  linePath.setAttribute('d',tourPathD(mapDef.tiles.map(t=>[t.node.x,t.node.y])));
  svg.appendChild(linePath);
  inner.appendChild(svg);

  let lastClaimedNode=null, lastClaimedT=0, nextNode=null, nextT=TOUR_T[9];
  mapDef.tiles.forEach((t,idx)=>{
    const ck=tourClaimKey(mapIdx,t.i);
    const got=(META.tourClaimed||[]).includes(ck), ready=!got&&tourTileEligible(mapIdx,t);
    const c=el('button','tournode'+(t.landmark?' landmark':'')+(got?' got':ready?' ready'+(wantsLessFlash()?'':' pulse'):' locked'));
    c.style.left=t.node.x+'%'; c.style.top=t.node.y+'%';
    const item=tourItemDef(t.reward.cat,t.reward.key);
    c.appendChild(el('div','tournode-num',String(t.i)));
    if(t.landmark&&t.landmark.type==='boss'){
      // Boss-landmark tiles reuse the real boss portrait already shipped for
      // combat — no new asset, and it tells the player exactly which fight
      // they're walking toward (spec §8).
      const im=el('img'); im.src=sprMon(t.landmark.boss); c.appendChild(im);
    } else if(got||ready){
      const thumbSrc=item.src||item.img;
      if(thumbSrc){ const im=el('img'); im.src=thumbSrc; c.appendChild(im); }
    } else {
      c.appendChild(el('div','tournode-lock','🔒'));
    }
    if(got) c.appendChild(el('div','tournode-badge','✓'));
    else if(ready) c.appendChild(el('div','tournode-badge','!'));
    const label=t.landmark?(t.landmark.type==='boss'?('Defeat '+t.landmark.boss):('Reach Ascension '+t.landmark.min)):((got||ready)?item.n:'Tile '+t.i);
    c.title=label+(got?' — Claimed':ready?' — Ready to claim':' — Locked');
    if(ready){ c.onclick=()=>{ tourClaim(mapIdx,t.i); SFX.passClaim(); flashScreen('gold'); render(); }; kbAct(c); }
    inner.appendChild(c);
    if(got){ lastClaimedNode=t.node; lastClaimedT=TOUR_T[idx]; }
    if(!got && !nextNode){ nextNode=t.node; nextT=TOUR_T[idx]; }
  });

  // "You are here" pawn (spec §7) — interpolated between the last-claimed
  // tile and the next tile per current progress; snaps to the last-claimed
  // tile (or tile 1, pre-claim) once every tile is claimed.
  {
    let pawnX, pawnY;
    if(lastClaimedNode && nextNode){
      const span=nextT-lastClaimedT;
      const frac=span>0?Math.max(0,Math.min(1,(p-lastClaimedT)/span)):0;
      pawnX=lastClaimedNode.x+(nextNode.x-lastClaimedNode.x)*frac;
      pawnY=lastClaimedNode.y+(nextNode.y-lastClaimedNode.y)*frac;
    } else {
      const anchor=lastClaimedNode||mapDef.tiles[0].node;
      pawnX=anchor.x; pawnY=anchor.y;
    }
    const pawn=el('div','tourpawn','📍'); pawn.style.left=pawnX+'%'; pawn.style.top=pawnY+'%';
    inner.appendChild(pawn);
  }

  board.appendChild(inner);
  w.appendChild(board);
  // Auto-scroll the pawn into view once mounted — otherwise a returning
  // player is dropped at the board's literal left edge every time (spec §7).
  setTimeout(()=>{ const pw=inner.querySelector('.tourpawn'); if(pw) pw.scrollIntoView({inline:'center',block:'nearest'}); },0);
  return w;
}

function cxP(html){ const d=el('div','cxp'); d.innerHTML=html; return d; }
function cxTable(head,rows,cls){
  // Column count must always match head.length: the grid template is derived
  // from the real number of columns instead of a hand-matched CSS class, so a
  // 3- or 4-column row can never overflow into the next row's first column
  // (that mismatch used to make a row's last cell visually collide with the
  // following row, e.g. the CLASS/PASSIVE/EFFECT table).
  //
  // T21 (2026-09-03) · the first column used to be a flat 130px regardless of
  // content, and .cchip had no white-space rule — a long chip'd name (relic
  // names like "Chain Reaction", "LUNACIA ULTIMA") would wrap its OWN text
  // mid-badge, splitting the border across two lines (looked broken, not
  // just "wrapped"). Fixed at the root: .cchip is nowrap now (never breaks a
  // badge's own text — see style.css), and the table itself is ONE real CSS
  // grid (was: every .cxtr an independent per-row grid, each sizing its own
  // column 1 independently, which is why `max-content` couldn't be used
  // before — it would have misaligned column edges row to row). Rows are
  // `display:contents` so their cells become direct items of the table's
  // single grid, letting `max-content` size column 1 once, consistently,
  // to whatever that specific table's longest first-column entry actually
  // needs — short-label tables (KEY, MODE, TIER) stay compact, name-heavy
  // ones (NAME, CARD, RELIC) get the room they need, capped so one freak
  // long entry can't eat the EFFECT column's space.
  // Nesting min()/max() inside minmax() (to also cap the grown width) is
  // CSS-valid per spec but NOT supported by this project's target renderer
  // (verified: CSS.supports() returns false for it here, and assigning it
  // via .style silently no-ops the WHOLE property, which is far worse than
  // the bug this was fixing — every column collapsed to one). Plain
  // minmax(x,max-content) alone IS supported; skip the cap.
  const n=head.length;
  // 'iconrow' (STATUS EFFECTS glossary) — column 1 holds ONLY a 36px icon,
  // never text, so max-content sizing (built for text-heavy columns like
  // relic/part names) left a 110px+ column around a much smaller icon —
  // reported by the product owner as icon-vs-cell looking wildly
  // unbalanced. Fix column 1 to just fit the icon, not the text columns'
  // sizing rule.
  const gtc = cls==='iconrow' ? '64px repeat('+(n-1)+',1fr)'
    : n<=2 ? 'minmax(120px,max-content) 1fr'
    : 'minmax(110px,max-content) repeat('+(n-1)+',1fr)';
  const t=el('div','cxtable '+(cls||''));
  t.style.gridTemplateColumns=gtc;
  const mkRow=(cells,isHead)=>{
    const tr=el('div','cxtr'+(isHead?' cxhead':''));
    cells.forEach(c=>{ const d=el('div','cxtd'); if(typeof c==='string') d.textContent=c; else if(c) d.appendChild(c); tr.appendChild(d); });
    return tr;
  };
  t.appendChild(mkRow(head,true));
  rows.forEach(r=>t.appendChild(mkRow(r,false)));
  return t;
}
const chip=(txt,col)=>{ const s2=el('span','cchip',txt); if(col){ s2.style.borderColor=col; s2.style.color=col; } return s2; };
/* 'chip' icon size (24px, see .icow.chip) — was 't' (11px), unreadable now

  d.appendChild(cxP(`Every Axie carries <b>one six-sided die</b>, and those six faces are its <b>six body parts</b>.
   Class does not decide which part sits on which face. Class decides the <b>distribution</b> of parts.
   Plant has several Back faces, Beast leans on Horn, Aqua on Ears. That is why two Axies of different classes play nothing alike.<br>
   The row of <b>six small squares</b> under each die shows all six faces, with the current one lit. Hover any square to read that face.
   The border colour tells you its rarity.`));
  d.appendChild(cxH('THE SIX PARTS'));
  d.appendChild(cxTable(['PART','ROLE'],[
    [partIconChip('mouth','beast','MOUTH'),'Single-target damage. Often carries Lifesteal.'],
    [partIconChip('horn','bug','HORN'),'Your heaviest hits. Often carries Pierce or Heavy.'],
    [partIconChip('back','plant','BACK'),'Shield for itself or an ally.'],
    [partIconChip('tail','reptile','TAIL'),'Multi-target work: Cleave, area damage and Poison.'],
    [partIconChip('eyes','bird','EYES'),'Utility: healing, debuffs and summoning.'],
    [partIconChip('ears','aqua','EARS'),'Mana. Always triggers on its own without using your action.'],
    [partIconChip('blank','plant','BLANK'),'A dead face. Reroll it, or overwrite it with a Gene Mutation.'],
  ]));
  d.appendChild(cxH('RARITY LIVES ON THE FACE'));
  d.appendChild(cxP(`This is the biggest difference between this game and others like it: rarity is <b>not</b> a property of the die,
   it is a property of <b>each individual face</b>. A Gene Mutation reward hands you a new face and <b>you decide which of the six it replaces</b>.
   That is a real decision, and sometimes a painful one. Do you overwrite the blank, or the Shield face that has been carrying you?`));
  d.appendChild(cxTable(['TIER','DEFINITION','EXAMPLE'],
    RARITY.map((r,i)=>[chip(r,RAR_COL[i]),
      ['One action, no keywords','One keyword','Two keywords','Two keywords and a big number','Breaks a rule of the game'][i],
      ['MOUTH · Damage 6','HORN · Damage 7 · [Pierce]','HORN · Damage 10 · [Pierce + Crit 25%]','HORN · Damage 18 · [Heavy + Pierce]','TAIL · Poison 7 · [All + Plague]'][i]])));
  d.appendChild(cxH('GOLDEN AND COSMIC DICE'));
  d.appendChild(cxP(`The rarity of the <b>whole die</b> is simply the sum of its faces:<br>
   · <b>two or more Legendary faces</b> makes it a <span class="gold">GOLDEN DIE</span>, with a gold glowing border<br>
   · <b>a single Mythic face</b> makes it a <span class="cos">COSMIC DIE</span>, pulsing pink<br><br>
   In other words, <b>a beautiful die is something you build, not something you find.</b> Rarity here is an output of your decisions, not an input.`));
  d.appendChild(cxH('WHY CRIT IS SHOWN BEFORE YOU ATTACK'));
  d.appendChild(cxP(`Crit is decided the moment the die lands, and a <b>CRIT x2</b> badge appears on that face straight away.
   The reason is simple: the whole game rests on you seeing every piece of information before you commit. If crit were rolled
   when you pressed attack, you could no longer plan a turn.`));
  return d; },

/* ================= GUIDE — đội hình mẫu ================= */
// Sample Teams body — merged into scCodex() as the 'guide' outer tab
// (was previously its own full screen, scGuide()); returns just the card
// grid, the title/sub/BACK are now shared chrome owned by scCodex().
function scGuideBody(){
  const g=el('div','guidegrid');
  GUIDES.forEach(G=>{
    const a=ARCH[G.arch];
    const c=el('div','gcard'); c.style.setProperty('--gc',a?a.c:'#ffd76a');
    c.appendChild(el('div','gname',G.n));
    c.appendChild(el('div','gdiff',G.diff));
    const tm=el('div','gteam');
    G.team.forEach((k,i)=>{ const h=HEROES[k];
      const u=el('div','gu'); u.style.setProperty('--cc',CLASS_COLOR[h.cls]);
      u.appendChild(heroArtWrap(h.cls,h.tier,h.art+(G.team.slice(0,i).filter(x=>x===k).length%3),'spr'));
      u.appendChild(el('div','gn',h.n)); tm.appendChild(u); });
    c.appendChild(tm);
    c.appendChild(el('div','gwhy',G.why));
    const ul=el('div','ghow');
    G.how.forEach(h=>{ const r=el('div','gh'); r.appendChild(el('span','gb','')); r.appendChild(el('span',null,h)); ul.appendChild(r); });
    c.appendChild(ul);
    c.appendChild(btn('sm go gbtn','USE THIS TEAM',()=>{ teamPick=G.team.slice(); screen='team'; render(); }));
    g.appendChild(c);
  });
  return g;
}

/* ================= [4] SETTINGS + [MỚI] BẢNG THÔNG TIN TRONG TRẬN ================= */
let modal=null, infoTab='party', modalUid=null, railOpen=null;
let pendAvatarData=null, pendAvatarErr=null;

function closeModal(){ modal=null; pendAvatarData=null; pendAvatarErr=null; render(); }
function modalShell(title,sub,tabs,bodyFn){
  const ov=el('div','overlay modalov');
  ov.onclick=e=>{ if(e.target===ov) closeModal(); };
  const bx=el('div','modalbox');
  const hd=el('div','mdhead');
  const ti=el('div','mdtitle'); ti.appendChild(el('span',null,title));
  if(sub) ti.appendChild(el('span','mdsub',sub));
  hd.appendChild(ti);
  const x=el("button","btn xs ghost mdx","CLOSE"); x.onclick=closeModal; hd.appendChild(x);
  bx.appendChild(hd);
  if(tabs){ const tb=el('div','mdtabs');
    tabs.forEach(([k,n])=>{ const b=el('button','mdtab'+(infoTab===k?' on':''),n);
      b.onclick=()=>{ SFX.ui(); infoTab=k; render(); }; tb.appendChild(b); });
    bx.appendChild(tb); }
  const bd=el('div','mdbody'); bd.appendChild(bodyFn()); bx.appendChild(bd);
  ov.appendChild(bx);
  return ov;
}

const INFO_TABS=[['party','YOUR TEAM'],['relic','YOUR RELICS'],['enemy','ENEMIES'],
  ['st','STATUS EFFECTS'],['kw','KEYWORDS'],['mana','MANA']];
function faceRow(u,f,i){
  const r=el('div','ifrow'+(u&&u.rolled===i?' cur':'')+' r'+(f.r||0));
  r.appendChild(el('div','ifn',String(i+1)));
  const ic=el('div','ific'); ic.appendChild(ico(FT_IC[f.t],'t')); r.appendChild(ic);
  r.appendChild(el('div','ifp',f.name||PARTN[f.p]||TYPEN[f.t]||'—'));
  r.appendChild(el('div','ifv', f.t==='blank'?'—':String(u?faceValue(S,u,i):f.v)));
  const kws=f.k.filter(k=>k!=='heavy');
  r.appendChild(el('div','ifk',kws.length?kws.map(kwText).join(' · '):''));
  if(f.r>=1) r.appendChild(el('div','ifr',RARITY[f.r]));
  return r;
}
/* Battle UI redesign §7 (2026-09-16) — new row renderer for the inspect
   modal below. Do NOT fold this into faceRow(): that function has two OTHER
   call sites in scInfo() (party tab + enemy tab of the general info modal,
   `I` key) which this design never covered — restyling faceRow() in place
   would silently reskin two screens outside this change's scope. Adds what
   the board no longer shows once §4 dropped rarity/heavy from the die card:
   each face's rarity pill and its keyword chips (reusing .kwtag). */
function inspFaceRow(u,f,i){
  const cur=u&&u.rolled===i;
  const r=el('div','uip-frow'+(cur?' cur':''));
  r.appendChild(el('div','uip-fp',f.name||PARTN[f.p]||TYPEN[f.t]||'—'));
  const ic=el('div','uip-fic'); ic.appendChild(ico(FT_IC[f.t],'t')); r.appendChild(ic);
  const v=f.t==='blank'?null:(u?faceValue(S,u,i):f.v);
  const val=el('div','uip-fv',v==null?'—':String(v)); val.style.color=FT_COLOR[f.t]||'var(--dim)'; r.appendChild(val);
  const cap=el('div','uip-fcap');
  cap.appendChild(el('div',null,faceCaption(f,v||0)));
  if(f.k.length){ const kw=el('div','uip-fkw'); f.k.forEach(k=>kw.appendChild(el('span','kwtag',kwText(k).toUpperCase()))); cap.appendChild(kw); }
  r.appendChild(cap);

/* ============ COMBAT ANIMATION ENGINE (S&D-style playback) ============
   Engine phát ra một stream sự kiện có thứ tự (s.ev). UI phát lại tuần tự:
   lunge → flash → knockback → số bay lên → HP bar tụt (chip bar) → chết.
   Trong lúc playback KHÔNG re-render (giữ DOM ổn định), chỉ mutate trực tiếp. */

let playing=false, skipHold=false, dragging=null, aimEl=null, lastDragEnd=0;

function setBars(uid,hp,maxHp,shield){
  const n=unitEl(uid); if(!n) return;

  const fill=n.querySelector('.hpfill'), txt=n.querySelector('.hpnum b');
  if(fill) fill.style.width=pct+'%';
  if(txt) txt.textContent=Math.max(0,hp)+'/'+maxHp;
  /* keep the danger class in sync during playback, not only on re-render */
  const bar=n.querySelector('.hpbar');
  if(bar){ const p=maxHp?hp/maxHp:0;
    bar.classList.toggle('low', p<=0.50 && p>0.25);
    bar.classList.toggle('crit', p<=0.25 && p>0);
    bar.setAttribute('aria-valuenow',String(Math.max(0,hp))); }
  let sb=n.querySelector('.shbar');
  if(shield>0){
    if(!sb){ sb=el('div','shbar'); const sl=el('span'); sl.appendChild(ico('shield','t'));
      sl.appendChild(el('span','stv','0')); sb.appendChild(sl); n.querySelector('.hpbar').after(sb); }
    sb.style.width=Math.min(100,100*shield/maxHp)+'%';
    const v=sb.querySelector('.stv'); if(v) v.textContent=String(shield);
    sb.classList.remove('brk');
