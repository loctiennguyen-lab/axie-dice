/* ═══════════════════ T10 · BREAKPOINTS ═══════════════════
   Trước bản này toàn bộ file có đúng 1 @media, và đó là prefers-reduced-motion.
   Chiến lược responsive duy nhất là zoom cả trang, nên ở 393px nhãn BACK/HORN
   sẽ render ở 4.1px. Ở đây ta đổi KÍCH THƯỚC COMPONENT thay vì zoom.
   Bề rộng tối thiểu của bàn chơi = 5×unit + 4×gap + 2×padding. */

/* 900–1199px — laptop hẹp / tablet landscape: 5×140 + 4×10 + 24 = 764px.
   --board-w:874 (was 1175, 2026-09-16 fix): partyCard()'s cardW formula is
   floor((--board-w - gap*(n-1))/n) with gap=16 at n≤6 (Battle UI redesign
   §4) — 1175 assumed the DESKTOP-tier gap/padding math and, at this tier's
   own worst case (900px, #app's default 12px×2 padding, usable 876px),
   produced a 5-card row 1174px wide — 298px past the actual 876px available.
   874 is the largest value that still fits at 900px (floor((874-64)/5)=162,
   row=874 ≤ 876). --unit-w/--die-w above are unrelated legacy tokens (the
   old .pcol layout, kept for any non-combat consumer) — not what sizes the
   party card row any more. */
@media (max-width:1199px){
  :root{ --unit-w:140px; --die-w:140px; --die-h:164px; --zone-gap:10px; --ui-scale:1;
         --board-w:874px; }
  .unit.e{ width:180px; height:190px; }
  .unit.e.big{ width:280px; height:250px; }
}

/* 600–899px — tablet portrait. Kiểm ở cận dưới 600: 5×104 + 4×8 + 16 = 568 ≤ 600
   (that arithmetic is the OLD --unit-w-driven layout's own verification — see
   the --board-w comment below for the CURRENT formula this tier actually uses). */
@media (max-width:899px){
  :root{ --unit-w:104px; --die-w:104px; --die-h:136px; --zone-gap:8px;
         --die-num:24px; --spr-w:76px; --ui-scale:1;
         /* --board-w:584 (was 875, 2026-09-16 fix) — same bug as the 1199px
            tier above, one tier down: worst case here is 600px width, #app
            padding 8px×2 (line below), usable 584px. 875 produced an 874px
            row — verify.mjs B2.tablet/B2.phone caught this at their own
            744px/852px test widths, which are inside this same tier and
            already too narrow for 875. floor((584-64)/5)=104 — the exact
            --unit-w this tier already used before the cardW formula existed,
            so cards land at their pre-redesign size here, just via the new
            formula instead of a fixed width. */
         --board-w:584px; }
  #app{ padding:var(--s2) var(--s2) var(--s3); }
  .track{ flex-wrap:wrap; row-gap:var(--s2); }
  .menu-grid{ grid-template-columns:repeat(2,1fr); }
  .pickgrid{ grid-template-columns:repeat(3,1fr); }
  .cxshell{ flex-direction:column; }
  .cxnav{ flex:0 0 auto; flex-direction:row; flex-wrap:wrap; position:static; }
  .cxtab.on{ border-left-color:transparent; border-bottom:2px solid var(--acc); }
  .unit.e{ width:140px; height:150px; }
  .unit.e.big{ width:220px; height:200px; }
  /* Battle UI redesign — the 4-segment top bar's fixed height:48px
     (tools/verify.mjs B2: scrollWidth was overflowing 744px/852px by 300-
     700px, the segments simply don't fit in one row this narrow) wraps to
     multiple rows instead; each segment keeps its own border as a visual
     row divider. */
  .topbar{ height:auto; flex-wrap:wrap; }
  .topbar>*{ border-right:none; border-bottom:1px solid var(--line); }
  .tb-util{ border-bottom:none; }
}

/* <600px — phone. Kiểm ở 393px: 16 + 5×64 + 4×6 = 360 ≤ 393 (old --unit-w
   arithmetic; see the --board-w comment below for what the row actually
   uses now). Not hit by verify.mjs's own B2 checks today (its rotated
   "phone" landscape width is 852px, inside the 899px tier above) but a
   real small-landscape phone (e.g. 568px-wide) does reach this tier. */
@media (max-width:599px){
  :root{ --unit-w:64px; --die-w:64px; --die-h:136px; --zone-gap:6px;
         --die-num:24px; --spr-w:56px; --hp-h:6px; --ui-scale:1;
         /* --board-w:375 (was 575, 2026-09-16 fix) — same bug, one tier
            further down: worst case 393px width, usable 377px. 575 would
            floor to a 574px row here, same class of failure as the two
            tiers above. floor((375-64)/5)=62, row=5×62+64=374 ≤ 377. */
         --board-w:375px; }
  #app{ padding:var(--s2) var(--s2) var(--s3); }
  .nm{ display:none; }
  .die{ padding:6px 4px; }
  .bottombar{ position:sticky; bottom:0; height:60px; z-index:20; }
  .btn--lg,.btn.big,.btn.cta{ --btn-h:52px; }
  .pickgrid{ grid-template-columns:repeat(2,1fr); }
  .guidegrid{ grid-template-columns:1fr; }
  .bptrack{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
  .unit.e{ width:110px; height:130px; }
  .unit.e.big{ width:180px; height:170px; }
}

/* ═══════════════════ T10b · SHORT-WINDOW BREAKPOINT (chiều CAO) ═══════════════════
   T10 ở trên chỉ hỏi "cửa sổ RỘNG bao nhiêu". Nhưng bàn combat có chiều cao
   nội tại ~808px (track 48 + enemies 233 + party 369 + bottombar 68 + gap/padding),
   và con số đó KHÔNG phụ thuộc chiều rộng — nên ở 1280×720 (laptop 13" phổ biến)
   END TURN rơi xuống bottom=768, tức 48px dưới mép màn hình.

   Trước đây fitUI() trong ui.js che được lỗi này bằng cách zoom cả trang nhỏ lại,
   nhưng sàn của nó đã bị nâng 0.85 → 1.0 (chữ không được nhỏ hơn --t1:11px, và
   tools/verify.mjs A4 hardcode 11px), nên --ui-scale giờ luôn = 1 ở mọi cửa sổ
   thấp — không còn cơ chế nào bù chiều cao nữa. Đây là cơ chế thay thế, và nó đi
   đúng theo triết lý của T10: đổi KÍCH THƯỚC COMPONENT, không zoom, nên chữ vẫn
   giữ nguyên cỡ đã thiết kế (11px vẫn là 11px).

   Ngưỡng 840px: bàn full-size đo được 808px, nên mọi cửa sổ dưới ~840px là không
   còn headroom. 900px (viewport desktop của verify.mjs) nằm ngoài, cố ý — bản
   render desktop đã được verify không đổi một pixel nào.

   min-width:900px: dưới mức đó T10 đã thu nhỏ component rồi. Điện thoại xoay
   ngang (852×393, verify.mjs có kiểm) vì thế không bị đụng tới.

   2026-09-15 (Battle UI handoff, die-card fixed-height rewrite): --die-h ở
   MỌI breakpoint tăng đáng kể (die-card giờ cao cố định) — số "~808px" ở
   trên KHÔNG còn đúng, chưa đo lại con số mới. 2026-09-16: .dcap (caption
   4 dòng clamp) đã bị xoá hẳn (thay bằng .kwtags + .resband, xem style
   block), nên con số thật đã đổi THÊM một lần nữa — vẫn CHƯA đo lại. Khối
   này vẫn giữ đúng chức năng
   "chỉ thu nhỏ, không phóng to" vì --die-num:24px kéo --die-h xuống lại
   150px — thấp hơn tier 164px của desktop (T10b vẫn giữ .dp hiển thị, không
   ẩn như breakpoint ≤899px, nên không xuống tới tier 136px của khối đó).

   Các giá trị lấy lại từ breakpoint ≤899px sẵn có (--spr-w:76px) và từ
   .zone.party.compact — style.css đã tự chứng minh cỡ đó đọc/chạm được. */
@media (min-width:900px) and (max-height:840px){
  /* --spr-big phải co theo --spr-w, không được để nguyên 164px: tỉ lệ thiết kế
     gốc là 164/100 = 1.64 (boss to hơn Axie party 64%). Nếu chỉ co --spr-w mà
     giữ --spr-big thì tỉ lệ thành 164/76 = 2.16 — con boss ĐÈ TO HƠN chủ đích,
     và chính nó là thứ duy nhất làm trận boss còn tràn. 76*1.64 ≈ 124px giữ
     nguyên đúng tỉ lệ 1.63, nên boss vẫn áp đảo y như trên desktop. */
  /* --die-num:24px shrinks the face-value digit (the tallest single glyph
     in the card) back down to the ≤899px tier — without it, the fixed-
     height card needed to fit a 2-line caption under the default 34px
     value digit is the SAME height as full desktop (164px), which defeats
     this block's whole point of shrinking things for a short window. */
  :root{ --spr-w:76px; --spr-big:124px; --die-h:150px; --die-num:24px; }
  #app{ padding-bottom:var(--s2); }
  .track{ padding:4px 10px; margin-bottom:6px; }
  .zone.enemies{ padding-top:8px; }
  .zone.party{ margin-top:12px; }
  .pcol{ gap:8px; }
  /* Ghim thanh hành động — đúng cách breakpoint ≤599px đã dùng sẵn cho cùng vấn
     đề này. Lưới token phía trên đã đủ để trận THƯỜNG vừa khít (1280×720:
     doc 808 → 720, hết scroll hẳn), nhưng trận boss thì .unit.big vẫn cao 282px
     nên bàn còn cao hơn cửa sổ ~67px. Ghim bar là lưới an toàn: END TURN /
     REROLL LUÔN chạm tới được bất kể bàn cao bao nhiêu, và không phải chỉnh lại
     số ma thuật mỗi lần thêm nội dung dọc (đúng nỗi lo mà comment BOARD_H trong
     ui.js đã ghi). Đã đo: ở boss 1280×720, tâm cả 5 xúc xắc đều nằm TRÊN bar
     (không bị che), cuộn xuống là hiện đủ toàn bàn.
     .bottombar đã có background:var(--pan) + border đặc nên không lộ nội dung
     phía dưới khi cuộn. */
  .bottombar{ margin-top:8px; position:sticky; bottom:0; z-index:20; }
}

/* T11 · phone portrait gate — bàn 5 cột về bản chất là bố cục ngang */
.rotate-hint{ display:none; }
@media (max-width:599px) and (orientation:portrait){
  .rotate-hint{
    display:flex; position:fixed; inset:0; z-index:100;
    flex-direction:column; align-items:center; justify-content:center; gap:var(--s4);
    background:var(--bg); color:var(--txt); font-size:var(--t3); text-align:center;
    padding:var(--s5);
  }
  .rotate-hint .rh-ic{ font-size:var(--t5); color:var(--acc); }
  .screen.combat{ display:none; }
}

/* ═══════════════════ T15 · COMBAT LOG ═══════════════════
   design/ux/combat-log.md. Lives outside #app (see log.js clogInit()) so
   ui.js's full-teardown render() never unmounts it — visibility is toggled
   with body.clog-open, not by adding/removing the node. */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* Outer box: always fully inside the viewport, geometry never changes between
   open/closed — this is what keeps a closed panel from ever contributing to
   document.scrollWidth. The reveal animates via clip-path (paint-only, does
   not move the box) rather than transform:translateX(), because a
   translated-out-of-view descendant was still being counted toward
   document.scrollWidth by the browser even with overflow:hidden on an
   ancestor (regressed tools/verify.mjs B2 — see log.js clogInit() comment). */
.clog-panel{
  position:fixed; z-index:60; top:0; right:0; height:100%; width:280px; max-width:92vw;
  pointer-events:none;
}
body.clog-open .clog-panel{ pointer-events:auto; }
.clog-inner{
  position:absolute; inset:0; display:flex; flex-direction:column;
  background:var(--pan); border-left:var(--bd) solid var(--line2);
  clip-path:inset(0 0 0 100%); opacity:0;
  transition:clip-path .18s ease, opacity .18s ease;
}
body.clog-open .clog-inner{ clip-path:inset(0 0 0 0); opacity:1; }
.clog-head{ display:flex; align-items:center; justify-content:space-between;
  padding:var(--s2) var(--s3); border-bottom:1px solid var(--line); }
.clog-title{ font-size:var(--t1); letter-spacing:2px; color:var(--dim); }
.clog-bodywrap{ position:relative; flex:1; overflow:hidden; display:flex; flex-direction:column; }
.clog-body{ flex:1; overflow-y:auto; padding:var(--s2) var(--s3); display:flex; flex-direction:column; }
.clog-entry{ font-size:var(--t2); color:var(--txt); padding:6px 0; border-bottom:1px solid var(--line);

   #app is max-width:1240px and centered (margin:0 auto), AND .zone additionally

   spec math (single right-aligned board, safe at 1200px) undercounted the real
   margin needed. Empirically measured via getBoundingClientRect() in-browser
   (party-unit right edge vs panel left edge) across viewport widths:
     1280px → 266px overlap · 1600px → 21px overlap · 1620px → 11px overlap
     1680px → 0px overlap   · 1750px → 0px overlap
   True zero-overlap threshold is ~1660-1670px; 1700px keeps a safety buffer.
   Below this, overlay-drawer (see next block) is used instead, same pattern
   already shipped and accepted for the 600-1199px tablet tier (which also
   overlaps live board content by design, behind a scrim). */

   behind the scrim in spirit (same accepted tradeoff as the original 600-1199px tablet tier).

   actually enough dead space (see comment above). */

/* ============================================================
   BACKGROUND MUSIC — external, lazily fetched, optional.

   Deliberately NOT embedded in the single HTML file. Audio is the one asset
   class where the single-file rule stops paying: a usable loop is 1-3MB, which
   would more than double a 2.4MB page that today loads in one request. So the
   game stays one file and the music arrives separately, on demand.

   Three properties this has to hold, in order of importance:

   1. MUSIC IS OPTIONAL. No file present, a 404, a file:// load with no server,
      a browser that refuses the codec, autoplay denied — every one of those
      ends in a silent game that plays perfectly. Nothing here may throw into
      the caller: render() calls sync() on every screen change, and t_vault.mjs
      loads the build over file:// where media may not load at all.

      sync() runs on every render, so a retry-on-failure would hammer the
      network for the whole session.

      music reads the same two flags plus its own level, AU.mvol.

   through MediaElementAudioSourceNode taints on file:// and needs CORS headers
   on any other origin, which would trade working audio for a filter we do not
   need. Crossfading is done by ramping .volume on a single shared ticker.

var MUS=(()=>{
  const DIR='assets/audio/';
  /* One file per mood. `w` trims a track that was mastered hotter than the rest
     without re-exporting it. Add a key here and sync() can reach it. */
  /* `intro` is optional and plays ONCE per session, then hands off to `file`, which
     loops forever. Real game music is built this way for a reason: the composed
     build-up is the best part to arrive on, and the worst thing to hear every 69
     seconds. Cut from the source on the beat grid (117.719 BPM, bar = 2.0387s):
     intro = 5.1675s-17.4000s (6 bars), loop = 17.4000s-86.7174s (34 bars), with a
     50ms equal-power crossfade at the loop's head. All three moods point at the same
     pair, so one continuous take runs across menu / battle / boss. */
  const TRACKS={
    menu:  {file:'lunacia-loop.m4a', intro:'lunacia-intro.m4a', w:1.00},
    combat:{file:'lunacia-loop.m4a', intro:'lunacia-intro.m4a', w:1.00},
    boss:  {file:'lunacia-loop.m4a', intro:'lunacia-intro.m4a', w:1.00},
  };
  const FADE_MS=900, TICK_MS=50;

  /* Keyed by FILE, not by track key. Two moods pointing at the same file share one
     element, so moving menu -> combat -> boss on a single-track soundtrack keeps one
     continuous take instead of restarting it three times. Balatro ships five "themes"
     that are one composition; this is the same idea, and it must not stutter. */
  const el={}, dead={}, introDone={};   /* dead[file]=true once that file has failed for good */
  let curKey=null, ticker=null, armed=false, introFile=null;

  const audible=()=>AU.on&&!(typeof META!=='undefined'&&META.mute);
  function target(file){
    const cur=TRACKS[curKey];
    return (cur&&liveFile(curKey)===file&&audible())?Math.max(0,Math.min(1,AU.mvol*cur.w)):0;
  }

  function mk(file,doLoop){
    if(!file||dead[file]) return null;
    if(el[file]) return el[file];
    /* build.py injects AUDIO_MANIFEST from what is actually in assets/audio. Asking for
       a file that never shipped would 404, and the browser logs that itself — which
       fails verify.mjs A11 ("no console error"). So a missing file is dead on arrival,
       with no request at all. Drop the file in, rebuild, and it wakes up by itself. */
    if(typeof AUDIO_MANIFEST!=='undefined'&&AUDIO_MANIFEST.indexOf(file)<0){ dead[file]=true; return null; }
    let a;
    try{ a=new Audio(DIR+file); }catch(e){ dead[file]=true; return null; }
    a.loop=!!doLoop; a.preload='auto'; a.volume=0;
    /* Any failure to obtain audio is final and silent — see property 2 above. */
    a.addEventListener('error',()=>{ dead[file]=true; try{ a.pause(); }catch(e){} });
    if(!doLoop) a.addEventListener('ended',()=>{ introFile=null; kick(curKey); pump(); });
    el[file]=a; return a;
  }
  /* Which file should be sounding right now: the intro while it is still running,
     otherwise the looping body. */
  function liveFile(key){
    const t=TRACKS[key]; if(!t) return null;
    return (introFile&&introFile===t.intro)?t.intro:t.file;
  }
  function make(key){
    const t=TRACKS[key]; if(!t) return null;
    if(t.intro&&!introDone[t.file]&&!dead[t.intro]){
      const iv=mk(t.intro,false);
      if(iv){ introDone[t.file]=true; introFile=t.intro; mk(t.file,true); return iv; }
    }
    return mk(t.file,true);
  }

  function tick(){
    let moving=false;
    for(const f in el){
      const a=el[f], want=target(f);
      /* Self-healing watchdog: anything that should be sounding but is paused gets
         restarted here. The bug this closes was reachable — muting during the intro
         paused it and nothing ever resumed it — but the point is that the ticker
         already runs every 50ms while faders move, so making it responsible for
         "audible implies playing" means no future state bug can leave the game
         permanently silent. Cheap: a.play() on an already-playing element is a no-op. */
      if(want>0&&a.paused){ const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
      const d=want-a.volume;
      if(Math.abs(d)<0.0005){
        a.volume=want;
        /* Park a fully faded-out track so it stops decoding in the background. */
        if(want===0&&!a.paused){ try{ a.pause(); }catch(e){} }
        continue;
      }
      moving=true;
      /* Clamp the step to the remaining distance. A fixed step of TICK_MS/FADE_MS
         (0.0556) cannot land on an arbitrary target like AU.mvol 0.55: it overshot to
         0.5556, stepped back to 0.5, and oscillated at 20Hz forever — an audible
         wobble, and a setInterval that never cleared because `moving` never went
         false. Measured on production before this fix. */
      const stepSz=TICK_MS/FADE_MS;
      a.volume=Math.max(0,Math.min(1,a.volume+(Math.abs(d)<stepSz?d:(d>0?stepSz:-stepSz))));
    }
    if(!moving&&ticker){ clearInterval(ticker); ticker=null; }
  }
  function pump(){ if(!ticker) ticker=setInterval(tick,TICK_MS); tick(); }

  /* play() is a promise that REJECTS when autoplay is blocked. Swallow it: the
     next real click calls arm() again through ac(), which is when it succeeds. */
  function kick(key){
    if(!key) return;
    make(key);                      /* ensure the elements exist and the intro decision is made */
    /* Resume whatever is LIVE, not whatever make() happened to return. make() reports
       the loop once the intro has been started, so keying off it meant that muting
       during the 12s intro killed the music for good: tick() paused the intro, unmute
       then tried to play the loop, liveFile() still said the intro, so the loop was
       held at volume 0 and the intro was never resumed. Silent forever, and `ended`
       could not fire to hand over because the intro was paused. Verified on
       production before this fix. */
    const f=liveFile(key); if(!f) return;
    const a=el[f]; if(!a) return;
    if(a.paused&&audible()&&AU.mvol>0){
      const p=a.play();
      if(p&&p.catch) p.catch(()=>{});
    }
  }

  function switchTo(key){
    if(!TRACKS[key]||dead[TRACKS[key].file]||key===curKey) return;
    curKey=key;
    if(armed) kick(key);
    pump();
  }
  /* Called from ac(), i.e. from inside the first real user gesture, which is the
     only moment a browser will let audio begin. Idempotent on purpose. */
  function arm(){
    if(armed) return; armed=true;
    if(curKey) kick(curKey);
    pump();
  }
  function refresh(){ if(curKey&&audible()) kick(curKey); pump(); }
  function stop(){ for(const k in el){ try{ el[k].pause(); }catch(e){} } curKey=null; pump(); }

  /* render() calls this on every screen change, so it must stay cheap and must
     never throw. It only picks a mood; the ticker does the fading. */
  function sync(){
    try{
      let key='menu';
      if((screen==='combat'||screen==='tutorial')&&S){
        if(S.phase==='won'||S.phase==='lost') key='menu';
        else if(S.kind==='boss') key='boss';
        else key='combat';
      }
      switchTo(key);
    }catch(e){ /* music must never break a render */ }
  }
  /* available() lets a settings screen hide the slider when no audio shipped. */
  const available=()=>Object.keys(TRACKS).some(k=>!dead[TRACKS[k].file]);
  return {arm,sync,refresh,stop,available};
})();

const IC_CACHE={};
function icoSvg(name,col){
  if(ICON_PNG_ART[name]){
    const key='png|'+name;
    if(IC_CACHE[key]) return IC_CACHE[key];
    const out=`<svg class="ico" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><image href="${ICON_PNG_ART[name]}" width="128" height="128"/></svg>`;
    IC_CACHE[key]=out; return out;
  }
  if(ICON_SVG_RAW[name]){
    const key='vec|'+name;
    if(IC_CACHE[key]) return IC_CACHE[key];
    const out=`<svg class="ico" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">${ICON_SVG_RAW[name]}</svg>`;
    IC_CACHE[key]=out; return out;
  }
  const g=IC_G[name]; if(!g) return '';
  const key=name+'|'+(col||'');
  if(IC_CACHE[key]) return IC_CACHE[key];
  const c=col||IC_COL[name]||'#fff';
  let r='';
  for(let y=0;y<g.length;y++){
    let x=0; const row=g[y];
    while(x<row.length){
      if(row[x]==='#'){ let w=0; while(x+w<row.length&&row[x+w]==='#')w++;
        r+=`<rect x="${x}" y="${y}" width="${w}" height="1"/>`; x+=w; }
      else x++;
    }
  }
  const out=`<svg class="ico" viewBox="0 0 8 8" fill="${c}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
  IC_CACHE[key]=out; return out;
}
function ico(name,cls,col){
  const s=el('span','icow '+(cls||'')); s.innerHTML=icoSvg(name,col); return s;
}

/* ─────────── log.js ─────────── */
/* ============ COMBAT LOG (T15) ============
   design/ux/combat-log.md — second, display-only consumer of the same
   engine event stream fx.js plays back (S.ev / EV()). This module never
   mutates S and never touches engine.js; it only compiles already-emitted
   events into short, human-readable lines and renders them into a panel
   that lives outside the #app tree (so ui.js's full-teardown render()
   never unmounts it — see clogInit()).

   Compiled-line mapping: design/ux/combat-log.md §Detailed Rules —
   Information Architecture. Any deviation from that table is called out
   in a comment at the point of the deviation. */

const CLOG_KEY='axiedice_logopen_v1';
let clogOpen=false;
let clogEntries=[];          /* newest-first compiled entries */
/* Run-scoped accumulator (Match History — design/gdd unwritten as of this
   change, see ui.js saveRunHistory()). Unlike clogEntries (wiped every
   clogReset(), i.e. every new wave — T15 "current combat only"), this holds
   the FULL run's compiled log across every wave.
   Entries pushed here are the SAME object references pushed into
   clogEntries, not snapshots: clogRefreshDom()/clogHandleFt()/clogHandle()
   keep mutating an entry's `.segs`/`.actor`/`.part`/`.tgt` in place as a
   `use` -> `hit`/`ft` -> ... sequence resolves. A snapshot taken at
   push-time (clogCreateEntry) would freeze mid-action — e.g. missing the
   part name on a still-provisional `eact` entry, or a later "(N blocked by
   Shield)" suffix appended after the fact. Sharing the reference means this
   accumulator always reflects each entry's FINAL state by the time a run
   ends and ui.js's onRunEnd() reads it — which is the only point that
   matters, since runLogEntries is never rendered live itself.
   The `.node` DOM reference these entries pick up (assigned in
   clogCreateEntry/clogRefreshDom) is stripped EXPLICITLY by ui.js's
   saveRunHistory() right before JSON.stringify — never rely on
   JSON.stringify to drop it implicitly (a DOM node's ancestor chain isn't
   even guaranteed to throw a clean circular-reference error). */
let runLogEntries=[];
/* Cap: a full 20-wave run generates comfortably under a thousand compiled
   lines in practice; 1500 mirrors the "generous vs. realistic, blocks
   unbounded growth" reasoning already used for MAX_ACTIONS in
   api/submit-run.js and the clogEntries.length>400 cap just below. Oldest
   entries are dropped first (FIFO, via shift()) so the TAIL of the run —
   what a player actually wants to relive, especially the final blow — is
   never the part that gets truncated. */
const RUN_LOG_CAP=1500;
/* Called from ui.js's startRun() — a NEW RUN boundary, not a new wave.
   Deliberately separate from clogReset() (which runs every wave and must
   keep leaving this accumulator untouched). */
function clogRunReset(){ runLogEntries=[]; }
let clogSeq=1;
let clogTurnNo=1;
let clogOpenEntry=null;      /* entry currently accumulating hit/ft segments */
let clogPendingShield=null;  /* {uid,seg} — last hit segment eligible for a "(N blocked by Shield)" suffix */
let clogFrozen=false;
let clogAtTop=true;
let clogUnseen=0;
let clogSRQueue=[];
let clogSRTimer=null;
let clogPanel=null, clogBody=null, clogSR=null, clogScrim=null, clogUnreadEl=null;

function clogLoadPref(){ try{ clogOpen=localStorage.getItem(CLOG_KEY)==='1'; }catch(e){} }
function clogSavePref(){ try{ localStorage.setItem(CLOG_KEY,clogOpen?'1':'0'); }catch(e){} }

/* ---------- lifecycle ---------- */
function clogReset(){
  clogEntries=[]; clogOpenEntry=null; clogPendingShield=null; clogFrozen=false;
  clogTurnNo=1; clogAtTop=true; clogUnseen=0; clogSRQueue=[];
  if(clogSRTimer){ clearTimeout(clogSRTimer); clogSRTimer=null; }
  if(clogSR) clogSR.textContent='';
  if(clogBody){ clogBody.innerHTML=''; clogBody.scrollTop=0; }
  /* clogFreeze() (defeat "Battle Report") force-opens the panel with
     persist:false, so the saved preference in localStorage is untouched —
     but nothing was reverting the in-memory clogOpen/body class back to it.
     Without this, one loss anywhere in the session left body.clog-open
     (and its fixed, click-catching .clog-panel) stuck on top of the
     bottombar for every combat afterward, silently eating clicks on
     END TURN. Re-sync to the real preference at the start of every new
     combat — matches the comment on clogFreeze() ("their next combat
     still opens/closes the way they set it"). */
  if(typeof clogLoadPref==='function') clogLoadPref();
  if(typeof clogApplyOpenClass==='function') clogApplyOpenClass();
  clogRenderUnread();
}
/* Defeat is the one case the log must survive into (design/ux/combat-log.md
   §Interaction: "Battle Report"). Freezing just means we stop compiling —
   nothing more will arrive from a combat that has already ended — and we
   force the panel open without touching the player's remembered preference
   (so their next combat still opens/closes the way they set it). */
function clogFreeze(){
  if(clogFrozen) return;
  clogCloseOpen();
  clogFrozen=true;
  clogSetOpen(true,false);
}

/* ---------- open/close panel ---------- */
function clogSetOpen(v,persist){
  clogOpen=!!v;
  if(persist!==false) clogSavePref();
  clogApplyOpenClass();
  if(clogOpen){ clogUnseen=0; clogRenderUnread(); }
}
function clogApplyOpenClass(){
  document.body.classList.toggle('clog-open',clogOpen);
}
function clogToggleBtn(){
  const b=btn('xs ghost'+(clogOpen?' on':''),'LOG',()=>{ SFX.ui(); clogSetOpen(!clogOpen); render(); });
  b.setAttribute('aria-pressed',clogOpen?'true':'false');
  b.title='Battle log — every action this combat, compiled (press L)';
  return b;
}

/* ---------- persistent DOM (created once; never unmounted by render()) ---------- */
function clogInit(){
  if(clogPanel) return;
  clogLoadPref();
  clogScrim=el('div','clog-scrim');
  clogScrim.onclick=()=>{ clogSetOpen(false); render(); };
  document.body.appendChild(clogScrim);

  /* .clog-panel is a fixed, viewport-bounded, overflow:hidden clipper — it
     never itself extends past the viewport edge. .clog-inner is what
     actually slides via transform. Sliding .clog-panel itself off-screen
     (translateX(100%) on a right:0;width:280px box) put its border box
     past the viewport edge, which some engines still count toward
     document.scrollWidth even though nothing is visible there — that
     regressed tools/verify.mjs's B2 (no-horizontal-overflow) check.
     Clipping at the outer, viewport-bounded box fixes it without changing
     the visual toggle mechanism (still opacity/transform, never unmounted). */
  clogPanel=el('div','clog-panel');
  const inner=el('div','clog-inner');
  const head=el('div','clog-head');
  head.appendChild(el('div','clog-title','BATTLE LOG'));
  head.appendChild(btn('xs ghost clog-close','CLOSE',()=>{ clogSetOpen(false); render(); }));
  inner.appendChild(head);

  const wrap=el('div','clog-bodywrap');
  clogUnreadEl=el('div','clog-unread');
  clogUnreadEl.onclick=()=>{ if(clogBody) clogBody.scrollTop=0; clogUnseen=0; clogAtTop=true; clogRenderUnread(); };
  wrap.appendChild(clogUnreadEl);

  clogBody=el('div','clog-body');
  /* role=log gives assistive tech a navigable landmark; aria-live is
     deliberately "off" here — the throttled announcer below (clogSR) is the
     ONLY live-region channel, per the spec's explicit anti-flood rule. See
     the ambiguity note in the implementation report: the spec text also
     says the visible container itself should be aria-live="polite", which
     would reintroduce the exact per-event flood the spec spends a whole
     section warning against. Resolved in favour of the anti-flood rule. */
  clogBody.setAttribute('role','log');
  clogBody.setAttribute('aria-live','off');
  clogBody.setAttribute('aria-label','Combat log');
  clogBody.addEventListener('scroll',()=>{
    const wasTop=clogAtTop; clogAtTop=clogBody.scrollTop<=2;
    if(clogAtTop&&!wasTop){ clogUnseen=0; clogRenderUnread(); }
  },{passive:true});
  wrap.appendChild(clogBody);
  inner.appendChild(wrap);
  clogPanel.appendChild(inner);
  document.body.appendChild(clogPanel);

  clogSR=el('div','sr-only clog-sr');
  clogSR.setAttribute('aria-live','polite');
  clogSR.setAttribute('aria-atomic','true');
  document.body.appendChild(clogSR);

  clogApplyOpenClass();
}
function clogRenderUnread(){
  if(!clogUnreadEl) return;
  clogUnreadEl.classList.toggle('on',clogUnseen>0&&!clogAtTop);
  clogUnreadEl.textContent='• '+clogUnseen+' new ▲';
}

/* ---------- screen-reader channel: batched, throttled ~400ms, always polite ---------- */
function clogQueueSR(sentence){
  if(!sentence) return;
  clogSRQueue.push(sentence);
  clogPumpSR();
}
function clogPumpSR(){
  if(clogSRTimer) return;
  if(!clogSRQueue.length) return;
  const batch=clogSRQueue.splice(0,clogSRQueue.length);
  if(clogSR) clogSR.textContent=batch.join('. ')+'.';
  clogSRTimer=setTimeout(()=>{ clogSRTimer=null; clogPumpSR(); },400);
}

/* ---------- raw-text -> plain language (buf/deb float text) ---------- */
const CLOG_STATUS_WORD={THO:'Thorns',REG:'Regen',BUR:'Burn',BLI:'Blind',WEA:'Weaken',VUL:'Vulnerable'};
const CLOG_STATUS_EXACT={STUN:'Stunned',STUNNED:'Stunned — turn wasted',FREEZE:'Frozen next turn',
  FROZEN:'Frozen this turn',ENRAGE:'Enraged (+25% damage)',UNDYING:'Undying',OVERDRIVE:'Overdrive',
  SUMMON:'Summoned an ally'};
function clogStatusPhrase(txt){
  if(CLOG_STATUS_EXACT[txt]) return CLOG_STATUS_EXACT[txt];
  const m=/^([A-Z]{3})(\d+)$/.exec(txt);
  if(m&&CLOG_STATUS_WORD[m[1]]) return CLOG_STATUS_WORD[m[1]]+' +'+m[2];

const TUT_SEED=3, TUT_TEAM=['plant1','beast1','aqua1','reptile1','bird1'], TUT_ENEMY_HP=6;
function enterMenu(){

function startTutorial(){
  S=newGame(TUT_SEED,TUT_TEAM,{mode:'short'});
  chooseNode(S,0); // the only step-1 node is {type:'battle'} — starts combat, rolls turn 1
  // Fixed low HP (tuning knob, §4/§7) so the fight always ends within the
  // ≤3 turns the doc requires, regardless of which faces later free-play
  // turns happen to roll — never left to the naturally-generated encounter.
  S.enemies.forEach(e=>{ e.hp=TUT_ENEMY_HP; e.maxHp=TUT_ENEMY_HP; });

  tutStep=0; tutIntentSeen=false;

/* Which party member step 4 teaches is deliberately NOT fixed at fixture
   build time — REROLL (step 3) can reroll every die, including whichever
   one would have been taught, onto a completely different face type (e.g.
   a dmg face rerolling into a shield face, which targets allies instead of
   the enemy — this actually happened during t_tutorial.mjs authoring: a
   fixed tutDieUid/tutTargetUid pointed the "click this enemy" hint at a
   unit that could no longer legally be targeted). Recomputing this fresh
   every render, AFTER whatever reroll already happened, is what keeps the
   coached die/target pair always valid. Prefers a `dmg` face for the more
   illustrative "attack" framing, falling back to any actionable face in
   the rare case none survived the reroll. */
function tutActor(){
  const usable=u=>u.hp>0&&u.rolled>=0&&!u.used&&needsTarget(u);
  return S.party.find(u=>usable(u)&&u.die[u.rolled].t==='dmg') || S.party.find(usable) || null;
}
async function pullSyncAfterLogin(navigateOnDone){
  try{
    const r=await fetch('/api/sync-save',{headers:{'Authorization':'Bearer '+authToken}});
    if(r.status===401){ clearToken(); authToken=null; authUsername=null; screen='gate'; gateMsg='Session expired — please log in again.'; render(); return; }
    const data=await r.json();
    if(!data||typeof data!=='object'){ if(navigateOnDone) enterMenu(); render(); return; }
    const serverMeta=data.meta;
    const sameOwner=META.owner&&META.owner===authUsername;
    if(!serverMeta){
      // This account has never synced from any device yet.
      if(!sameOwner){ META={...DEF_META,owner:authUsername}; } else { META.owner=authUsername; }
      saveMeta();
      if(navigateOnDone) enterMenu(); render(); return;
    }
    if(!sameOwner){
      // Local data (if any) isn't this account's — never prompt, just adopt the cloud truth.
      META={...DEF_META,...serverMeta,owner:authUsername}; migrateMeta(); saveMeta();
      if(navigateOnDone) enterMenu(); render(); return;
    }
    const localSavedAt=META.savedAt||0, serverSavedAt=serverMeta.savedAt||0;
    if(localSavedAt>serverSavedAt){
      acctConflict={server:serverMeta}; screen='account'; render(); return;
    }
    META={...DEF_META,...serverMeta,owner:authUsername}; migrateMeta(); saveMeta();
    if(navigateOnDone) enterMenu(); render();
  }catch(e){ if(navigateOnDone) enterMenu(); render(); }
}
async function doAuth(action){
  if(acctState==='busy') return;
  const u=(acctUsername||'').trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(u)){ acctState='error'; acctMsg='Username must be 3-20 characters: a-z, 0-9, _ only.'; render(); return; }
  if((acctPassword||'').length<8){ acctState='error'; acctMsg='Password must be at least 8 characters.'; render(); return; }
  acctState='busy'; acctMsg=''; render();
  try{
    // Only offer local META as the new account's starting cloud save when this
    // device's local data is actually unclaimed (fresh device) or already this
    // same username's — never hand a brand-new account someone else's leftover
    // local progress just because they happen to share a device (see the
    // ownership comment on DEF_META/pullSyncAfterLogin above).
    const localIsForeign=action==='register'&&META.owner&&META.owner!==u;
    const body={action, username:u, password:acctPassword};
    if(action==='register') body.meta=localIsForeign?DEF_META:META;
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    if(!data.ok){ acctState='error'; acctMsg=data.error||'Something went wrong.'; render(); return; }
    authToken=data.token; saveToken(authToken); authUsername=data.username||u;
    acctPassword=''; acctState='idle';
    if(action==='register'){
      // Registration already uploaded the right starting META server-side
      // (see localIsForeign above) — mirror that choice locally, stamp
      // ownership, then let debounced sync take over from here.
      if(localIsForeign) META={...DEF_META};
      META.owner=authUsername; saveMeta(); enterMenu(); render(); return;
    }
    await pullSyncAfterLogin(true);
  }catch(e){ acctState='error'; acctMsg='Network error — could not reach the server. Try again.'; render(); }
}
function doLogout(){
  clearToken(); authToken=null; authUsername=null;
  if(syncPushTimer){ clearTimeout(syncPushTimer); syncPushTimer=null; }
  // Login is mandatory (GDD §3 Logout) — there's nowhere else for a logged-out
  // session to land but the gate. Local META is left untouched (not wiped).
  gateMsg=''; screen='gate'; render();
}
function resolveConflictKeepLocal(){ acctConflict=null; saveMeta(); enterMenu(); render(); }
function resolveConflictUseCloud(){ if(acctConflict) META={...DEF_META,...acctConflict.server}; acctConflict=null; saveMeta(); enterMenu(); render(); }
/* ---------- ECHO BOX (design/gdd/economy-progression.md §10.3, amended
   2026-09-02: Echo Forge -> Echo Box, deterministic point-buy -> gacha) ----------
   End-game Gene Shard sink, unlocked once the Collection Log (Faces + Relics +
   Bosses) is 100% complete. The tier meter/glow-border math (ECHO/echoTier/
   echoCost) is UNCHANGED from the original Echo Forge — only what a purchase
   GRANTS changed, from a deterministic point to a cosmetic gacha pull. See
   COSMETIC_POOLS/ECHO_BOX_* in cosmetics.js and scEchoBoxBody()/scProfile() below. */
function collectionComplete(){
  if(META.collectionGrandfathered) return true;   /* §7 E7 */
  return META.faces.length>=FACE_POOL.length && META.relics.length>=RELICS.length && META.bosses.length>=BOSSES.length;
}
function echoCost(n){ return Math.round(ECHO.base*Math.pow(ECHO.growth,n-1)); }
function echoTier(){ return Math.min(Math.floor((META.echoBoxesOpened||0)/ECHO.tierSize), ECHO_TIER_NAMES.length-1); }
/* Deterministic tier-title grant (NO randomness — same mechanic as before,
   just routed through the new ownership model): push into ownedTitles so it's
   never silently lost, and auto-equip it (matches the old "always show your
   newest unlock" behaviour). Also used by bpClaim() below for Battle Pass
   titles. */
function grantTitle(t){
  if(!t) return;
  if(!META.ownedTitles.includes(t)) META.ownedTitles.push(t);
  META.equipped.title=t;
}
function ownedArrFor(cat){
  return cat==='avatar'?META.ownedAvatars:cat==='decor'?META.ownedDecor:cat==='background'?META.ownedBackgrounds:META.ownedTitles;
}
/* Cumulative-weight rarity roll over ECHO_BOX_RARITY_ODDS (r0..r4). */
function rollEchoRarity(){
  let roll=Math.random(), acc=0;
  for(let r=0;r<ECHO_BOX_RARITY_ODDS.length;r++){ acc+=ECHO_BOX_RARITY_ODDS[r]; if(roll<acc) return r; }
  return ECHO_BOX_RARITY_ODDS.length-1;
}
/* Opens one Echo Box: (1) unchanged gate/cost/tier-title mechanic, (2) rolls
   a cosmetic reward by rarity then category, granting an unowned item in that
   exact rarity+category cell, or recording a duplicate toward fusion if the
   whole cell is already owned. Returns a result object for the caller to
   render (scEchoBoxBody()), or null if the purchase itself couldn't happen. */
function echoBoxOpen(){
  const opened=META.echoBoxesOpened||0;
  const cost=opened===0?ECHO.introCost:echoCost(opened+1);
  if(META.shards<cost) return null;
  const beforeTier=echoTier();
  META.shards-=cost; META.echoBoxesOpened=(META.echoBoxesOpened||0)+1;
  let tierTitle=null;
  if(echoTier()>beforeTier){ tierTitle=ECHO_TITLES[echoTier()]; grantTitle(tierTitle); }
  const rar=rollEchoRarity();
  const chest=chestGradeFor(rar);
  const cat=ECHO_BOX_CATEGORIES[Math.floor(Math.random()*ECHO_BOX_CATEGORIES.length)];
  const pool=COSMETIC_POOLS[cat], owned=ownedArrFor(cat);
  const candidates=Object.keys(pool).filter(k=>pool[k].rar===rar && !owned.includes(k));
  let result;
  if(candidates.length){
    const key=candidates[Math.floor(Math.random()*candidates.length)];
    owned.push(key);
    result={dup:false,cat,rar,key,n:pool[key].n,tierTitle,chest};
  } else {
    META.dupeCounts[rar]=(META.dupeCounts[rar]||0)+1;
    result={dup:true,cat,rar,dupeCount:META.dupeCounts[rar],tierTitle,chest};
  }
  saveMeta();
  return result;
}
/* Fusion (economy-progression.md §10.3 amendment): ECHO_FUSE_COST duplicate
   rolls of the same rarity (any category) fuse into 1 guaranteed-new item one
   rarity tier up. Mythic (r4) duplicates have nowhere higher to go and refund
   Shard instead; if the entire next tier (and every tier above it, up to
   mythic) is already 100% owned, cascade upward and fall back to the same
   refund rather than getting stuck with an unspendable fusion. */
function fuseCosmetics(rarity){
  if(((META.dupeCounts&&META.dupeCounts[rarity])||0)<ECHO_FUSE_COST) return null;
  META.dupeCounts[rarity]-=ECHO_FUSE_COST;
  if(rarity>=4){ META.shards+=ECHO_FUSE_MYTHIC_REFUND; saveMeta(); return {refund:true,shards:ECHO_FUSE_MYTHIC_REFUND}; }
  let targetRar=rarity+1, granted=null;
  while(targetRar<=4 && !granted){
    for(const cat of ECHO_BOX_CATEGORIES){
      const pool=COSMETIC_POOLS[cat], owned=ownedArrFor(cat);
      const candidates=Object.keys(pool).filter(k=>pool[k].rar===targetRar && !owned.includes(k));
      if(candidates.length){
        const key=candidates[Math.floor(Math.random()*candidates.length)];
        owned.push(key);
        granted={cat,rar:targetRar,key,n:pool[key].n};
        break;
      }
    }
    if(!granted) targetRar++;
  }
  if(!granted){ META.shards+=ECHO_FUSE_MYTHIC_REFUND; saveMeta(); return {refund:true,shards:ECHO_FUSE_MYTHIC_REFUND}; }
  saveMeta();
  return granted;
}
/* ---------- IMPORT AXIE VAULT (design/AUDIT_AND_SPEC_v1.md §G3① / §G5) ----------
   Vault lưu die suy ra từ Axie NFT thật (axieToDie, engine.js). Giới hạn 20 slot (localStorage) —
   nếu đầy, TỪ CHỐI import mới kèm thông báo rõ ràng thay vì âm thầm cắt bớt (LRU/silent-trim).
   Import lại cùng axieId (VD: đã đổi part ngoài đời rồi quét lại) → CẬP NHẬT bản ghi cũ, không tạo bản sao. */
const VAULT_MAX=20;
/* design/gdd/part-skill-identity.md §5 E13 — Vault schema version.
   Bản ghi vault là die ĐÃ RESOLVE, đóng băng lúc import. Khi luật resolve đổi (v1 tra
   SLOT_CLASS_TEMPLATE 36 ô → chỉ 19 mặt engine-distinct; v2 tra bảng part-identity 285 mặt),
   mọi bản ghi cũ vẫn giữ mặt CŨ. Không có migration thì hệ mới VÔ HÌNH với mọi người chơi đã
   import — họ không có cách nào biết die của mình đã lạc hậu.
   Migration là RE-SCAN, không phải chuyển đổi tại chỗ: die v1 không lưu `parts` nên không thể
   dựng lại; phải gọi lại API. Bản ghi stale hiện badge RE-SCAN và bị team-select TỪ CHỐI. */
const VAULT_SCHEMA=2;
function vaultStale(v){ return !v||(v.schema|0)<VAULT_SCHEMA; }
function importAxieToVault(axieData){
  if(!axieData||axieData.id==null) return {ok:false,err:'invalid_axie_data'};
  const die=axieToDie(axieData);
  die.schema=VAULT_SCHEMA;
  /* giữ manifest part đã verify cạnh die đã resolve — cần cho re-derive (geneTier) và cho
     server dựng lại die khi replay (§3.9e bước 4). */
  die.parts=((axieData.parts)||[]).map(p=>({id:p.id,name:p.name,class:p.class,type:p.type,specialGenes:p.specialGenes==null?null:p.specialGenes}));
  const idx=META.vault.findIndex(v=>v.axieId===die.axieId);
  if(idx>=0){ META.vault[idx]=die; saveMeta(); return {ok:true,updated:true,die}; }
  if(META.vault.length>=VAULT_MAX) return {ok:false,err:'vault_full',max:VAULT_MAX};

}
function removeFromVault(axieId){
  if(!META.vault) return;
  META.vault=META.vault.filter(v=>v.axieId!==axieId);
  delete HEROES['vault_'+axieId];
  saveMeta();
}
/* Bridge: engine.js resolves roster members via HEROES[re.key] everywhere
   (buildUnit, ascend/gene rewards, passives). Vault entries are already
   shaped like a HEROES record (n/cls/tier/hp/art/die — see axieToDie), so
   registering them under a stable synthetic key lets a vault Axie be picked
   into teamPick and played exactly like a T1 hero, with zero engine changes.
   Idempotent — safe to call on every render. */
function vaultKey(v){ return 'vault_'+v.axieId; }
function ensureVaultHero(v){
  const key=vaultKey(v);
  if(!HEROES[key]) HEROES[key]=v;
  return key;
}
/* Bug report 2026-09-16 — "wave clear doesn't advance": CONTINUE RUN resumes
   straight into screen='combat' (S=saved.s; render()) and never visits
   scTeam()/scVaultHub()/scCollection(), the only places that call
   ensureVaultHero() above. Mid-combat rendering never notices — S.party is
   already-built live units, buildUnit() is never re-run on them — but
   partyStrip() (scReward(), also read by scEnd()/history) rebuilds every
   S.roster member fresh via buildUnit(e,S), which does HEROES[re.key].hp.
   For a roster member that's an imported Vault Axie, re.key is 'vault_<id>'
   and HEROES[re.key] was never registered in THIS page load — buildUnit()
   throws (uncaught, no visible error banner), scReward() never finishes
   building its DOM, and the reward screen simply never appears: S.phase had
   already correctly flipped to 'reward', so the run looks permanently stuck
   on the combat board with 0 HP enemies, and reloading resumes the same
   saved state and hits the exact same crash again. Re-derives the key ->
   vault-record mapping ensureVaultHero() itself never stores, so it must
   search META.vault by axieId — cheap (run-length roster, not the full
   vault) and safe to call every render (same idempotence contract above). */
function ensureRosterVaultHeroes(){
  if(!S||!S.roster) return;
  for(const re of S.roster){
    if(re.key&&re.key.startsWith('vault_')&&!HEROES[re.key]){
      const axieId=re.key.slice(6);
      const v=(META.vault||[]).find(x=>vaultKey(x)===re.key||String(x.axieId)===axieId);
      if(v) ensureVaultHero(v);
    }
  }
}

function saveRun(){

  // scCombat()/scReward() unmodified, which means every existing action

function bpLevel(){ let lv=0,need=0; for(let i=1;i<=30;i++){ need+=BP_XP(i); if(META.xp>=need) lv=i; else break; } return lv; }

function bpUnclaimed(){ const lv=bpLevel(); return BP.filter(b=>b.lv<=lv&&!META.bpClaimed.includes(b.lv)); }

const MON_SPR={slime:['plant',2],chomper:['beast',1],spikelet:['reptile',2],bugling:['bug',0],jellyfin:['aqua',4],
  ravenling:['bird',5],thornback:['reptile',5],venomaw:['bug',4],bruiser:['beast',7],hexeye:['bug',7],
  cleaver:['beast',4],warden:['plant',7],stalker:['bird',3],pyrewing:['bird',7],broodmaw:['bug',5],
  bomblet:['aqua',7],totem:['plant',4],egg:['aqua',1],
  e_ravager:['beast',8],e_plague:['bug',8],e_bulwark:['plant',8],e_archon:['aqua',8],
  gooey_king:['plant',5],mecha:['reptile',8],frost_lord:['aqua',5],plague_mother:['bug',6],mirror:['reptile',4],agony:['bird',8]};
const sprOf=(cls,i)=>(AXIE_PIX[cls]&&AXIE_PIX[cls][((i%9)+9)%9])?AXIE_PIX[cls][((i%9)+9)%9].src:'';
/* Field-monster real art (§3b of the art-adoption plan) — bucket MON_SPR's
   existing [class, artIdx] tuple exactly like a Hero's own tier (0-2 ->
   normal, 3-5/6-8 -> awaken), then reuse the SAME house-art portrait a Hero
   of that class/tier already shows. Classes with only a Normal portrait
   (Bug/Bird - see art2.js) fall through to it for every bucket, same as
   Hero tier2/3 already does. Returns '' (falsy) if the class has no house
   art at all yet, so callers keep falling back to the pixel sprite. */
const monArt2=(cls,i)=>{
  if(typeof HOUSE_ART==='undefined') return '';
  const bucket=Math.floor((((i%9)+9)%9)/3);
  const key=cls+'_'+(bucket===0?'normal':'awaken');
  return HOUSE_ART[key]||HOUSE_ART[cls+'_normal']||'';
};
/* Real Axie art in combat/inspector views for a Vault (Import Axie) unit —
   buildUnit() carries the roster entry's `key` onto every built unit, and for
   a vault_<id> key that's exactly the HEROES[key] record axieToDie() made
   (see importAxieToVault/ensureVaultHero), image and all. Standard heroes'
   HEROES entries never have `.image`, so this is a no-op fallback for them —
   safe to call for any player unit, not just vault ones.

   "ID card" framing (art-director consult, 2026-09-03): mixing the painterly
   real-Axie PNG with the house pixel-sprite style in the same plain <img>
   slot read as broken/placeholder art, not an intentional distinction — real
   art visually outranks the sprites for salience it hadn't earned. Fix is a
   deliberate frame (gold border/glow + small badge), never a filter trying
   to make the two styles blend — see design/quick-specs/ if this needs a
   full writeup later. realArtWrap() applies this ONLY when real art is
   actually showing; the badge/frame both vanish automatically via the
   image's own onerror if that URL 404s and it falls back to the sprite. */
function realArtWrap(realSrc,fallbackSrc,imgClass){
  const wrap=el('div','axie-id'+(realSrc?' real':''));
  const im=el('img',imgClass||''); im.src=realSrc||fallbackSrc;
  wrap.appendChild(im);
  if(realSrc){
    const badge=el('div','axie-id-badge','⛓'); badge.title='Real Axie NFT art';
    wrap.appendChild(badge);
    im.onerror=()=>{ im.onerror=null; im.src=fallbackSrc; wrap.classList.remove('real'); badge.remove(); };
  }
  return wrap;
}
/* House art (real Axie art, official — NOT a player-owned NFT): same "don't
   blend two incompatible renderings in one unmarked slot" fix as
   realArtWrap(), but deliberately WITHOUT the "⛓ Real Axie NFT art" badge —
   applying that badge here would be a false ownership claim (design/quick-
   specs/real-art-adoption-plan-2026-09-07.md §1). Frame colour follows the
   unit's class (CLASS_COLOR) rather than a fixed gold, since the portrait's
   own painted colours (e.g. Machito's purple) are not required to match the
   class palette — see the "Color-identity note" in the same doc. */
function houseArtWrap(realSrc,fallbackSrc,imgClass,clsColor){
  const wrap=el('div','house-art'+(realSrc?' real':''));
  if(clsColor) wrap.style.setProperty('--hc',clsColor);
  const im=el('img',imgClass||''); im.src=realSrc||fallbackSrc;
  wrap.appendChild(im);
  if(realSrc) im.onerror=()=>{ im.onerror=null; im.src=fallbackSrc; wrap.classList.remove('real'); };
  return wrap;
}
function unitArtImg(u,cls){
  const h=u.key&&HEROES[u.key];
  if(h&&h.image) return realArtWrap(h.image,sprOf(u.cls,u.artIdx),cls||'spr');
  if(h&&h.art2) return houseArtWrap(HOUSE_ART[h.art2],sprOf(u.cls,u.artIdx),cls||'spr',CLASS_COLOR[u.cls]);
  return realArtWrap(null,sprOf(u.cls,u.artIdx),cls||'spr');
}
/* Same real-art-first logic as unitArtImg(), for every place that only has
   a plain {cls,tier} pair instead of a live roster entry with `.key` —
   History/Leaderboard entries (teamRelicsSec(), scHistoryBody()'s own team-
   portraits row) are flat saved/replayed snapshots with no `key` field, and
   Sample Teams/the Team-Select T1 cards work from HEROES directly but were
   still calling sprOf() straight, never picking up Hero art at all. Since
   each class carries exactly one character across all 3 tiers (real-art-
   adoption-plan-2026-09-07.md §2), the key is always deterministically
   cls+tier — this is the ONE missing piece that let all of these silently
   keep rendering the old pixel sprite after unitArtImg() shipped everywhere
   else. */
function heroArtWrap(cls,tier,artIdx,imgClass){
  const h=HEROES[cls+tier];
  const fallback=sprOf(cls,artIdx);
  if(h&&h.art2) return houseArtWrap(HOUSE_ART[h.art2],fallback,imgClass||'spr',CLASS_COLOR[cls]);
  return realArtWrap(null,fallback,imgClass||'spr');
}
/* Boss reveal art (real Chimera card-art, §3a of the art-adoption plan) —
   `phase` picks Nightmare Agony's die2 transformation art (BOSS_ART.agony2)
   when the fight has flipped to its second phase. Field monsters (regular +
   elite, `MON_ART` — docs/art/chimera-monster-art-mapping-2026-09-08.md,
   distinct Chimera art per key, NOT a reused Hero portrait) are checked next;
   only a key with neither falls through to `monArt2()`'s Hero-reskin or the
   pixel-sprite fallback. MON_ART is deliberately NOT routed through
   realArtWrap()/the "Real Axie NFT art" badge anywhere in this file — these
   are non-owned field monsters, not player-owned Vault Axies. */
const sprMon=(k,phase)=>{
  const bk=(k==='agony'&&phase===2)?'agony2':k;
  if(typeof BOSS_ART!=='undefined'&&BOSS_ART[bk]) return BOSS_ART[bk];
  if(typeof MON_ART!=='undefined'&&MON_ART[k]) return MON_ART[k];
  const m=MON_SPR[k]||['beast',0];
  return monArt2(m[0],m[1])||sprOf(m[0],m[1]);
};
/* True when sprMon(k,phase) is about to return real art (BOSS_ART, MON_ART,
   or monArt2()), not the pixel-sprite fallback — every `el('img','spr mut')`
   call site needs this to add the `.real` class so the enemy-tint filter
   (see `.unit .spr.mut` in style.css) can be skipped for real art. Without
   it, that filter (grayscale+sepia+hue-rotate, tuned to recolor a flat
   pixel silhouette a uniform blood-red) was flattening every boss's real,
   individually-painted Chimera card art into the exact same red silhouette
   — the actual reason swapped-in boss art kept reading as "still not
   changed" despite the source image being correct all along. */
function sprMonIsReal(k,phase){
  const bk=(k==='agony'&&phase===2)?'agony2':k;
  if(typeof BOSS_ART!=='undefined'&&BOSS_ART[bk]) return true;
  if(typeof MON_ART!=='undefined'&&MON_ART[k]) return true;
  const m=MON_SPR[k]||['beast',0];
  return !!monArt2(m[0],m[1]);
}


const PARTN={mouth:'MOUTH',horn:'HORN',back:'BACK',tail:'TAIL',eyes:'EYES',ears:'EARS',blank:'',m:''};

function shake(n){ const a=$('#app'); if(!a) return; a.classList.remove('shk1','shk2','shk3');
  void a.offsetWidth; a.classList.add('shk'+Math.min(3,Math.max(1,n||1)));

/* Photosensitivity: honour both the in-game "REDUCE FLASH EFFECTS" setting and
   the OS-level prefers-reduced-motion query. Neither removes the feedback
   entirely (crit/Mythic still needs *some* signal) — instead flashScreen loses
   its full-viewport radial burst and becomes a thin top-edge accent bar at a
   quarter of the opacity, and hitstop's brightness/contrast punch is cut down
   to a barely-there version instead of being skipped outright. */
const prefersReducedMotion=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
const wantsLessFlash=()=>META.reduceFlash||prefersReducedMotion();
function flashScreen(cls){ const f=el('div','flashfx '+(cls||'')+(wantsLessFlash()?' low':'')); document.body.appendChild(f); setTimeout(()=>f.remove(),300/SPD); }
function hitstop(ms){ const a=$('#app'); if(!a) return; a.classList.add(wantsLessFlash()?'hstop-lite':'hstop'); setTimeout(()=>a.classList.remove('hstop','hstop-lite'),(ms||90)/SPD); }
function bigText(t,cls){ const d=el('div','bigfx '+(cls||''),t); document.body.appendChild(d); setTimeout(()=>d.remove(),1100/SPD); }

function collectFloats(){ pendFloats=pendFloats.concat(S.floatText); S.floatText=[]; }

/* ================= DICE ROLL ANIMATION ================= */
function triggerRollAnim(uids){
  rollAnim={uids:uids||S.party.filter(u=>u.hp>0&&u.rolled>=0).map(u=>u.uid),t0:performance.now()};
  SFX.tray();
}
function runRollAnim(){
  if(!rollAnim) return;
  const DUR=430/SPD, STAG=70/SPD;
  const boxes={}; $$('.diebox').forEach(b=>boxes[b.dataset.uid]=b);
  const order=rollAnim.uids.slice();
  const landed={};
  const step=()=>{
    if(!rollAnim) return;
    try{
    const now=performance.now(); let done=true;
    order.forEach((uid,i)=>{
      const b=boxes[uid]; if(!b) return;
      const u=byUid(S,uid); if(!u||u.rolled<0) return;
      const t=now-rollAnim.t0-i*STAG;
      const d=b.querySelector('.die'); if(!d) return;
      if(t<0){ d.classList.add('tumble'); b.classList.add('rolling'); done=false; return; }
      if(t<DUR){
        done=false; d.classList.add('tumble'); b.classList.add('rolling');
        const iv=Math.max(34,34+ (t/DUR)*90);
        const k=Math.floor(t/iv)%6;
        if(d.dataset.tf!=String(k)){ d.dataset.tf=String(k); paintDieFace(d,u,k,true); SFX.tumble(i); }
      } else if(!landed[uid]){
        landed[uid]=1; d.classList.remove('tumble'); b.classList.remove('rolling'); d.classList.add('landed');
        paintDieFace(d,u,u.rolled,false);
        const f=u.die[u.rolled]||u.die[0];
        if(hasKw(f,'heavy')) SFX.heavy(); else SFX.land(i,f.r);
        if(f.r>=4){ SFX.mythic(); hitstop(140); flashScreen('myth'); bigText('MYTHIC',''); }
        else if(f.r>=3){ SFX.legend(); flashScreen('gold'); }
        if(u.critNow){ d.classList.add('critready'); }
        setTimeout(()=>d.classList.remove('landed'),320/SPD);
      }
    });
    if(done){ rollAnim=null; render(); } else requestAnimationFrame(step);
    }catch(err){
      /* Never let a bad frame freeze the tray: without this the dice stay
         locked because clickDie() refuses input while rollAnim is set. */
      console.error('roll animation error',err);
      rollAnim=null; try{ render(); }catch(e){}
    }
  };
  requestAnimationFrame(step);
}
// Battle UI handoff (2026-09-10, product owner's own design pass) §5 —
// "an 11px plain-language caption under the value translating the icon+
// number" (e.g. "Blocks 3 damage") — the fix for players not understanding
// icon meaning without hovering. Falls back to kwText() (already used
// throughout this file) for any keyword without a hand-written sentence,
// so nothing is ever left silently unexplained.
function faceCaption(f,v){
  if(f.t==='blank') return 'No effect — try rerolling';
  if(f.t==='dmg'){
    let s='Deals '+v+' damage';
    if(hasKw(f,'aoe')) s+=' to all enemies';
    else if(hasKw(f,'cleave')) s+=', hits 2 targets';
    if(hasKw(f,'pierce')) s+=', ignores Shield';
    if(hasKw(f,'exec')) s+=', more vs. low HP';
    const m=kwVal(f,'multi'); if(m) s+=' x'+m+' hits';
    const ch=kwVal(f,'chain'); if(ch) s+=', chains to '+ch+' more';
    return s;
  }
  if(f.t==='shield') return 'Blocks '+v+' damage'+(hasKw(f,'aoe')?' for the whole team':'');
  if(f.t==='heal') return 'Heals '+v+' HP'+(hasKw(f,'aoe')?' for the whole team':'');
  if(f.t==='poison') return 'Poisons for '+v+' damage/turn';
  if(f.t==='mana') return 'Generates '+v+' Mana';
  if(f.t==='summon') return 'Summons a Nest token';
  if(f.t==='buff'||f.t==='debuff'){
    const parts=[];
    for(const k of f.k){
      if(k==='aoe'||k==='cantrip') continue;
      const [name,mag]=k.split(':'); const n=mag?parseInt(mag,10):0;
      if(name==='blind') parts.push('Blinds enemy'+(n?' '+n+' turns':'')+' (lower hit chance)');
      else if(name==='vulnerable') parts.push('Vulnerable'+(n?' '+n:'')+' (takes more damage)');
      else if(name==='weaken') parts.push('Cuts enemy attack by '+(n||v));
      else if(name==='freeze') parts.push('Freezes (cannot reroll)'+(n?' '+n+' turns':''));
      else if(name==='stun') parts.push('Stuns (skips next turn)');
      else if(name==='thorns') parts.push('Reflects '+(n||v)+' damage back');
      else if(name==='regen') parts.push('Regenerates '+(n||v)+' HP/turn');
      else if(name==='undying') parts.push("Can't drop below 1 HP");
      else if(name==='burn') parts.push('Burns for '+(n||v)+' damage/turn');
      else parts.push(kwText(k));
    }
    return parts.length?parts.join(', '):'Applies an effect';
  }
  return '';
}
/* Battle UI redesign (2026-09-16) — repaints the parts of the die block that
   depend on WHICH face is showing (part label, effect icon/value/caption,
   six-face strip), leaving the parts partyCard() built once alone: the
   reroll button in .diehd, and the .diestate footer (state is a property of
   the Axie/turn, not of the face). This is also called every ~34-90ms
   during the roll tumble (runRollAnim(), temp=true) so it must NOT rebuild
   the whole card — only the frame-varying content. Rarity/heavy are no
   longer painted on the board at all (handoff §4: "belong in the inspect
   modal now" — scUnitInfo() already shows both per face). */
function paintDieFace(d,u,fi,temp){
  const f=u.die[fi]||u.die[0];
  d.className=d.className.replace(/t_\w+/g,'')+' t_'+f.t;
  const dp=d.querySelector('.diehd .dp'); if(dp) dp.textContent=f.name||PARTN[f.p]||'';
  const fx=d.querySelector('.diefx');
  if(fx){
    fx.innerHTML='';
    fx.appendChild(ico(FT_IC[f.t],'di'));
    const body=el('div','diefx-body');
    const v=temp?f.v:faceValue(S,u,fi);
    // "The label is dropped entirely when cardW ≤ 160 (swarm)" — d.dataset.showlabel
    // is set once by partyCard()/unitCard() from the actual cardW at creation
    // time (checking a live rect here would read 0 on the still-detached tree).
    const lbl=d.dataset.showlabel==='0'?null:DIE_LABEL[f.t];
    if(f.t==='blank'||v>0||f.t==='dmg'||lbl){
      const vl=el('div','diefx-vl');
      if(f.t!=='blank'&&(v>0||f.t==='dmg')){ const dv=el('div','dv',String(v));
        // 24px, not the handoff's literal 26px — this project's type scale is
        // a hard allow-list (tools/verify.mjs A1), and 24px is already on it
        // (the same value --die-num takes at the ≤899px breakpoint).
        if(d.dataset.smallval==='1') dv.style.fontSize='24px'; vl.appendChild(dv); }
      if(lbl) vl.appendChild(el('div','dvl',lbl));
      body.appendChild(vl);
    }
    fx.appendChild(body);
  }
  /* §3.3's raw keyword-tag list was tried, reversed once, then superseded
     2026-09-10 by a plain-language caption (faceCaption()) — sound at the
     time, because the board only ever showed ONE of {tags, caption} and the
     sentence already folded in every keyword a tag list would (aoe/multi/
     chain/pierce/exec for dmg, blind/vulnerable/weaken/freeze/stun/etc. for
     buff/debuff). The 2026-09-16 handoff (Battle-UI-A-Grid-v2 §4 band 3)
     changes that premise: the full caption now lives one click away in the
     inspect modal (scUnitInfo(), §7), so dropping it from the board loses
     nothing. faceCaption() itself stays — the modal still calls it — this
     is only the third reversal of where its text is shown, not a fourth
     function. One chip per `f.k` entry, `heavy` included (it used to be a
     separate `.ractag-hv` glyph — see the "Retired from the die card" note
     in §4). Reserves its 20px height even with zero keywords. */
  const kwt=d.querySelector('.kwtags');
  if(kwt){ kwt.innerHTML=''; f.k.forEach(k=>kwt.appendChild(el('span','kwtag',kwText(k).toUpperCase()))); }
  const faces=d.querySelector('.faces');
  if(faces) [...faces.children].forEach((cell,i)=>{
    cell.innerHTML=''; cell.style.background='';
    if(i===fi){ const ft=u.die[i].t; cell.style.background=FT_COLOR[ft]||'var(--dim)'; cell.appendChild(ico(FT_IC[ft])); }
  });
  const oldCrit=d.querySelector('.critbadge'); if(oldCrit) oldCrit.remove();
  if(!temp&&u.critNow&&fx) fx.appendChild(el('div','critbadge','CRIT x'+rcritMult()));
}
function rcritMult(){ let m=2; for(const id of S.relics){ const r=RELIC_BY_ID[id]; if(r&&r.critMult&&r.critMult>m)m=r.critMult; } return m; }

function render(){
  const root=$('#app'); if(!root) return;
  ensureRosterVaultHeroes();
  if(typeof MUS!=='undefined') MUS.sync();   /* every screen/phase change already lands here */
  if(typeof clogInit==='function'&&!clogPanel) clogInit();
  if(typeof clogFreeze==='function'&&S&&S.phase==='lost') clogFreeze();
  if(typeof clogSetOpen==='function'&&screen!=='combat'&&clogOpen) clogSetOpen(false,false);
  $$('.tutcoach-ov,.tutcoach-big,.tc-undo').forEach(n=>n.remove());
  // screen==='combat' covers the entire active run (map/event/shop/reward/
  // combat/win-lose all render under this value via the `else if(S){...}`
  // branch below) — the board is a fixed single-viewport during a run, so
  // the page itself must not scroll or rubber-band drag. Menu/list screens
  // (menu/unlocks/collection/vault/leaderboard/bp/codex/guide/team) never
  // get this class and keep scrolling normally. screen==='tutorial' reuses
  // the same combat board (design/gdd/onboarding-tutorial.md §3.5) so it
  // needs the same lock.
  document.body.classList.toggle('locked-scroll', screen==='combat'||screen==='tutorial');
  // Drifting glow layers (#bgLayer.bg-glow, style.css) are exclusive to the
  // title/gate screen — see the comment on that rule for why they (and the
  // whole background image) live on the #bgLayer sibling div, not on body
  // or .screen.menu.title.
  { const bgl=document.getElementById('bgLayer'); if(bgl) bgl.classList.toggle('bg-glow', screen==='menu'||screen==='gate'); }
  root.innerHTML=''; root.className='';
  // Mandatory login gate (design/gdd/player-accounts.md §3 "App gate") — checked
  // first, before any other screen dispatch, so there is no ordering accident
  // that could let a later branch render while screen==='gate'.
  if(screen==='gate') root.appendChild(scGate());
  else if(screen==='menu') root.appendChild(scMenu());
  else if(screen==='team') root.appendChild(scTeam());
  else if(screen==='unlocks'){ colOuter='unlocks'; screen='collection'; root.appendChild(scCollection()); }
  else if(screen==='collection') root.appendChild(scCollection());
  else if(screen==='echobox'){ colOuter='echobox'; screen='collection'; root.appendChild(scCollection()); }
  else if(screen==='profile') root.appendChild(scProfile());
  else if(screen==='vault') root.appendChild(scVaultHub());

// placeResLinks() (measured .reslink's midpoint via getBoundingClientRect()
// after every render) is deleted along with .reslink itself — the §4b
// resonance band is laid out by flow, inside each card's own die block, so
// it needs no post-render measurement pass. See the CSS comment above
// .resband for the two mistakes that approach made.
/* Shrink the board just enough that the dice tray, REROLL and END TURN are
   always on screen. Laptops with short windows used to push them below the
   fold, which made the game look unresponsive. Never scales above the user's
   own UI scale setting. */
/* T09 · the old autoFit could only ever shrink, so on a tall screen the board
   used ~64% of the height while the dice numbers stayed at 30px. fitUI scales
   both ways. Below 1200px the breakpoints (T10) already handle sizing, so we
   lock to 1 there — otherwise the two mechanisms multiply. */
const BOARD_W = 880;   /* 846px content + 34px headroom */
const BOARD_H = 985;   /* header + enemies + party + tray + bar + gaps —
  measured live (972px at --ui-scale:1, 5-unit party + msg banner), not a
  guess: the old value of 720 predated later additions (Formation Resonance
  links, the 5th party column) and silently let the board grow taller than
  fitUI's shrink math accounted for, pushing the dice tray/END TURN off the
  bottom on shorter windows. Re-measure with document.querySelector('.screen
  .combat').scrollHeight at --ui-scale:1 if combat's vertical content changes
  again — don't just bump this number blind. */
function fitUI(){
  // T20 · this scale is derived ENTIRELY from the combat board's own
  // measurements (BOARD_W/BOARD_H above) — postRender() calls this on every
  // render though, on every screen, so a wide+tall desktop window silently
  // zoomed the MENU (and every other non-combat screen) up to 1.20x too,
  // pushing content taller than the viewport and hiding SAMPLE TEAMS/
  // SETTINGS/LOGOUT below the fold (bug report 2026-09-16). Only combat (and
  // tutorial, which reuses the combat board — see the locked-scroll toggle
  // right above screen dispatch) should ever get a non-1 scale.
  if(screen!=='combat'&&screen!=='tutorial'){ document.documentElement.style.setProperty('--ui-scale','1'); return; }
  const raw = Math.min(innerWidth / BOARD_W, innerHeight / BOARD_H);
  const s = innerWidth >= 1200 ? Math.min(raw, 1.20) : 1;
  // Floor raised 0.85 -> 1.0: text must never be shrunk below its authored
  // size (--t1 is 11px, already the accessibility minimum — tools/verify.mjs
  // A4 also hardcodes 11px, so bumping the token itself isn't an option
  // either). The real, measured combat height (BOARD_H above) is taller than
  // a standard 900px-tall desktop viewport, so something has to give: below
  // this floor, the board scrolls (body is no longer overflow:hidden — see
  // the scroll-lock fix) instead of shrinking text past legibility. Only
  // scales UP (still capped at 1.20) on genuinely tall windows.
  // Consequence of that floor: on a short window this function can no longer
  // compensate at all (--ui-scale is pinned to 1 at 1280x720, 1366x768,
  // 1280x800 alike), which is exactly how END TURN ended up 48px below the
  // fold at 1280x720. The compensation now lives in CSS instead — see the
  // T10b short-window breakpoint in style.css, which shrinks COMPONENTS
  // (not text) and pins the action bar. Keep the two in mind together:
  // this function owns the tall-window case, T10b owns the short one.
  document.documentElement.style.setProperty('--ui-scale', Math.max(1.0, s).toFixed(3));
}

/* Profile identity costs (design/gdd/economy-progression.md tier calibration:
   150 matches the cheapest existing UNLOCKS shard cost, 200 sits one tier up
   to reflect image storage/sync weight — both stay well under the 400+ range
   reserved for power-adjacent unlocks, keeping this clearly cosmetic-tier).
   First use of each is free (META.freeNameUsed/freeAvatarUsed), tracked
   independently so using one doesn't silently spend the other's free use. */
const RENAME_COST=150, REAVATAR_COST=200;
const AVATAR_MAX_DIM=128, AVATAR_JPEG_Q=0.7, AVATAR_MAX_BYTES=40*1024;
function nameChangeCost(){ return META.freeNameUsed?RENAME_COST:0; }
function avatarChangeCost(){ return META.freeAvatarUsed?REAVATAR_COST:0; }
function applyDisplayName(name){
  const n=(name||'').trim().slice(0,24);
  if(!n) return false;
  const cost=nameChangeCost();
  if(cost>0){ if(META.shards<cost) return false; META.shards-=cost; }
  META.displayName=n; META.freeNameUsed=true; saveMeta(); return true;
}
function applyCustomAvatar(dataUrl){
  const cost=avatarChangeCost();
  if(cost>0){ if(META.shards<cost) return false; META.shards-=cost; }
  META.customAvatar=dataUrl; META.avatarSource='custom'; META.freeAvatarUsed=true; saveMeta(); return true;
}
/* Downscales/re-encodes an uploaded image client-side (center-cropped to a
   square) so a custom avatar can never meaningfully threaten the 512KB
   api/sync-save.js META budget — see AVATAR_MAX_DIM/AVATAR_JPEG_Q/
   AVATAR_MAX_BYTES above. Rejects non-images and anything that's still too
   big after compression rather than silently truncating it. */
function readAvatarFile(file, cb){
  if(!file||!/^image\//.test(file.type)){ cb(null,'Please choose an image file.'); return; }
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const side=Math.min(img.width,img.height);
    const sx=(img.width-side)/2, sy=(img.height-side)/2;
    const cv=document.createElement('canvas'); cv.width=AVATAR_MAX_DIM; cv.height=AVATAR_MAX_DIM;
    cv.getContext('2d').drawImage(img,sx,sy,side,side,0,0,AVATAR_MAX_DIM,AVATAR_MAX_DIM);
    const dataUrl=cv.toDataURL('image/jpeg',AVATAR_JPEG_Q);
    if(dataUrl.length>AVATAR_MAX_BYTES*1.4){ cb(null,'Image too complex to compress small enough — try a simpler picture.'); return; }
    cb(dataUrl,null);
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); cb(null,'Could not read that image.'); };
  img.src=url;
}

      const swatchable=has&&!thumbSrc&&item.style&&(cat==='decor'||cat==='background');
      const c=el('div','citem r'+item.rar+(has?'':' locked')+(isEq?' on':'')+(thumbSrc||swatchable?' has-thumb':''));
      if(has&&thumbSrc){ const t=el('img','citem-thumb'); t.src=thumbSrc; c.appendChild(t); c.appendChild(el('span',null,item.n)); }
      else if(swatchable){
        const sw=el('div',cat==='decor'?('citem-swatch-decor decor-'+item.style):('citem-swatch-bg '+item.style));
        c.appendChild(sw); c.appendChild(el('span',null,item.n));

        c.onclick=()=>{ META.equipped[cat]=k; if(cat==='avatar') META.avatarSource='gacha'; saveMeta(); render(); };

      g.appendChild(c);
    });

    // gacha one (see applyCustomAvatar()) — surface it as its own always-
    // owned tile so switching back is free, not a re-purchase.
    if(cat==='avatar'&&META.customAvatar){

  // pool (Echo Tier's ECHO_TITLES, Battle Pass's b.title rewards — both
  // granted via grantTitle(), see echoBoxOpen()/bpClaim()). Without this,

  // selectable chip, and the count would look broken (more owned than the

  // keyed by the title text itself (how ownedTitles stores them).
  const titlePool={...COSMETIC_TITLES};

  w.appendChild(mkSec('TITLES','title',titlePool));

  w.appendChild(mkSec('BACKGROUNDS','background',bgPool));
  w.appendChild(btn('','BACK',()=>{ screen='menu'; render(); }));
  return w;

/* Compact Vault chip accordion (ux-designer spec, 2026-09-03) — Set of
   expanded vault hero keys, same inline-expand pattern as historyExpanded/
   lbExpanded elsewhere in this file. Real art (v.image, from the Axie
   Infinity API via api/axie.js) falls back to the generated pixel sprite if
   missing/broken — vault entries imported before this field existed have
   image:null|undefined and just show the sprite, no re-import required. */
let vaultExpanded=new Set();
/* Vault entries imported before the `image` field existed (2026-09-03) have
   no v.image at all — rather than force a manual re-import for every old
   entry, lazily backfill it once per render pass: refetch just the id from
   the same api/axie proxy Import Axie already uses, cache the real art URL
   into the vault record, and re-render. Silent no-op on any failure (offline,
   API down, Axie no longer resolvable) — the sprite fallback already covers
   that, this is purely a nice-to-have upgrade, never blocking. */
let vaultArtFetching=new Set();
function ensureVaultArt(v){
  if(v.image||!v.axieId||vaultArtFetching.has(v.axieId)) return;
  vaultArtFetching.add(v.axieId);
  fetch('/api/axie?id='+encodeURIComponent(v.axieId)).then(r=>r.ok?r.json():null).then(data=>{
    if(data&&data.image){
      v.image=data.image;
      const idx=(META.vault||[]).findIndex(x=>x.axieId===v.axieId);
      if(idx>=0) META.vault[idx].image=data.image;
      saveMeta(); render();
    }
  }).catch(()=>{}).finally(()=>vaultArtFetching.delete(v.axieId));
}

    c.onclick=()=>{ if(!can)return; SFX.ui(); sel=null;
      if(r.act.tgt==='self'){ if(playerUseRelic(S,id,null)){ logAction('playerUseRelic',[id,null]); afterAct(); } else render(); }

    if(can) kbAct(c);
    actRow.appendChild(c);
  });
  if(!actRow.children.length) actRow.appendChild(el('div','nothing','No active relics'));
  bb.appendChild(actRow);

  // Battle UI handoff §6 — the "n relics equipped" popover is the full
  // equipped inventory (active + passive), a browsable reference distinct
  // from the quick-cast buttons above. Hover is pure CSS (:has(), see the
  // style block) so it never has to go through render(), which would
  // destroy the hovered row out from under the pointer mid-hover.
  const relicWrap=el('div','relicwrap'+(relicsOpen?' open':''));

  rbtn.appendChild(el('span',null,S.relics.length+' relics equipped'));

  kbAct(rbtn);

  list.appendChild(el('div','relicpop-h','EQUIPPED'));

  S.relics.forEach((id,i)=>{ const r=RELIC_BY_ID[id]; if(!r) return;
    const row=el('div','relicpop-row');
    const sw=el('span','relicpop-sw'); sw.style.background='var(--r'+r.rar+')'; row.appendChild(sw);
    row.appendChild(el('span','rpn',r.n));
    row.appendChild(el('span','rpk',r.act?'active':'passive'));
    list.appendChild(row);
    const det=el('div','relicpop-detail'+(i===0?' primary':''));
    const dh=el('div','relicpop-dh');
    dh.appendChild(el('span','relicpop-dn',r.n)); dh.style.color='var(--r'+r.rar+')';
    const pill=el('span','relicpop-dr',RARITY[r.rar]); pill.style.color='var(--r'+r.rar+')'; dh.appendChild(pill);
    det.appendChild(dh);
    det.appendChild(el('div','relicpop-dd',r.d));
    det.appendChild(el('div','relicpop-dnote',r.act?'Costs mana · spends your turn':'Always active · no mana cost'));
    detailWrap.appendChild(det);
  });
  if(!S.relics.length){ list.appendChild(el('div','nothing','No relics yet')); detailWrap.appendChild(el('div','relicpop-detail primary')); }
  pop.appendChild(list); pop.appendChild(detailWrap);
  relicWrap.appendChild(pop);
  bb.appendChild(relicWrap);

  const rb=el('button','btn reroll');
  rb.appendChild(ico('reroll','t')); rb.appendChild(el('span',null,'REROLL '+S.rerolls));
  rb.onclick=()=>{ SFX.ui();
    const pickd=S.party.filter(u=>u.rsel&&u.hp>0&&!u.used&&!u.heavy&&!u.frozen).map(u=>u.uid);
    const use=pickd.length?pickd:S.party.filter(u=>u.hp>0&&!u.used&&!u.heavy&&!u.frozen).map(u=>u.uid);
