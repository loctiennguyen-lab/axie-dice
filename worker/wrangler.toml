# One Worker serves the whole game: the static build out of R2, and the Axie lookup proxy at
# /api/axie. Same origin for both, which is why the game needs no CORS at all any more.
name = "axie-dice"
main = "src/index.js"
compatibility_date = "2026-09-21"

# Publish on the free *.workers.dev subdomain. Attach a custom domain later in the dashboard
# (Workers -> axie-dice -> Settings -> Domains) without touching the game: the build reads its
# own origin, so it follows whatever host answers.
workers_dev = true

# The bucket the build was uploaded to. Reading it through this binding costs no egress and
# is not subject to the r2.dev rate limit, which is development-only by Cloudflare's own docs.
[[r2_buckets]]
binding = "GAME"
bucket_name = "axie-dice"

[observability]
enabled = true

# Google sign-in (Google Cloud project "axie-dice", owner tienloc031612@gmail.com).
# The client ID is public by design; GOOGLE_CLIENT_SECRET and SESSION_SIGNING_KEY are Worker
# secrets set with `npx wrangler secret put`, never written here.
[vars]
GOOGLE_CLIENT_ID = "597753927078-rn7b186qo0obgalq3hgpiv6k7g0mk7dl.apps.googleusercontent.com"

# Player profiles, saves and sessions (design: claude/ACCOUNT_SYSTEM_v1.md §4).
[[d1_databases]]
binding = "DB"
database_name = "axie-dice-db"
database_id = "58758c7a-7663-4008-a9de-05490d950a9e"

# Rate limits on sign-in and cloud saves (worker/src/accounts.js, "rate limits"). Per Cloudflare
# location and eventually consistent: abuse protection, not exact accounting. Period must be 10
# or 60. Needs wrangler >= 4.36. namespace_id only has to be unique within the account.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "SAVE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# ---------------------------------------------------------------- RunDO (server-rolled dice)
# One Durable Object per run (ADR server-authoritative-rng 4.6). Needs the Workers Paid plan.
# The class name RunDO is frozen: renaming or deleting a DO class is a migration that cannot be
# rolled back safely. Never edit an existing tag below; add a new [[migrations]] entry instead.
[[durable_objects.bindings]]
name = "RUN_DO"
class_name = "RunDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunDO"]

# Cron: sweeps runs stuck in 'pending' (src/runs.js sweepPending).
[triggers]
crons = ["*/5 * * * *"]

# Secrets (never here): RUN_TOKEN_KEY signs run tokens; it is separate from SESSION_SIGNING_KEY.
# Optional vars: RUNS_PER_DAY (default 20), SUPPORTED_RULES (comma list, default in src/run_do.js).

[[ratelimits]]
name = "RUN_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# ---------------------------------------------------------------- staging
# `wrangler deploy --env staging` makes a SEPARATE Worker "axie-dice-staging" with its own D1, R2
# bucket and Durable Object namespace, so nothing here can touch production data. Wrangler does not
# inherit bindings into an environment, so each one is repeated. Before first use (Liam, once):
#   npx wrangler d1 create axie-dice-db-staging      -> paste the id below
#   npx wrangler r2 bucket create axie-dice-staging
#   npx wrangler d1 migrations apply axie-dice-db-staging --env staging --remote
#   npx wrangler secret put SESSION_SIGNING_KEY --env staging   (and RUN_TOKEN_KEY, GOOGLE_CLIENT_SECRET)
# Google sign-in on staging needs the staging origin added as a redirect URI in the Google Cloud
# console, and PUBLIC_ORIGIN set to it. Until then, insert a test session straight into staging D1.
[env.staging]
name = "axie-dice-staging"
workers_dev = true

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.observability]
enabled = true

[env.staging.vars]
# Lets staging create ranked/mission runs (refused with 403 not_available elsewhere).
ALLOW_GATED_MODES = "1"
GOOGLE_CLIENT_ID = "597753927078-rn7b186qo0obgalq3hgpiv6k7g0mk7dl.apps.googleusercontent.com"

[[env.staging.r2_buckets]]
binding = "GAME"
bucket_name = "axie-dice-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "axie-dice-db-staging"
database_id = "REPLACE_AFTER_d1_create"

[[env.staging.durable_objects.bindings]]
name = "RUN_DO"
class_name = "RunDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RunDO"]

[[env.staging.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2001"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "SAVE_LIMITER"
namespace_id = "2002"

  [env.staging.ratelimits.simple]
  limit = 60
  period = 60

[[env.staging.ratelimits]]
name = "RUN_LIMITER"
namespace_id = "2003"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60
