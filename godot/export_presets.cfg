; ---------------------------------------------------------------------------
; L1 desktop presets (lane R, 12/10). Unsigned/ad-hoc only: no Developer ID,
; no notarization, no Windows Authenticode. Testers open them by hand
; (see production/qa/l1-install-guide.md). Filters match the Web preset so the
; same assets reach every platform.
; Output paths are placeholders; tools/build_desktop.sh passes the real path on
; the command line and writes into build/ (gitignored).
; ---------------------------------------------------------------------------

