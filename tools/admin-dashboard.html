<!--
  Admin-only telemetry dashboard (docs/architecture/telemetry-dashboard-design.md §4).
  Static, no-build, no-framework — same conventions as the rest of this project.
  NOT part of build.py's single-file game assembly; deployed alongside it as its
  own file (see vercel.json buildCommand) and never linked from the game's menu.
  The page itself isn't secret (its URL is guessable), but every /api/admin-stats
  call requires the ADMIN_DASHBOARD_TOKEN entered below — without it the API
  just 401s. Reads aggregate counters only; no per-player raw data is exposed.
-->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Axie Dice Tactics — Admin Stats</title>
<style>
  :root{--bg:#12141c;--pan:#1b1e2b;--pan2:#20243490;--line:#2c3044;--txt:#e8e8ee;--dim:#8c90a4;--acc:#ffd76a;--good:#5fd68a;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px}
  h1{font-size:20px;letter-spacing:1px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 20px}
  .gate{max-width:360px;margin:80px auto;text-align:center}
  .gate input{width:100%;padding:10px;background:var(--pan);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:14px;margin:12px 0}
  .gate button,.reload{padding:10px 16px;background:var(--acc);border:none;border-radius:6px;color:#1a1200;font-weight:700;cursor:pointer}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
  .card{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:16px}
  .card .v{font-size:26px;font-weight:700;color:var(--acc)}
  .card .l{font-size:12px;color:var(--dim);letter-spacing:.5px;margin-top:4px}
  .sec{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px}
  .sec h2{font-size:13px;letter-spacing:1px;color:var(--dim);margin:0 0 12px;text-transform:uppercase}
  .barrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
  .barrow .lbl{width:110px;color:var(--dim);flex:none}
  .barrow .track{flex:1;background:var(--pan2);border-radius:3px;overflow:hidden;height:14px}
  .barrow .fill{background:var(--acc);height:100%}
  .barrow .n{width:44px;text-align:right;color:var(--txt);flex:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  #err{color:var(--bad);font-size:13px}
  #app{display:none}
</style>
</head><body>
<div class="gate" id="gate">
  <h1>ADMIN STATS</h1>
  <div class="sub">Enter the ADMIN_DASHBOARD_TOKEN configured on the server.</div>
  <input id="tok" type="password" placeholder="Admin token" autocomplete="off">
  <div><button id="go">LOAD</button></div>
  <div class="err" id="gateErr"></div>
</div>
<div id="app">
  <div class="topbar">
    <div>
      <h1>AXIE DICE TACTICS — ADMIN STATS</h1>
      <div class="sub" id="range"></div>
    </div>
    <button class="reload" id="reload">RELOAD</button>
  </div>
  <div id="err"></div>
  <div class="grid" id="summary"></div>
  <div class="sec"><h2>Daily Active Users (last 30 days)</h2><div id="dau"></div></div>
  <div class="sec"><h2>Signups / Logins (last 30 days)</h2><div id="signups"></div></div>
  <div class="sec"><h2>Run Funnel</h2><div id="funnel"></div></div>
  <div class="sec"><h2>Wave Reached (all-time)</h2><div id="wave"></div></div>
</div>
<script>
const TOK_KEY='adt_admin_token';
function bar(container,label,value,max){
  const row=document.createElement('div'); row.className='barrow';
  const pct=max>0?Math.max(2,Math.round(value/max*100)):0;
  row.innerHTML='<div class="lbl">'+label+'</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="n">'+value+'</div>';
  container.appendChild(row);
}
function fmtMs(ms){ if(!ms) return '0s'; const s=Math.round(ms/1000); const m=Math.floor(s/60); return m>0?(m+'m '+(s%60)+'s'):(s+'s'); }

async function load(token){
  const errEl=document.getElementById('err'); errEl.textContent='';
  let r,data;
  try{ r=await fetch('/api/admin-stats?days=30',{headers:{Authorization:'Bearer '+token}}); data=await r.json(); }
  catch(e){ errEl.textContent='Network error loading stats.'; return; }
  if(r.status===401){ localStorage.removeItem(TOK_KEY); document.getElementById('app').style.display='none'; document.getElementById('gate').style.display='block'; document.getElementById('gateErr').textContent='Invalid admin token.'; return; }
  if(!data.configured){ errEl.textContent=data.error||'Not configured on this server yet.'; return; }

  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('range').textContent=data.daily.length+' days · '+data.daily[0].date+' → '+data.daily[data.daily.length-1].date;

  const t=data.totals;
  const runsEnded=(t['runs_ended:win']||0)+(t['runs_ended:loss']||0)+(t['runs_ended:quit']||0);
  const runsStarted=t.runs_started||0;
  const winRate=runsEnded>0?Math.round((t['runs_ended:win']||0)/runsEnded*100):0;
  const avgDur=t.duration_count>0?Math.round(t.duration_sum_ms/t.duration_count):0;

  const summary=document.getElementById('summary'); summary.innerHTML='';
  const cards=[
    ['Players (lifetime)',data.players],
    ['Accounts created',t.accounts_created||0],
    ['Logins',t.logins||0],
    ['Runs started',runsStarted],
    ['Runs ended',runsEnded],
    ['Implied abandoned',Math.max(0,runsStarted-runsEnded)],
    ['Win rate',winRate+'%'],
    ['Avg run length',fmtMs(avgDur)],
  ];
  cards.forEach(([l,v])=>{ const c=document.createElement('div'); c.className='card'; c.innerHTML='<div class="v">'+v+'</div><div class="l">'+l+'</div>'; summary.appendChild(c); });

  const dauEl=document.getElementById('dau'); dauEl.innerHTML='';
  const maxDau=Math.max(1,...data.daily.map(d=>d.dau||0));
  data.daily.forEach(d=>bar(dauEl,d.date,d.dau||0,maxDau));

  const sigEl=document.getElementById('signups'); sigEl.innerHTML='';
  const maxSig=Math.max(1,...data.daily.map(d=>Math.max(d.accounts_created||0,d.logins||0)));
  data.daily.forEach(d=>{
    bar(sigEl,d.date+' (signup)',d.accounts_created||0,maxSig);
    bar(sigEl,d.date+' (login)',d.logins||0,maxSig);
  });

  const funEl=document.getElementById('funnel'); funEl.innerHTML='';
  const maxFun=Math.max(1,runsStarted);
  bar(funEl,'Started',runsStarted,maxFun);
  bar(funEl,'Won',t['runs_ended:win']||0,maxFun);
  bar(funEl,'Lost',t['runs_ended:loss']||0,maxFun);
  bar(funEl,'Quit',t['runs_ended:quit']||0,maxFun);
  bar(funEl,'Abandoned (implied)',Math.max(0,runsStarted-runsEnded),maxFun);

  const waveEl=document.getElementById('wave'); waveEl.innerHTML='';
  const wh=data.waveHistogram;
  const waveKeys=Object.keys(wh).map(Number).sort((a,b)=>a-b);
  const maxWave=Math.max(1,...waveKeys.map(k=>wh[k]));
  waveKeys.forEach(k=>bar(waveEl,'Wave '+k,wh[k],maxWave));
}

document.getElementById('go').onclick=()=>{
  const t=document.getElementById('tok').value.trim();
  if(!t) return;
  localStorage.setItem(TOK_KEY,t);
  load(t);
};
document.getElementById('reload').onclick=()=>{
  const t=localStorage.getItem(TOK_KEY);
  if(t) load(t);
};
(function(){
  const saved=localStorage.getItem(TOK_KEY);
  if(saved){ document.getElementById('tok').value=saved; load(saved); }
})();
</script>
</body></html>
