# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: echo_ticket_price
    status: active              # proposal approved by Liam 10/10/2026, not yet in a GDD
    source: design/proposals/economy-v2.md
    referenced_by:
      - design/proposals/economy-v2.md
      - design/proposals/echobox-pass-v2.md
    variables:
      - k                       # 1-based order of the Shard-bought ticket in the UTC day
    output_range: [200, 825]    # k=1 -> 200 ; k=30 -> 825
    expression: "round5(200 * 1.05^(k-1))"
    notes: "Total cost of n tickets in one day C(n) = 4000 * (1.05^n - 1). One shared ladder for both boxes."
    added: 2026-10-10
    revised: ""

  - name: season_box_hard_bound
    status: active              # proposal approved by Liam 10/10/2026, not yet in a GDD
    source: design/proposals/economy-v2.md
    referenced_by:
      - design/proposals/economy-v2.md
      - design/proposals/echobox-pass-v2.md
    variables:
      - N_t                     # per-tier cap (Epic 10, Legendary 20, Mythic 40)
      - h_t                     # number of higher tiers
      - items_t                 # items in tier (6 / 3 / 2)
    output_range: [1, 80]
    expression: "B = max over tiers of items_t * (N_t + h_t) = max(72, 63, 80) = 80 pulls"
    notes: "Full season set guaranteed within 80 pulls (400 tickets). Typical ~55 pulls. Liam kept the 80 cap (10/10)."
    added: 2026-10-10
    revised: ""

