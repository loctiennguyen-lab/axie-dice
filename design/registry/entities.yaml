      - design/proposals/echobox-pass-v2.md
    category: currency
    role: "soft currency earned from runs, daily reward, Pass; spent ONLY on Echo tickets and the one-time stat-unlock shop. Echo Box and duplicate conversion never pay Shard (ECO-3)"
    added: 2026-10-10
    revised: ""

  - name: land_stone
    status: active              # proposal approved by Liam 10/10/2026, not yet in a GDD
    source: design/proposals/economy-v2.md
    referenced_by:
      - design/proposals/economy-v2.md
      - design/proposals/echobox-pass-v2.md
    category: currency
    role: "Land-upgrade currency; spent ONLY on Land tiers (ECO-1). Faucets: Echo Box reward type, daily reward, weekly bonus, Pass, future missions"
    added: 2026-10-10
    revised: ""

  - name: echo_ticket
    status: active              # proposal approved by Liam 10/10/2026, not yet in a GDD
    source: design/proposals/economy-v2.md
    referenced_by:
      - design/proposals/economy-v2.md
      - design/proposals/echobox-pass-v2.md
    category: ticket
    note: "ONE ticket type for both boxes (no season_ticket). Bought with Gene Shard, or granted by Pass / duplicate conversion / starter / bundle. Pass, recycled, starter and bundle tickets do not advance the price ladder"
    base_price_shard: 200
    price_growth_per_ticket_bought_in_day: 1.05
    price_formula: "round5(200 * 1.05^(k-1)), k = order of Shard-bought ticket in the UTC day"
    buy_cap_per_day: 30
    hold_cap: 999
    added: 2026-10-10
    revised: ""

  - name: echo_fragment
    status: active              # proposal approved by Liam 10/10/2026, not yet in a GDD
    source: design/proposals/economy-v2.md
    referenced_by:
      - design/proposals/economy-v2.md
      - design/proposals/echobox-pass-v2.md
    category: conversion_material
    note: "Not a currency (Liam rejected a new currency). Duplicate cosmetic converts to fragments; 10 fragments = 1 echo_ticket. Fragments and tickets never convert to Shard or Stone"
    fragments_per_ticket: 10
    fragments_by_rarity:
      common: 3
      uncommon: 5
      rare: 10
      epic: 20
      legendary: 40
      mythic: 80
    added: 2026-10-10
    revised: ""

